apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: blue-environment-network-policy
  namespace: reverse-tender-blue
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow ingress from ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8001  # auth-service
    - protocol: TCP
      port: 8002  # user-service
    - protocol: TCP
      port: 8006  # payment-service
    - protocol: TCP
      port: 8007  # notification-service
    - protocol: TCP
      port: 8009  # gateway-service
  
  # Allow inter-service communication within blue environment
  - from:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 8001
    - protocol: TCP
      port: 8002
    - protocol: TCP
      port: 8006
    - protocol: TCP
      port: 8007
    - protocol: TCP
      port: 8009
  
  # Allow monitoring from monitoring namespace
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 8080  # metrics port
  
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  
  # Allow communication to other services in same namespace
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 8001
    - protocol: TCP
      port: 8002
    - protocol: TCP
      port: 8006
    - protocol: TCP
      port: 8007
    - protocol: TCP
      port: 8009
  
  # Allow database connections (adjust based on your database setup)
  - to: []
    ports:
    - protocol: TCP
      port: 3306  # MySQL
    - protocol: TCP
      port: 5432  # PostgreSQL
  
  # Allow HTTPS for external API calls
  - to: []
    ports:
    - protocol: TCP
      port: 443
  
  # Allow HTTP for health checks and external services
  - to: []
    ports:
    - protocol: TCP
      port: 80

