---
# External Secret for TLS Certificates
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tls-certificates
  namespace: reverse-tender-blue
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: tls-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .tls_cert | b64dec }}"
        tls.key: "{{ .tls_key | b64dec }}"
  data:
  - secretKey: tls_cert
    remoteRef:
      key: reverse-tender/tls
      property: certificate
  - secretKey: tls_key
    remoteRef:
      key: reverse-tender/tls
      property: private_key
---
# Secret rotation policy
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rotating-secrets
  namespace: reverse-tender-blue
  annotations:
    external-secrets.io/rotation-policy: "automatic"
    external-secrets.io/rotation-interval: "7d"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: rotating-secret
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      type: Opaque
      metadata:
        annotations:
          reloader.stakater.com/match: "true"
      data:
        OAUTH_CLIENT_SECRET: "{{ .oauth_client_secret }}"
        WEBHOOK_SECRET: "{{ .webhook_secret }}"
  data:
  - secretKey: oauth_client_secret
    remoteRef:
      key: reverse-tender/rotating
      property: oauth_client_secret
  - secretKey: webhook_secret
    remoteRef:
      key: reverse-tender/rotating
      property: webhook_secret
---
