---
# External Secret for API Keys
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api-keys
  namespace: reverse-tender-blue
spec:
  refreshInterval: 30m
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: api-keys-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        STRIPE_API_KEY: "{{ .stripe_api_key }}"
        SENDGRID_API_KEY: "{{ .sendgrid_api_key }}"
        JWT_SECRET: "{{ .jwt_secret }}"
        APP_KEY: "{{ .app_key }}"
        SLACK_WEBHOOK_URL: "{{ .slack_webhook_url }}"
  data:
  - secretKey: stripe_api_key
    remoteRef:
      key: reverse-tender/api-keys
      property: stripe_api_key
  - secretKey: sendgrid_api_key
    remoteRef:
      key: reverse-tender/api-keys
      property: sendgrid_api_key
  - secretKey: jwt_secret
    remoteRef:
      key: reverse-tender/api-keys
      property: jwt_secret
  - secretKey: app_key
    remoteRef:
      key: reverse-tender/api-keys
      property: app_key
  - secretKey: slack_webhook_url
    remoteRef:
      key: reverse-tender/api-keys
      property: slack_webhook_url
---
