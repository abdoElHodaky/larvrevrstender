apiVersion: v1
kind: Namespace
metadata:
  name: load-balancing-system
---
# Advanced Load Balancer Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-advanced-config
  namespace: load-balancing-system
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;
    
    events {
        worker_connections 4096;
        use epoll;
        multi_accept on;
    }
    
    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        
        # Logging format
        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" "$http_x_forwarded_for" '
                       'rt=$request_time uct="$upstream_connect_time" '
                       'uht="$upstream_header_time" urt="$upstream_response_time"';
        
        access_log /var/log/nginx/access.log main;
        
        # Performance optimizations
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        keepalive_requests 1000;
        types_hash_max_size 2048;
        client_max_body_size 100M;
        
        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types
            text/plain
            text/css
            text/xml
            text/javascript
            application/json
            application/javascript
            application/xml+rss
            application/atom+xml
            image/svg+xml;
        
        # Rate limiting
        limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
        limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
        limit_req_zone $binary_remote_addr zone=payment:10m rate=5r/s;
        
        # Connection limiting
        limit_conn_zone $binary_remote_addr zone=perip:10m;
        limit_conn_zone $server_name zone=perserver:10m;
        
        # Upstream definitions with advanced load balancing
        upstream blue_gateway {
            least_conn;
            server gateway-service.reverse-tender-blue.svc.cluster.local:8009 max_fails=3 fail_timeout=30s weight=5;
            server gateway-service-2.reverse-tender-blue.svc.cluster.local:8009 max_fails=3 fail_timeout=30s weight=5;
            server gateway-service-3.reverse-tender-blue.svc.cluster.local:8009 max_fails=3 fail_timeout=30s weight=3;
            keepalive 32;
        }
        
        upstream green_gateway {
            least_conn;
            server gateway-service.reverse-tender-green.svc.cluster.local:8009 max_fails=3 fail_timeout=30s weight=5;
            server gateway-service-2.reverse-tender-green.svc.cluster.local:8009 max_fails=3 fail_timeout=30s weight=5;
            server gateway-service-3.reverse-tender-green.svc.cluster.local:8009 max_fails=3 fail_timeout=30s weight=3;
            keepalive 32;
        }
        
        upstream blue_auth {
            ip_hash;  # Session affinity for auth
            server auth-service.reverse-tender-blue.svc.cluster.local:8001 max_fails=2 fail_timeout=20s;
            server auth-service-2.reverse-tender-blue.svc.cluster.local:8001 max_fails=2 fail_timeout=20s;
            keepalive 16;
        }
        
        upstream green_auth {
            ip_hash;
            server auth-service.reverse-tender-green.svc.cluster.local:8001 max_fails=2 fail_timeout=20s;
            server auth-service-2.reverse-tender-green.svc.cluster.local:8001 max_fails=2 fail_timeout=20s;
            keepalive 16;
        }
        
        upstream blue_payment {
            least_time header;  # Fastest response time for payments
            server payment-service.reverse-tender-blue.svc.cluster.local:8006 max_fails=1 fail_timeout=10s weight=10;
            server payment-service-2.reverse-tender-blue.svc.cluster.local:8006 max_fails=1 fail_timeout=10s weight=10;
            server payment-service-3.reverse-tender-blue.svc.cluster.local:8006 max_fails=1 fail_timeout=10s weight=8;
            keepalive 64;
        }
        
        upstream green_payment {
            least_time header;
            server payment-service.reverse-tender-green.svc.cluster.local:8006 max_fails=1 fail_timeout=10s weight=10;
            server payment-service-2.reverse-tender-green.svc.cluster.local:8006 max_fails=1 fail_timeout=10s weight=10;
            server payment-service-3.reverse-tender-green.svc.cluster.local:8006 max_fails=1 fail_timeout=10s weight=8;
            keepalive 64;
        }
        
        # Health check configuration
        upstream blue_health {
            server gateway-service.reverse-tender-blue.svc.cluster.local:8009;
            check interval=3000 rise=2 fall=3 timeout=1000 type=http;
            check_http_send "GET /health HTTP/1.0\r\n\r\n";
            check_http_expect_alive http_2xx http_3xx;
        }
        
        upstream green_health {
            server gateway-service.reverse-tender-green.svc.cluster.local:8009;
            check interval=3000 rise=2 fall=3 timeout=1000 type=http;
            check_http_send "GET /health HTTP/1.0\r\n\r\n";
            check_http_expect_alive http_2xx http_3xx;
        }
        
        # Map for environment selection
        map $cookie_environment $target_env {
            default "blue";
            "green" "green";
            "blue" "blue";
        }
        
        # Map for A/B testing
        map $remote_addr $ab_test {
            ~^.*[02468]$ "blue";   # Even IP addresses -> blue
            ~^.*[13579]$ "green";  # Odd IP addresses -> green
            default "blue";
        }
        
        # Canary deployment weight
        split_clients $remote_addr $canary_deployment {
            10% "green";  # 10% traffic to green (canary)
            * "blue";     # 90% traffic to blue (stable)
        }
        
        server {
            listen 80;
            server_name api.reverse-tender.com;
            
            # Security headers
            add_header X-Frame-Options DENY;
            add_header X-Content-Type-Options nosniff;
            add_header X-XSS-Protection "1; mode=block";
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
            
            # Rate limiting
            limit_req zone=api burst=200 nodelay;
            limit_conn perip 50;
            limit_conn perserver 1000;
            
            # Health check endpoint
            location /health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }
            
            # Metrics endpoint for Prometheus
            location /nginx_status {
                stub_status on;
                access_log off;
                allow 10.0.0.0/8;
                allow 172.16.0.0/12;
                allow 192.168.0.0/16;
                deny all;
            }
            
            # API Gateway routing with advanced load balancing
            location / {
                # Choose upstream based on deployment strategy
                set $upstream "";
                
                # Canary deployment logic
                if ($canary_deployment = "green") {
                    set $upstream "green_gateway";
                }
                if ($canary_deployment = "blue") {
                    set $upstream "blue_gateway";
                }
                
                # Override with cookie-based environment selection
                if ($target_env = "green") {
                    set $upstream "green_gateway";
                }
                if ($target_env = "blue") {
                    set $upstream "blue_gateway";
                }
                
                # Proxy configuration
                proxy_pass http://$upstream;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_cache_bypass $http_upgrade;
                
                # Timeouts
                proxy_connect_timeout 5s;
                proxy_send_timeout 60s;
                proxy_read_timeout 60s;
                
                # Retry logic
                proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
                proxy_next_upstream_tries 3;
                proxy_next_upstream_timeout 10s;
                
                # Buffer settings
                proxy_buffering on;
                proxy_buffer_size 4k;
                proxy_buffers 8 4k;
                proxy_busy_buffers_size 8k;
            }
            
            # Authentication service with session affinity
            location /auth/ {
                limit_req zone=auth burst=20 nodelay;
                
                set $auth_upstream "";
                if ($target_env = "green") {
                    set $auth_upstream "green_auth";
                }
                if ($target_env = "blue") {
                    set $auth_upstream "blue_auth";
                }
                
                proxy_pass http://$auth_upstream;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                
                # Session affinity
                proxy_set_header X-Session-ID $cookie_session_id;
                
                # Shorter timeouts for auth
                proxy_connect_timeout 3s;
                proxy_send_timeout 30s;
                proxy_read_timeout 30s;
            }
            
            # Payment service with high availability
            location /payment/ {
                limit_req zone=payment burst=10 nodelay;
                
                set $payment_upstream "";
                if ($target_env = "green") {
                    set $payment_upstream "green_payment";
                }
                if ($target_env = "blue") {
                    set $payment_upstream "blue_payment";
                }
                
                proxy_pass http://$payment_upstream;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                
                # Strict timeouts for payments
                proxy_connect_timeout 2s;
                proxy_send_timeout 30s;
                proxy_read_timeout 30s;
                
                # No retries for payment operations
                proxy_next_upstream off;
            }
            
            # Static content caching
            location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                add_header Vary Accept-Encoding;
                
                # Serve from CDN or static upstream
                try_files $uri @static_upstream;
            }
            
            location @static_upstream {
                proxy_pass http://static-content.reverse-tender.com;
                proxy_cache static_cache;
                proxy_cache_valid 200 1d;
                proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            }
        }
        
        # SSL/TLS server block
        server {
            listen 443 ssl http2;
            server_name api.reverse-tender.com;
            
            # SSL configuration
            ssl_certificate /etc/ssl/certs/reverse-tender.crt;
            ssl_certificate_key /etc/ssl/private/reverse-tender.key;
            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
            ssl_prefer_server_ciphers off;
            ssl_session_cache shared:SSL:10m;
            ssl_session_timeout 10m;
            
            # OCSP stapling
            ssl_stapling on;
            ssl_stapling_verify on;
            
            # Include the same location blocks as HTTP server
            include /etc/nginx/conf.d/locations.conf;
        }
        
        # Cache configuration
        proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:10m max_size=1g inactive=60m use_temp_path=off;
        proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=10m use_temp_path=off;
    }
---
# Advanced Load Balancer Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: advanced-load-balancer
  namespace: load-balancing-system
  labels:
    app: advanced-load-balancer
spec:
  replicas: 3
  selector:
    matchLabels:
      app: advanced-load-balancer
  template:
    metadata:
      labels:
        app: advanced-load-balancer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9113"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
          name: http
        - containerPort: 443
          name: https
        securityContext:
          runAsNonRoot: true
          runAsUser: 101
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-logs
          mountPath: /var/log/nginx
        - name: ssl-certs
          mountPath: /etc/ssl/certs
          readOnly: true
        - name: ssl-private
          mountPath: /etc/ssl/private
          readOnly: true
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
      - name: nginx-exporter
        image: nginx/nginx-prometheus-exporter:0.11.0
        ports:
        - containerPort: 9113
          name: metrics
        args:
        - -nginx.scrape-uri=http://localhost/nginx_status
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          capabilities:
            drop:
            - ALL
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-advanced-config
      - name: nginx-cache
        emptyDir: {}
      - name: nginx-logs
        emptyDir: {}
      - name: ssl-certs
        secret:
          secretName: reverse-tender-tls-cert
      - name: ssl-private
        secret:
          secretName: reverse-tender-tls-key
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - advanced-load-balancer
              topologyKey: kubernetes.io/hostname
---
# Load Balancer Service
apiVersion: v1
kind: Service
metadata:
  name: advanced-load-balancer
  namespace: load-balancing-system
  labels:
    app: advanced-load-balancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"
spec:
  type: LoadBalancer
  selector:
    app: advanced-load-balancer
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  - name: https
    port: 443
    targetPort: 443
    protocol: TCP
  sessionAffinity: None
  externalTrafficPolicy: Local
---
# HPA for Load Balancer
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: advanced-load-balancer-hpa
  namespace: load-balancing-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: advanced-load-balancer
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  - type: Pods
    pods:
      metric:
        name: nginx_connections_active
      target:
        type: AverageValue
        averageValue: "100"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      - type: Pods
        value: 5
        periodSeconds: 60
      selectPolicy: Max
---
# ServiceMonitor for Prometheus
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: advanced-load-balancer
  namespace: monitoring
  labels:
    app: advanced-load-balancer
spec:
  selector:
    matchLabels:
      app: advanced-load-balancer
  namespaceSelector:
    matchNames:
    - load-balancing-system
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
---
# Load Balancer Alert Rules
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: load-balancer-alerts
  namespace: monitoring
spec:
  groups:
  - name: load-balancer.rules
    rules:
    - alert: LoadBalancerHighLatency
      expr: histogram_quantile(0.95, rate(nginx_http_request_duration_seconds_bucket[5m])) > 1
      for: 5m
      labels:
        severity: warning
        component: load-balancer
      annotations:
        summary: "Load balancer high latency"
        description: "95th percentile latency is {{ $value }}s, above 1s threshold."
    
    - alert: LoadBalancerHighErrorRate
      expr: rate(nginx_http_requests_total{status=~"5.."}[5m]) / rate(nginx_http_requests_total[5m]) > 0.05
      for: 2m
      labels:
        severity: critical
        component: load-balancer
      annotations:
        summary: "Load balancer high error rate"
        description: "Error rate is {{ $value | humanizePercentage }}, above 5% threshold."
    
    - alert: LoadBalancerConnectionsHigh
      expr: nginx_connections_active > 1000
      for: 5m
      labels:
        severity: warning
        component: load-balancer
      annotations:
        summary: "Load balancer high connection count"
        description: "Active connections ({{ $value }}) above 1000 threshold."
---
# Circuit Breaker Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: circuit-breaker-config
  namespace: load-balancing-system
data:
  circuit-breaker.lua: |
    local circuit_breaker = {}
    
    -- Circuit breaker states
    local CLOSED = "closed"
    local OPEN = "open"
    local HALF_OPEN = "half_open"
    
    -- Configuration
    local failure_threshold = 5
    local recovery_timeout = 30
    local success_threshold = 3
    
    function circuit_breaker.check_and_record(upstream, success)
        local key = "cb:" .. upstream
        local state_key = key .. ":state"
        local failure_key = key .. ":failures"
        local last_failure_key = key .. ":last_failure"
        local success_key = key .. ":successes"
        
        local redis = require "resty.redis"
        local red = redis:new()
        red:connect("redis.load-balancing-system.svc.cluster.local", 6379)
        
        local state = red:get(state_key) or CLOSED
        local current_time = ngx.time()
        
        if state == OPEN then
            local last_failure = tonumber(red:get(last_failure_key) or 0)
            if current_time - last_failure > recovery_timeout then
                red:set(state_key, HALF_OPEN)
                red:del(success_key)
                state = HALF_OPEN
            else
                return false  -- Circuit is open, reject request
            end
        end
        
        if success then
            if state == HALF_OPEN then
                local successes = tonumber(red:incr(success_key))
                if successes >= success_threshold then
                    red:set(state_key, CLOSED)
                    red:del(failure_key)
                    red:del(success_key)
                end
            elseif state == CLOSED then
                red:del(failure_key)
            end
        else
            local failures = tonumber(red:incr(failure_key))
            red:set(last_failure_key, current_time)
            
            if failures >= failure_threshold then
                red:set(state_key, OPEN)
                red:del(success_key)
            end
        end
        
        red:close()
        return true
    end
    
    return circuit_breaker

