heat_template_version: 2021-04-16

description: >
  Main Heat template for deploying Reverse Tender Platform microservices on OpenStack.
  This template creates the complete infrastructure including networking, compute instances,
  load balancers, and databases for all 11 microservices.

parameters:
  environment:
    type: string
    description: Environment name (dev, staging, prod)
    default: dev
    constraints:
      - allowed_values: [dev, staging, prod]
  
  project_name:
    type: string
    description: Project name for resource naming
    default: reverse-tender
  
  key_name:
    type: string
    description: Name of the SSH key pair for instance access
    constraints:
      - custom_constraint: nova.keypair
  
  instance_flavor:
    type: string
    description: Flavor for microservice instances
    default: m1.medium
    constraints:
      - custom_constraint: nova.flavor
  
  database_flavor:
    type: string
    description: Flavor for database instances
    default: m1.large
    constraints:
      - custom_constraint: nova.flavor
  
  image_id:
    type: string
    description: Image ID for instances (Ubuntu 22.04 recommended)
    constraints:
      - custom_constraint: glance.image
  
  external_network:
    type: string
    description: External network for floating IPs
    constraints:
      - custom_constraint: neutron.network
  
  dns_servers:
    type: comma_delimited_list
    description: DNS servers for the network
    default: ["8.8.8.8", "8.8.4.4"]
  
  enable_monitoring:
    type: boolean
    description: Enable monitoring stack (Prometheus/Grafana)
    default: true
  
  enable_trove:
    type: boolean
    description: Use Trove for managed databases
    default: false
  
  replica_count:
    type: number
    description: Number of replicas per microservice
    default: 2
    constraints:
      - range: { min: 1, max: 10 }

resources:
  # Network Infrastructure
  network_stack:
    type: networking-stack.yaml
    properties:
      environment: { get_param: environment }
      project_name: { get_param: project_name }
      external_network: { get_param: external_network }
      dns_servers: { get_param: dns_servers }

  # Database Infrastructure
  database_stack:
    type: database-stack.yaml
    properties:
      environment: { get_param: environment }
      project_name: { get_param: project_name }
      key_name: { get_param: key_name }
      database_flavor: { get_param: database_flavor }
      image_id: { get_param: image_id }
      network_id: { get_attr: [network_stack, private_network_id] }
      subnet_id: { get_attr: [network_stack, database_subnet_id] }
      security_group_id: { get_attr: [network_stack, database_security_group_id] }
      enable_trove: { get_param: enable_trove }

  # Storage Infrastructure
  storage_stack:
    type: storage-stack.yaml
    properties:
      environment: { get_param: environment }
      project_name: { get_param: project_name }

  # Microservices Deployment
  api_gateway:
    type: nested/service-template.yaml
    properties:
      service_name: api-gateway
      service_port: 8000
      environment: { get_param: environment }
      project_name: { get_param: project_name }
      key_name: { get_param: key_name }
      instance_flavor: { get_param: instance_flavor }
      image_id: { get_param: image_id }
      network_id: { get_attr: [network_stack, private_network_id] }
      subnet_id: { get_attr: [network_stack, microservices_subnet_id] }
      security_group_id: { get_attr: [network_stack, microservices_security_group_id] }
      replica_count: { get_param: replica_count }
      database_host: { get_attr: [database_stack, postgresql_host] }
      redis_host: { get_attr: [database_stack, redis_host] }

  auth_service:
    type: nested/service-template.yaml
    properties:
      service_name: auth-service
      service_port: 8001
      environment: { get_param: environment }
      project_name: { get_param: project_name }
      key_name: { get_param: key_name }
      instance_flavor: { get_param: instance_flavor }
      image_id: { get_param: image_id }
      network_id: { get_attr: [network_stack, private_network_id] }
      subnet_id: { get_attr: [network_stack, microservices_subnet_id] }
      security_group_id: { get_attr: [network_stack, microservices_security_group_id] }
      replica_count: { get_param: replica_count }
      database_host: { get_attr: [database_stack, postgresql_host] }
      redis_host: { get_attr: [database_stack, redis_host] }

  bidding_service:
    type: nested/service-template.yaml
    properties:
      service_name: bidding-service
      service_port: 8002
      environment: { get_param: environment }
      project_name: { get_param: project_name }
      key_name: { get_param: key_name }
      instance_flavor: { get_param: instance_flavor }
      image_id: { get_param: image_id }
      network_id: { get_attr: [network_stack, private_network_id] }
      subnet_id: { get_attr: [network_stack, microservices_subnet_id] }
      security_group_id: { get_attr: [network_stack, microservices_security_group_id] }
      replica_count: { get_param: replica_count }
      database_host: { get_attr: [database_stack, postgresql_host] }
      redis_host: { get_attr: [database_stack, redis_host] }

  user_service:
    type: nested/service-template.yaml
    properties:
      service_name: user-service
      service_port: 8003
      environment: { get_param: environment }
      project_name: { get_param: project_name }
      key_name: { get_param: key_name }
      instance_flavor: { get_param: instance_flavor }
      image_id: { get_param: image_id }
      network_id: { get_attr: [network_stack, private_network_id] }
      subnet_id: { get_attr: [network_stack, microservices_subnet_id] }
      security_group_id: { get_attr: [network_stack, microservices_security_group_id] }
      replica_count: { get_param: replica_count }
      database_host: { get_attr: [database_stack, postgresql_host] }
      redis_host: { get_attr: [database_stack, redis_host] }

  order_service:
    type: nested/service-template.yaml
    properties:
      service_name: order-service
      service_port: 8004
      environment: { get_param: environment }
      project_name: { get_param: project_name }
      key_name: { get_param: key_name }
      instance_flavor: { get_param: instance_flavor }
      image_id: { get_param: image_id }
      network_id: { get_attr: [network_stack, private_network_id] }
      subnet_id: { get_attr: [network_stack, microservices_subnet_id] }
      security_group_id: { get_attr: [network_stack, microservices_security_group_id] }
      replica_count: { get_param: replica_count }
      database_host: { get_attr: [database_stack, postgresql_host] }
      redis_host: { get_attr: [database_stack, redis_host] }

  notification_service:
    type: nested/service-template.yaml
    properties:
      service_name: notification-service
      service_port: 8005
      environment: { get_param: environment }
      project_name: { get_param: project_name }
      key_name: { get_param: key_name }
      instance_flavor: { get_param: instance_flavor }
      image_id: { get_param: image_id }
      network_id: { get_attr: [network_stack, private_network_id] }
      subnet_id: { get_attr: [network_stack, microservices_subnet_id] }
      security_group_id: { get_attr: [network_stack, microservices_security_group_id] }
      replica_count: { get_param: replica_count }
      database_host: { get_attr: [database_stack, postgresql_host] }
      redis_host: { get_attr: [database_stack, redis_host] }

  payment_service:
    type: nested/service-template.yaml
    properties:
      service_name: payment-service
      service_port: 8006
      environment: { get_param: environment }
      project_name: { get_param: project_name }
      key_name: { get_param: key_name }
      instance_flavor: { get_param: instance_flavor }
      image_id: { get_param: image_id }
      network_id: { get_attr: [network_stack, private_network_id] }
      subnet_id: { get_attr: [network_stack, microservices_subnet_id] }
      security_group_id: { get_attr: [network_stack, microservices_security_group_id] }
      replica_count: { get_param: replica_count }
      database_host: { get_attr: [database_stack, postgresql_host] }
      redis_host: { get_attr: [database_stack, redis_host] }

  analytics_service:
    type: nested/service-template.yaml
    properties:
      service_name: analytics-service
      service_port: 8007
      environment: { get_param: environment }
      project_name: { get_param: project_name }
      key_name: { get_param: key_name }
      instance_flavor: { get_param: instance_flavor }
      image_id: { get_param: image_id }
      network_id: { get_attr: [network_stack, private_network_id] }
      subnet_id: { get_attr: [network_stack, microservices_subnet_id] }
      security_group_id: { get_attr: [network_stack, microservices_security_group_id] }
      replica_count: { get_param: replica_count }
      database_host: { get_attr: [database_stack, postgresql_host] }
      redis_host: { get_attr: [database_stack, redis_host] }

  vin_ocr_service:
    type: nested/service-template.yaml
    properties:
      service_name: vin-ocr-service
      service_port: 8008
      environment: { get_param: environment }
      project_name: { get_param: project_name }
      key_name: { get_param: key_name }
      instance_flavor: { get_param: instance_flavor }
      image_id: { get_param: image_id }
      network_id: { get_attr: [network_stack, private_network_id] }
      subnet_id: { get_attr: [network_stack, microservices_subnet_id] }
      security_group_id: { get_attr: [network_stack, microservices_security_group_id] }
      replica_count: { get_param: replica_count }
      database_host: { get_attr: [database_stack, postgresql_host] }
      redis_host: { get_attr: [database_stack, redis_host] }

  auction_service:
    type: nested/service-template.yaml
    properties:
      service_name: auction-service
      service_port: 8009
      environment: { get_param: environment }
      project_name: { get_param: project_name }
      key_name: { get_param: key_name }
      instance_flavor: { get_param: instance_flavor }
      image_id: { get_param: image_id }
      network_id: { get_attr: [network_stack, private_network_id] }
      subnet_id: { get_attr: [network_stack, microservices_subnet_id] }
      security_group_id: { get_attr: [network_stack, microservices_security_group_id] }
      replica_count: { get_param: replica_count }
      database_host: { get_attr: [database_stack, postgresql_host] }
      redis_host: { get_attr: [database_stack, redis_host] }

  gateway_service:
    type: nested/service-template.yaml
    properties:
      service_name: gateway-service
      service_port: 8010
      environment: { get_param: environment }
      project_name: { get_param: project_name }
      key_name: { get_param: key_name }
      instance_flavor: { get_param: instance_flavor }
      image_id: { get_param: image_id }
      network_id: { get_attr: [network_stack, private_network_id] }
      subnet_id: { get_attr: [network_stack, microservices_subnet_id] }
      security_group_id: { get_attr: [network_stack, microservices_security_group_id] }
      replica_count: { get_param: replica_count }
      database_host: { get_attr: [database_stack, postgresql_host] }
      redis_host: { get_attr: [database_stack, redis_host] }

  # Load Balancer
  load_balancer:
    type: OS::Octavia::LoadBalancer
    properties:
      name: { str_replace: { template: "lb-PROJECT-ENV", params: { PROJECT: { get_param: project_name }, ENV: { get_param: environment } } } }
      vip_subnet: { get_attr: [network_stack, public_subnet_id] }
      description: Load balancer for microservices

  # Load Balancer Listener
  lb_listener:
    type: OS::Octavia::Listener
    properties:
      name: { str_replace: { template: "listener-PROJECT-ENV", params: { PROJECT: { get_param: project_name }, ENV: { get_param: environment } } } }
      loadbalancer: { get_resource: load_balancer }
      protocol: HTTP
      protocol_port: 80

  # Load Balancer Pool
  lb_pool:
    type: OS::Octavia::Pool
    properties:
      name: { str_replace: { template: "pool-PROJECT-ENV", params: { PROJECT: { get_param: project_name }, ENV: { get_param: environment } } } }
      listener: { get_resource: lb_listener }
      lb_algorithm: ROUND_ROBIN
      protocol: HTTP

  # Health Monitor
  health_monitor:
    type: OS::Octavia::HealthMonitor
    properties:
      pool: { get_resource: lb_pool }
      type: HTTP
      delay: 10
      max_retries: 3
      timeout: 5
      url_path: /health

  # Floating IP for Load Balancer
  lb_floating_ip:
    type: OS::Neutron::FloatingIP
    properties:
      floating_network: { get_param: external_network }
      port_id: { get_attr: [load_balancer, vip_port_id] }

  # Monitoring Stack (optional)
  monitoring_stack:
    type: nested/monitoring-template.yaml
    condition: { get_param: enable_monitoring }
    properties:
      environment: { get_param: environment }
      project_name: { get_param: project_name }
      key_name: { get_param: key_name }
      instance_flavor: { get_param: instance_flavor }
      image_id: { get_param: image_id }
      network_id: { get_attr: [network_stack, private_network_id] }
      subnet_id: { get_attr: [network_stack, monitoring_subnet_id] }
      security_group_id: { get_attr: [network_stack, monitoring_security_group_id] }

conditions:
  enable_monitoring: { get_param: enable_monitoring }

outputs:
  load_balancer_ip:
    description: Public IP address of the load balancer
    value: { get_attr: [lb_floating_ip, floating_ip_address] }
  
  load_balancer_url:
    description: URL to access the application
    value: { str_replace: { template: "http://IP", params: { IP: { get_attr: [lb_floating_ip, floating_ip_address] } } } }
  
  database_host:
    description: Database host address
    value: { get_attr: [database_stack, postgresql_host] }
  
  redis_host:
    description: Redis host address
    value: { get_attr: [database_stack, redis_host] }
  
  monitoring_url:
    description: Monitoring dashboard URL (if enabled)
    condition: enable_monitoring
    value: { get_attr: [monitoring_stack, grafana_url] }
  
  stack_status:
    description: Overall stack deployment status
    value: "Deployment completed successfully"
