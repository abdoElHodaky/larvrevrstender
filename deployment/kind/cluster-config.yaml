# Kind cluster configuration for staging environment
# This configuration creates a multi-node cluster suitable for testing
# the reverse tender application with proper networking and ingress support

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: staging-cluster

# Configure cluster networking
networking:
  # WARNING: It is _strongly_ recommended that you keep this the default
  # (127.0.0.1) for security reasons. However it is possible to change this.
  apiServerAddress: "127.0.0.1"
  # By default the API server listens on a random open port.
  # You may choose a specific port but probably don't need to in most cases.
  # Using a random port makes it easier to spin up multiple clusters.
  apiServerPort: 6443
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"

# Configure nodes
nodes:
# Control plane node
- role: control-plane
  image: kindest/node:v1.29.0
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  # Expose ingress controller ports
  - containerPort: 80
    hostPort: 80
    protocol: TCP
  - containerPort: 443
    hostPort: 443
    protocol: TCP
  # Expose additional ports for services
  - containerPort: 30080
    hostPort: 30080
    protocol: TCP
  - containerPort: 30443
    hostPort: 30443
    protocol: TCP

# Worker nodes for better resource distribution
- role: worker
  image: kindest/node:v1.29.0
  
- role: worker
  image: kindest/node:v1.29.0

# Configure feature gates and runtime config
kubeadmConfigPatches:
- |
  kind: ClusterConfiguration
  apiServer:
    extraArgs:
      enable-admission-plugins: NodeRestriction,MutatingAdmissionWebhook,ValidatingAdmissionWebhook
  controllerManager:
    extraArgs:
      bind-address: 0.0.0.0
  scheduler:
    extraArgs:
      bind-address: 0.0.0.0
- |
  kind: KubeProxyConfiguration
  metricsBindAddress: 0.0.0.0

