# Linode LKE Gateway API Configuration for Reverse Tender Platform
# Optimized for Linode NodeBalancer with NGINX Gateway Fabric

apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: reverse-tender-linode-gateway-class
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: gateway-api
    app.kubernetes.io/part-of: reverse-tender-platform
    app.kubernetes.io/version: "v2.0"
    app.kubernetes.io/cloud-provider: "linode"
  annotations:
    gateway.networking.k8s.io/bundle-version: "v2.0.0"
    gateway.networking.k8s.io/description: "Linode LKE-optimized GatewayClass for JSON-RPC/tRPC microservices with NodeBalancer"
spec:
  # Use NGINX Gateway Fabric for Linode
  controllerName: nginx.org/nginx-gateway-fabric
  
  # Linode-specific parameters
  parametersRef:
    group: gateway.nginx.org
    kind: NginxGateway
    name: reverse-tender-linode-config
    namespace: reverse-tender
  
  description: "Linode LKE-optimized Gateway Class for Reverse Tender Platform - supports JSON-RPC/tRPC patterns with NodeBalancer integration"

---
# NGINX Gateway Configuration for Linode
apiVersion: gateway.nginx.org/v1alpha1
kind: NginxGateway
metadata:
  name: reverse-tender-linode-config
  namespace: reverse-tender
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: gateway-api
    app.kubernetes.io/part-of: reverse-tender-platform
    app.kubernetes.io/cloud-provider: "linode"
spec:
  # NGINX configuration optimized for Linode NodeBalancer
  nginx:
    # Worker processes configuration
    workerProcesses: "auto"
    workerConnections: 1024
    
    # Logging configuration
    logging:
      level: "info"
      format: |
        '$remote_addr - $remote_user [$time_local] "$request" '
        '$status $body_bytes_sent "$http_referer" '
        '"$http_user_agent" "$http_x_forwarded_for" '
        'rt=$request_time uct="$upstream_connect_time" '
        'uht="$upstream_header_time" urt="$upstream_response_time" '
        'nb="$http_x_forwarded_proto"'
    
    # Performance optimizations for NodeBalancer
    config:
      # Connection settings
      keepalive_timeout: "65s"
      keepalive_requests: 100
      
      # Buffer settings for RPC
      client_body_buffer_size: "128k"
      client_max_body_size: "10m"
      client_header_buffer_size: "1k"
      large_client_header_buffers: "4 4k"
      
      # Proxy settings optimized for NodeBalancer
      proxy_connect_timeout: "60s"
      proxy_send_timeout: "60s"
      proxy_read_timeout: "60s"
      proxy_buffer_size: "4k"
      proxy_buffers: "8 4k"
      proxy_busy_buffers_size: "8k"
      
      # Real IP configuration for NodeBalancer
      set_real_ip_from: "192.168.255.0/24"  # NodeBalancer private network
      set_real_ip_from_2: "10.0.0.0/8"      # Private network range
      real_ip_header: "X-Forwarded-For"
      real_ip_recursive: "on"
      
      # Gzip compression
      gzip: "on"
      gzip_vary: "on"
      gzip_min_length: 1000
      gzip_proxied: "any"
      gzip_comp_level: 6
      gzip_types: |
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
      
      # Rate limiting for RPC endpoints
      limit_req_zone: '$binary_remote_addr zone=rpc_limit:10m rate=100r/s'
      limit_req_zone_admin: '$binary_remote_addr zone=admin_limit:10m rate=10r/s'
      
      # Connection limiting
      limit_conn_zone: '$binary_remote_addr zone=conn_limit_per_ip:10m'
      limit_conn: 'conn_limit_per_ip 20'
      
      # NodeBalancer-specific headers
      proxy_set_header_host: '$host'
      proxy_set_header_x_real_ip: '$remote_addr'
      proxy_set_header_x_forwarded_for: '$proxy_add_x_forwarded_for'
      proxy_set_header_x_forwarded_proto: '$scheme'

---
# Linode NodeBalancer Service Configuration
apiVersion: v1
kind: Service
metadata:
  name: reverse-tender-linode-nb-service
  namespace: reverse-tender
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: gateway-api
    app.kubernetes.io/cloud-provider: "linode"
  annotations:
    # Linode NodeBalancer configuration
    service.beta.kubernetes.io/linode-loadbalancer-throttle: "20"
    service.beta.kubernetes.io/linode-loadbalancer-region: "${LINODE_REGION}"
    service.beta.kubernetes.io/linode-loadbalancer-hostname-only-ingress: "true"
    
    # Health check configuration
    service.beta.kubernetes.io/linode-loadbalancer-check-type: "http"
    service.beta.kubernetes.io/linode-loadbalancer-check-path: "/health"
    service.beta.kubernetes.io/linode-loadbalancer-check-body: ""
    service.beta.kubernetes.io/linode-loadbalancer-check-interval: "10"
    service.beta.kubernetes.io/linode-loadbalancer-check-timeout: "5"
    service.beta.kubernetes.io/linode-loadbalancer-check-attempts: "3"
    
    # SSL/TLS configuration
    service.beta.kubernetes.io/linode-loadbalancer-tls: |
      [
        {
          "tls-secret-name": "api-tls-secret",
          "port": 443
        },
        {
          "tls-secret-name": "app-tls-secret", 
          "port": 443
        },
        {
          "tls-secret-name": "admin-tls-secret",
          "port": 443
        },
        {
          "tls-secret-name": "ws-tls-secret",
          "port": 443
        }
      ]
    
    # Session stickiness
    service.beta.kubernetes.io/linode-loadbalancer-default-protocol: "http"
    service.beta.kubernetes.io/linode-loadbalancer-port-443: '{"protocol": "https", "tls-secret-name": "api-tls-secret"}'
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: https
      port: 443
      targetPort: 8443
      protocol: TCP
  selector:
    app.kubernetes.io/name: nginx-gateway

---
# Linode Cloud Firewall Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: reverse-tender-linode-firewall-config
  namespace: reverse-tender
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: gateway-api
    app.kubernetes.io/cloud-provider: "linode"
data:
  firewall-rules.yaml: |
    # Linode Cloud Firewall Rules for Reverse Tender Platform
    inbound_policy: DROP
    outbound_policy: ACCEPT
    
    inbound_rules:
      # Allow HTTP traffic
      - label: "allow-http"
        action: ACCEPT
        protocol: TCP
        ports: "80"
        addresses:
          ipv4: ["0.0.0.0/0"]
          ipv6: ["::/0"]
      
      # Allow HTTPS traffic
      - label: "allow-https"
        action: ACCEPT
        protocol: TCP
        ports: "443"
        addresses:
          ipv4: ["0.0.0.0/0"]
          ipv6: ["::/0"]
      
      # Allow SSH (restrict to admin IPs in production)
      - label: "allow-ssh"
        action: ACCEPT
        protocol: TCP
        ports: "22"
        addresses:
          ipv4: ["0.0.0.0/0"]  # Restrict this in production
      
      # Allow Kubernetes API server
      - label: "allow-k8s-api"
        action: ACCEPT
        protocol: TCP
        ports: "6443"
        addresses:
          ipv4: ["10.2.0.0/16"]  # LKE cluster CIDR
      
      # Allow NodeBalancer health checks
      - label: "allow-nb-health"
        action: ACCEPT
        protocol: TCP
        ports: "10250"
        addresses:
          ipv4: ["192.168.255.0/24"]  # NodeBalancer network
    
    outbound_rules:
      # Allow all outbound traffic (default ACCEPT policy)
      - label: "allow-all-outbound"
        action: ACCEPT
        protocol: TCP
        ports: "1-65535"
        addresses:
          ipv4: ["0.0.0.0/0"]
          ipv6: ["::/0"]

