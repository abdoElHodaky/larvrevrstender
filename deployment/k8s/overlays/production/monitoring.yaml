# Production-specific monitoring configuration
# ServiceMonitor and PrometheusRule resources for production

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: reverse-tender-production
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/environment: production
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: reverse-tender
  endpoints:
    - port: metrics
      interval: 15s
      path: /metrics
      honorLabels: true
    - port: octane-metrics
      interval: 15s
      path: /octane/metrics
      honorLabels: true

---
# Production-specific Prometheus rules
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: reverse-tender-production-rules
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/environment: production
spec:
  groups:
    - name: reverse-tender.production.rules
      interval: 30s
      rules:
        # High error rate alert
        - alert: HighErrorRate
          expr: |
            (
              sum(rate(http_requests_total{status=~"5.."}[5m])) by (service)
              /
              sum(rate(http_requests_total[5m])) by (service)
            ) > 0.05
          for: 2m
          labels:
            severity: critical
            environment: production
          annotations:
            summary: "High error rate detected in {{ $labels.service }}"
            description: "Error rate is {{ $value | humanizePercentage }} for service {{ $labels.service }}"

        # High response time alert
        - alert: HighResponseTime
          expr: |
            histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)) > 2
          for: 5m
          labels:
            severity: warning
            environment: production
          annotations:
            summary: "High response time in {{ $labels.service }}"
            description: "95th percentile response time is {{ $value }}s for service {{ $labels.service }}"

        # Octane worker exhaustion
        - alert: OctaneWorkerExhaustion
          expr: |
            octane_workers_active / octane_workers_total > 0.9
          for: 1m
          labels:
            severity: critical
            environment: production
          annotations:
            summary: "Octane workers nearly exhausted in {{ $labels.service }}"
            description: "{{ $value | humanizePercentage }} of Octane workers are active in {{ $labels.service }}"

        # High memory usage
        - alert: HighMemoryUsage
          expr: |
            (container_memory_usage_bytes / container_spec_memory_limit_bytes) > 0.9
          for: 5m
          labels:
            severity: warning
            environment: production
          annotations:
            summary: "High memory usage in {{ $labels.pod }}"
            description: "Memory usage is {{ $value | humanizePercentage }} in pod {{ $labels.pod }}"

        # Database connection issues
        - alert: DatabaseConnectionIssues
          expr: |
            mysql_up == 0
          for: 1m
          labels:
            severity: critical
            environment: production
          annotations:
            summary: "Database connection issues"
            description: "MySQL database is not responding"

        # Redis connection issues
        - alert: RedisConnectionIssues
          expr: |
            redis_up == 0
          for: 1m
          labels:
            severity: critical
            environment: production
          annotations:
            summary: "Redis connection issues"
            description: "Redis server is not responding"

        # Payment service specific alerts
        - alert: PaymentServiceDown
          expr: |
            up{job="payment-service"} == 0
          for: 30s
          labels:
            severity: critical
            environment: production
          annotations:
            summary: "Payment service is down"
            description: "Payment service has been down for more than 30 seconds"

        # Bidding service WebSocket alerts
        - alert: WebSocketConnectionDrop
          expr: |
            rate(websocket_connections_dropped_total[5m]) > 10
          for: 2m
          labels:
            severity: warning
            environment: production
          annotations:
            summary: "High WebSocket connection drop rate"
            description: "WebSocket connections are dropping at {{ $value }} per second"

---
# Production alerting configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-production-config
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/environment: production
data:
  alertmanager.yml: |
    global:
      smtp_smarthost: 'localhost:587'
      smtp_from: 'alerts@reversetender.com'
      
    route:
      group_by: ['alertname', 'environment']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      receiver: 'production-alerts'
      routes:
        - match:
            severity: critical
          receiver: 'critical-alerts'
          group_wait: 5s
          repeat_interval: 5m
        - match:
            severity: warning
          receiver: 'warning-alerts'
          repeat_interval: 30m

    receivers:
      - name: 'production-alerts'
        email_configs:
          - to: 'devops@reversetender.com'
            subject: '[PRODUCTION] {{ .GroupLabels.alertname }}'
            body: |
              {{ range .Alerts }}
              Alert: {{ .Annotations.summary }}
              Description: {{ .Annotations.description }}
              {{ end }}

      - name: 'critical-alerts'
        email_configs:
          - to: 'oncall@reversetender.com'
            subject: '[CRITICAL] {{ .GroupLabels.alertname }}'
            body: |
              CRITICAL ALERT - Immediate attention required
              {{ range .Alerts }}
              Alert: {{ .Annotations.summary }}
              Description: {{ .Annotations.description }}
              {{ end }}
        # Add Slack/PagerDuty integrations here

      - name: 'warning-alerts'
        email_configs:
          - to: 'monitoring@reversetender.com'
            subject: '[WARNING] {{ .GroupLabels.alertname }}'
            body: |
              {{ range .Alerts }}
              Alert: {{ .Annotations.summary }}
              Description: {{ .Annotations.description }}
              {{ end }}

