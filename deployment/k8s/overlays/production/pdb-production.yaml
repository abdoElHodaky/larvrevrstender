# Production-specific Pod Disruption Budget configuration
# Ensures high availability during production maintenance

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb-production
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: availability
    app.kubernetes.io/environment: production
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: api-gateway

