# Development Environment Secrets
# Contains development-specific secret values

apiVersion: v1
kind: Secret
metadata:
  name: dev-secrets
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: secrets
    app.kubernetes.io/environment: development
type: Opaque
stringData:
  # Development database credentials (less secure for dev)
  DB_PASSWORD: "dev_password_123"
  
  # Development Redis credentials
  REDIS_PASSWORD: "dev_redis_123"
  
  # Development JWT secrets
  JWT_SECRET: "dev_jwt_secret_key_for_development_only"
  JWT_REFRESH_SECRET: "dev_jwt_refresh_secret_key_for_development_only"
  
  # Development Laravel application key
  APP_KEY: "base64:dev_app_key_for_development_environment_only"
  
  # Development encryption keys
  ENCRYPTION_KEY: "dev_encryption_key_for_development_only"
  
  # Development API keys (sandbox/test keys)
  PAYMENT_GATEWAY_API_KEY: "pk_test_development_key"
  PAYMENT_GATEWAY_SECRET: "sk_test_development_secret"
  
  # Development email service credentials
  MAIL_PASSWORD: "dev_mail_password"
  
  # Development SMS service credentials (test mode)
  SMS_API_KEY: "dev_sms_api_key"
  SMS_API_SECRET: "dev_sms_api_secret"
  
  # Development file storage credentials
  AWS_ACCESS_KEY_ID: "dev_aws_access_key"
  AWS_SECRET_ACCESS_KEY: "dev_aws_secret_key"
  
  # Development OAuth credentials
  GOOGLE_CLIENT_SECRET: "dev_google_client_secret"
  FACEBOOK_CLIENT_SECRET: "dev_facebook_client_secret"
  
  # Development webhook secrets
  WEBHOOK_SECRET: "dev_webhook_secret_key"
  
  # Development session encryption
  SESSION_ENCRYPT_KEY: "dev_session_encrypt_key"
