# Secrets for Reverse Tender Platform
# Contains sensitive configuration data for all services
# 
# ⚠️  IMPORTANT: These are TEMPLATE/PLACEHOLDER values only!
# ⚠️  All values starting with "CHANGE_ME_" must be replaced with actual secrets in production
# ⚠️  Do NOT use these placeholder values in any real environment
# 
# Note: These are placeholder values - replace with actual secrets in production

apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Application Secrets
  JWT_SECRET: "CHANGE_ME_jwt_secret_key_here"
  APP_KEY: "base64:CHANGE_ME_app_encryption_key_here"
  
  # Neon PostgreSQL Secrets
  NEON_DATABASE_URL: "postgresql://CHANGE_ME_username:CHANGE_ME_password@CHANGE_ME_host.neon.tech:5432/CHANGE_ME_database?sslmode=require"
  NEON_DB_HOST: "CHANGE_ME_host.neon.tech"
  NEON_DB_USERNAME: "CHANGE_ME_neon_username"
  NEON_DB_PASSWORD: "CHANGE_ME_neon_password"
  NEON_DB_DATABASE: "CHANGE_ME_neon_database"
  
  # Upstash Redis Secrets
  UPSTASH_REDIS_URL: "redis://default:CHANGE_ME_password@CHANGE_ME_redis_host:6379"
  UPSTASH_REDIS_TLS_URL: "rediss://default:CHANGE_ME_password@CHANGE_ME_redis_host:6380"
  
  # External Service API Keys
  # SMS Provider Secrets (MENA-compatible)
  UNIFONIC_API_KEY: "CHANGE_ME_unifonic_api_key"
  MSEGAT_USERNAME: "CHANGE_ME_msegat_username"
  MSEGAT_API_KEY: "CHANGE_ME_msegat_api_key"
  OURSMS_API_KEY: "CHANGE_ME_oursms_api_key"
  INFOBIP_API_KEY: "CHANGE_ME_infobip_api_key"
  SENDGRID_API_KEY: "CHANGE_ME_sendgrid_api_key"
  
  # Cloud Provider Tokens
  DIGITALOCEAN_TOKEN: "CHANGE_ME_do_token"
  LINODE_TOKEN: "CHANGE_ME_linode_token"

---
# TLS Secret for HTTPS
apiVersion: v1
kind: Secret
metadata:
  name: tls-secret
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: tls
type: kubernetes.io/tls
data:
  # Placeholder TLS certificate and key (base64 encoded)
  # Replace with actual certificate data in production
  tls.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCi4uLnBsYWNlaG9sZGVyIGNlcnRpZmljYXRlIGRhdGEuLi4KLS0tLS1FTkQgQ0VSVElGSUNBVEUtLS0tLQ==
  tls.key: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0tCi4uLnBsYWNlaG9sZGVyIHByaXZhdGUga2V5IGRhdGEuLi4KLS0tLS1FTkQgUFJJVkFURSBLRVktLS0tLQ==

---
# Registry Secret for pulling private images
apiVersion: v1
kind: Secret
metadata:
  name: registry-secret
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: registry
type: kubernetes.io/dockerconfigjson
data:
  # Placeholder Docker registry credentials (base64 encoded)
  # Replace with actual registry credentials in production
  # Generate using: kubectl create secret docker-registry registry-secret --docker-server=<server> --docker-username=<username> --docker-password=<password> --dry-run=client -o yaml
  .dockerconfigjson: "CHANGE_ME_docker_config_json_base64_here"
