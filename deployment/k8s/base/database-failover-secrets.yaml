# Database Failover Secrets for Reverse Tender Platform
# Contains sensitive database connection information for all failover providers
# 
# ⚠️  IMPORTANT: These are TEMPLATE/PLACEHOLDER values only!
# ⚠️  All values starting with "CHANGE_ME_" must be replaced with actual secrets in production
# ⚠️  Do NOT use these placeholder values in any real environment

apiVersion: v1
kind: Secret
metadata:
  name: database-failover-secrets
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: database-failover-secrets
    app.kubernetes.io/part-of: reverse-tender-platform
    database.kubernetes.io/type: multi-provider
  annotations:
    secret.kubernetes.io/description: "Database failover secrets for multi-provider setup"
    secret.kubernetes.io/providers: "neon-postgresql,cnpg-postgresql,mongodb-atlas"
type: Opaque
stringData:
  # Primary Database: Neon PostgreSQL Secrets
  NEON_DATABASE_URL: "postgresql://CHANGE_ME_neon_username:CHANGE_ME_neon_password@CHANGE_ME_neon_host.neon.tech:5432/CHANGE_ME_neon_database?sslmode=require"
  NEON_DB_HOST: "CHANGE_ME_neon_host.neon.tech"
  NEON_DB_USERNAME: "CHANGE_ME_neon_username"
  NEON_DB_PASSWORD: "CHANGE_ME_neon_password"
  NEON_DB_DATABASE: "CHANGE_ME_neon_database"
  NEON_API_KEY: "CHANGE_ME_neon_api_key"
  NEON_PROJECT_ID: "CHANGE_ME_neon_project_id"
  NEON_BRANCH_ID: "CHANGE_ME_neon_branch_id"
  NEON_ENDPOINT_ID: "CHANGE_ME_neon_endpoint_id"
  
  # Secondary Database: Cloud-Native PostgreSQL (CNPG) Secrets
  CNPG_DB_HOST: "reverse-tender-postgres-rw.default.svc.cluster.local"
  CNPG_DB_HOST_RO: "reverse-tender-postgres-ro.default.svc.cluster.local"
  CNPG_DB_USERNAME: "CHANGE_ME_cnpg_username"
  CNPG_DB_PASSWORD: "CHANGE_ME_cnpg_password"
  CNPG_DB_DATABASE: "CHANGE_ME_cnpg_database"
  CNPG_SUPERUSER_USERNAME: "postgres"
  CNPG_SUPERUSER_PASSWORD: "CHANGE_ME_cnpg_superuser_password"
  CNPG_REPLICATION_USERNAME: "streaming_replica"
  CNPG_REPLICATION_PASSWORD: "CHANGE_ME_cnpg_replication_password"
  
  # Tertiary Database: MongoDB Atlas Secrets
  MONGODB_ATLAS_CONNECTION_STRING: "mongodb+srv://CHANGE_ME_mongodb_username:CHANGE_ME_mongodb_password@CHANGE_ME_mongodb_cluster.mongodb.net/CHANGE_ME_mongodb_database?retryWrites=true&w=majority"
  MONGODB_ATLAS_HOST: "CHANGE_ME_mongodb_cluster.mongodb.net"
  MONGODB_ATLAS_USERNAME: "CHANGE_ME_mongodb_username"
  MONGODB_ATLAS_PASSWORD: "CHANGE_ME_mongodb_password"
  MONGODB_ATLAS_DATABASE: "CHANGE_ME_mongodb_database"
  MONGODB_ATLAS_API_PUBLIC_KEY: "CHANGE_ME_mongodb_atlas_public_key"
  MONGODB_ATLAS_API_PRIVATE_KEY: "CHANGE_ME_mongodb_atlas_private_key"
  MONGODB_ATLAS_PROJECT_ID: "CHANGE_ME_mongodb_atlas_project_id"
  MONGODB_ATLAS_CLUSTER_NAME: "CHANGE_ME_mongodb_atlas_cluster_name"
  
  # Database Failover Management Secrets
  DB_FAILOVER_WEBHOOK_URL: "CHANGE_ME_failover_webhook_url"
  DB_FAILOVER_WEBHOOK_SECRET: "CHANGE_ME_failover_webhook_secret"
  DB_FAILOVER_NOTIFICATION_EMAIL: "CHANGE_ME_failover_notification_email"
  DB_FAILOVER_SLACK_WEBHOOK: "CHANGE_ME_failover_slack_webhook"
  
  # Backup Storage Secrets
  DB_BACKUP_S3_ACCESS_KEY: "CHANGE_ME_backup_s3_access_key"
  DB_BACKUP_S3_SECRET_KEY: "CHANGE_ME_backup_s3_secret_key"
  DB_BACKUP_S3_BUCKET: "CHANGE_ME_backup_s3_bucket"
  DB_BACKUP_S3_REGION: "CHANGE_ME_backup_s3_region"
  
  # Monitoring Secrets
  DB_MONITORING_API_KEY: "CHANGE_ME_monitoring_api_key"
  DB_METRICS_ENDPOINT: "CHANGE_ME_metrics_endpoint"
  DB_ALERTING_WEBHOOK: "CHANGE_ME_alerting_webhook"

---
# Neon PostgreSQL Specific Secrets
apiVersion: v1
kind: Secret
metadata:
  name: neon-postgresql-secrets
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: database-neon-secrets
    database.kubernetes.io/provider: neon
    database.kubernetes.io/type: postgresql
type: Opaque
stringData:
  # Neon API Credentials
  NEON_API_KEY: "CHANGE_ME_neon_api_key"
  NEON_PROJECT_ID: "CHANGE_ME_neon_project_id"
  NEON_ORGANIZATION_ID: "CHANGE_ME_neon_organization_id"
  
  # Neon Database Connection
  NEON_DATABASE_URL: "postgresql://CHANGE_ME_neon_username:CHANGE_ME_neon_password@CHANGE_ME_neon_host.neon.tech:5432/CHANGE_ME_neon_database?sslmode=require"
  NEON_POOLER_URL: "postgresql://CHANGE_ME_neon_username:CHANGE_ME_neon_password@CHANGE_ME_neon_host-pooler.neon.tech:5432/CHANGE_ME_neon_database?sslmode=require"
  
  # Neon Branch Credentials
  NEON_MAIN_BRANCH_URL: "postgresql://CHANGE_ME_neon_username:CHANGE_ME_neon_password@CHANGE_ME_neon_main_host.neon.tech:5432/CHANGE_ME_neon_database?sslmode=require"
  NEON_DEV_BRANCH_URL: "postgresql://CHANGE_ME_neon_username:CHANGE_ME_neon_password@CHANGE_ME_neon_dev_host.neon.tech:5432/CHANGE_ME_neon_database?sslmode=require"
  NEON_STAGING_BRANCH_URL: "postgresql://CHANGE_ME_neon_username:CHANGE_ME_neon_password@CHANGE_ME_neon_staging_host.neon.tech:5432/CHANGE_ME_neon_database?sslmode=require"

---
# Cloud-Native PostgreSQL (CNPG) Secrets
apiVersion: v1
kind: Secret
metadata:
  name: cnpg-postgresql-secrets
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: database-cnpg-secrets
    database.kubernetes.io/provider: cnpg
    database.kubernetes.io/type: postgresql
type: Opaque
stringData:
  # CNPG Cluster Credentials
  username: "CHANGE_ME_cnpg_username"
  password: "CHANGE_ME_cnpg_password"
  
  # CNPG Superuser Credentials
  superuser-username: "postgres"
  superuser-password: "CHANGE_ME_cnpg_superuser_password"
  
  # CNPG Replication Credentials
  replication-username: "streaming_replica"
  replication-password: "CHANGE_ME_cnpg_replication_password"
  
  # CNPG Backup Credentials
  backup-username: "backup_user"
  backup-password: "CHANGE_ME_cnpg_backup_password"

---
# MongoDB Atlas Secrets
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-atlas-secrets
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: database-mongodb-secrets
    database.kubernetes.io/provider: mongodb-atlas
    database.kubernetes.io/type: mongodb
type: Opaque
stringData:
  # MongoDB Atlas Connection
  MONGODB_URI: "mongodb+srv://CHANGE_ME_mongodb_username:CHANGE_ME_mongodb_password@CHANGE_ME_mongodb_cluster.mongodb.net/CHANGE_ME_mongodb_database?retryWrites=true&w=majority"
  MONGODB_USERNAME: "CHANGE_ME_mongodb_username"
  MONGODB_PASSWORD: "CHANGE_ME_mongodb_password"
  MONGODB_DATABASE: "CHANGE_ME_mongodb_database"
  
  # MongoDB Atlas API Credentials
  MONGODB_ATLAS_PUBLIC_KEY: "CHANGE_ME_mongodb_atlas_public_key"
  MONGODB_ATLAS_PRIVATE_KEY: "CHANGE_ME_mongodb_atlas_private_key"
  MONGODB_ATLAS_PROJECT_ID: "CHANGE_ME_mongodb_atlas_project_id"
  MONGODB_ATLAS_ORG_ID: "CHANGE_ME_mongodb_atlas_org_id"
  
  # MongoDB Atlas Cluster Information
  MONGODB_ATLAS_CLUSTER_NAME: "CHANGE_ME_mongodb_atlas_cluster_name"
  MONGODB_ATLAS_CLUSTER_ENDPOINT: "CHANGE_ME_mongodb_cluster.mongodb.net"
  
  # MongoDB Atlas Backup Credentials
  MONGODB_ATLAS_BACKUP_API_KEY: "CHANGE_ME_mongodb_atlas_backup_api_key"
  MONGODB_ATLAS_BACKUP_SECRET: "CHANGE_ME_mongodb_atlas_backup_secret"
