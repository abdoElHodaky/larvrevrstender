# Pod Disruption Budget configuration for Reverse Tender Platform
# Ensures minimum availability during cluster maintenance and updates

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: availability
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api-gateway

