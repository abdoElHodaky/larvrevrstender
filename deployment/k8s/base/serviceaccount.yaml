# Service Account configuration for Reverse Tender Platform
# Defines identities and permissions for pods

apiVersion: v1
kind: ServiceAccount
metadata:
  name: reverse-tender-sa
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: identity
automountServiceAccountToken: true
imagePullSecrets:
  - name: registry-secret

---
# Service Account for monitoring components
apiVersion: v1
kind: ServiceAccount
metadata:
  name: monitoring-sa
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: monitoring
automountServiceAccountToken: true

---
# Service Account for deployment operations
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployment-sa
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: deployment
automountServiceAccountToken: true

