# RPC-Optimized Services for Reverse Tender Platform Microservices
# Aligned with JSON-RPC/tRPC Gateway API configuration

---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  labels:
    app: gateway-service
    tier: gateway
    protocol: http
    version: v2.0
  annotations:
    service.kubernetes.io/description: "API Gateway for RPC microservices"
    service.kubernetes.io/protocol: "http"
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  - port: 443
    targetPort: 8000
    protocol: TCP
    name: https
  selector:
    app: gateway-service

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  labels:
    app: auth-service
    tier: backend
    protocol: json-rpc
    version: v2.0
    rpc-endpoint: "/rpc/auth"
  annotations:
    service.kubernetes.io/description: "Authentication RPC service"
    service.kubernetes.io/protocol: "json-rpc"
    service.kubernetes.io/rpc-endpoint: "/rpc/auth"
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8001
    protocol: TCP
    name: rpc-http
  selector:
    app: auth-service

