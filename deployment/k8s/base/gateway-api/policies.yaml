# Optimal Gateway API Policies for Reverse Tender Platform
# Following Kubernetes Gateway API v1 best practices for microservices architecture

# Optimal Backend Load Balancing Policy for microservices
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: BackendLBPolicy
metadata:
  name: reverse-tender-lb-policy
  namespace: reverse-tender
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: gateway-api
    app.kubernetes.io/part-of: reverse-tender-platform
    app.kubernetes.io/version: "v1.0"
  annotations:
    gateway.networking.k8s.io/description: "Optimal load balancing for microservices architecture"
spec:
  # Optimal session persistence for stateless microservices
  sessionPersistence:
    sessionName: "RT_SESSION_ID"  # Custom session name for reverse tender
    absoluteTimeout: 1800s        # 30 minutes - optimal for web sessions
    idleTimeout: 900s             # 15 minutes - balance between UX and resources
    type: Cookie
    cookieConfig:
      lifetimeType: Session       # Session cookies for security
  
  # Target all microservices with optimal configuration
  targetRefs:
    - group: ""
      kind: Service
      name: auth-service
    - group: ""
      kind: Service
      name: user-service
    - group: ""
      kind: Service
      name: auction-service
    - group: ""
      kind: Service
      name: bidding-service
    - group: ""
      kind: Service
      name: order-service
    - group: ""
      kind: Service
      name: payment-service
    - group: ""
      kind: Service
      name: notification-service
    - group: ""
      kind: Service
      name: analytics-service
    - group: ""
      kind: Service
      name: vin-ocr-service

---
# Optimal Health Check Policy for microservices
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: HealthCheckPolicy
metadata:
  name: reverse-tender-health-policy
  namespace: reverse-tender
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: gateway-api
    app.kubernetes.io/part-of: reverse-tender-platform
    app.kubernetes.io/version: "v1.0"
  annotations:
    gateway.networking.k8s.io/description: "Optimal health checks for microservices architecture"
spec:
  # Optimal health check configuration for microservices
  default:
    path: "/health"
    interval: 15s              # More frequent checks for better responsiveness
    timeout: 3s               # Faster timeout for microservices
    unhealthyThreshold: 2     # Faster failure detection
    healthyThreshold: 2       # Faster recovery detection
    port: 80
    protocol: HTTP
    httpHeaders:
      - name: "User-Agent"
        value: "Gateway-HealthCheck/1.0"
      - name: "X-Health-Check"
        value: "true"
  
  # Target all microservices with optimal health checks
  targetRefs:
    - group: ""
      kind: Service
      name: auth-service
    - group: ""
      kind: Service
      name: user-service
    - group: ""
      kind: Service
      name: auction-service
    - group: ""
      kind: Service
      name: bidding-service
    - group: ""
      kind: Service
      name: order-service
    - group: ""
      kind: Service
      name: payment-service
    - group: ""
      kind: Service
      name: notification-service
    - group: ""
      kind: Service
      name: analytics-service
    - group: ""
      kind: Service
      name: vin-ocr-service

---
# Optimal Timeout Policy for microservices
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TimeoutPolicy
metadata:
  name: reverse-tender-timeout-policy
  namespace: reverse-tender
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: gateway-api
    app.kubernetes.io/part-of: reverse-tender-platform
    app.kubernetes.io/version: "v1.0"
  annotations:
    gateway.networking.k8s.io/description: "Optimal timeouts for microservices architecture"
spec:
  # Optimal timeout configuration for microservices
  request: 60s              # Longer for file uploads (VIN OCR)
  backendRequest: 45s       # Allow time for ML processing
  
  # Apply to all HTTPRoutes
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: api-routes
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: app-routes
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: admin-routes
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: websocket-routes

---
# Optimal Retry Policy for microservices
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: RetryPolicy
metadata:
  name: reverse-tender-retry-policy
  namespace: reverse-tender
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: gateway-api
    app.kubernetes.io/part-of: reverse-tender-platform
    app.kubernetes.io/version: "v1.0"
  annotations:
    gateway.networking.k8s.io/description: "Optimal retry policy for microservices resilience"
spec:
  # Optimal retry configuration for microservices
  numRetries: 2                # Conservative retries to avoid cascading failures
  perTryTimeout: 15s          # Allow time for microservice processing
  retryOn:
    - "5xx"                   # Server errors
    - "reset"                 # Connection resets
    - "connect-failure"       # Connection failures
    - "refused-stream"        # Stream refused
    - "retriable-4xx"         # Retriable client errors
  backoffPolicy:
    baseInterval: 1s          # Start with 1 second
    maxInterval: 10s          # Cap at 10 seconds
    multiplier: 2             # Exponential backoff
  
  # Backoff configuration
  backoff:
    baseInterval: 1s
    maxInterval: 10s
  
  # Apply to HTTPRoutes
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: api-routes
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: app-routes
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: admin-routes
