        "cnpg": {
          "status": "unknown",
          "priority": 2,
          "type": "postgresql"
        },
        "mongodb": {
          "status": "unknown",
          "priority": 3,
          "type": "mongodb"
        }
      },
      "active_provider": "auto",
      "failover_enabled": true,
      "last_check": "2024-01-01T00:00:00Z"
