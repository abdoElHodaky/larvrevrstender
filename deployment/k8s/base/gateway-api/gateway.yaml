# Optimal Gateway for Reverse Tender Platform
# Following Kubernetes Gateway API v1 best practices for microservices architecture

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: reverse-tender-gateway
  namespace: reverse-tender
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: gateway-api
    app.kubernetes.io/part-of: reverse-tender-platform
    app.kubernetes.io/version: "v1.0"
  annotations:
    # Optimal annotations for microservices architecture
    gateway.networking.k8s.io/description: "Main gateway for reverse tender microservices"
    gateway.networking.k8s.io/managed-by: "reverse-tender-platform"
spec:
  # Reference to the optimal GatewayClass
  gatewayClassName: reverse-tender-gateway-class
  
  # Optimal listeners configuration for microservices architecture
  listeners:
    # Primary HTTPS listener - optimized for API traffic
    - name: https-api
      hostname: "api.reversetender.com"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: api-tls-secret
            kind: Secret
            namespace: reverse-tender
        # Optimal TLS configuration
        options:
          gateway.envoyproxy.io/tls-min-version: "1.2"
          gateway.envoyproxy.io/tls-max-version: "1.3"
          gateway.envoyproxy.io/tls-ciphers: "ECDHE-ECDSA-AES256-GCM-SHA384,ECDHE-RSA-AES256-GCM-SHA384"
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - kind: HTTPRoute
    
    # Frontend application HTTPS listener
    - name: https-app
      hostname: "app.reversetender.com"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: app-tls-secret
            kind: Secret
            namespace: reverse-tender
        options:
          gateway.envoyproxy.io/tls-min-version: "1.2"
          gateway.envoyproxy.io/tls-max-version: "1.3"
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - kind: HTTPRoute
    
    # Admin panel HTTPS listener
    - name: https-admin
      hostname: "admin.reversetender.com"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: admin-tls-secret
            kind: Secret
            namespace: reverse-tender
        options:
          gateway.envoyproxy.io/tls-min-version: "1.2"
          gateway.envoyproxy.io/tls-max-version: "1.3"
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - kind: HTTPRoute
    
    # WebSocket HTTPS listener - optimized for real-time bidding
    - name: https-websocket
      hostname: "ws.reversetender.com"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: ws-tls-secret
            kind: Secret
            namespace: reverse-tender
        options:
          gateway.envoyproxy.io/tls-min-version: "1.2"
          gateway.envoyproxy.io/tls-max-version: "1.3"
          # WebSocket-specific optimizations
          gateway.envoyproxy.io/websocket-enabled: "true"
          gateway.envoyproxy.io/connection-idle-timeout: "300s"
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - kind: HTTPRoute
    
    # HTTP listener for redirects - security best practice
    - name: http-redirect
      hostname: "*.reversetender.com"
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - kind: HTTPRoute

  # Optimal addresses configuration
  addresses:
    - type: NamedAddress
      value: reverse-tender-gateway-lb
