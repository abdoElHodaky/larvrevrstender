---
# WebSocket routes for real-time features
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: websocket-routes
  namespace: reverse-tender
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: gateway-api
    app.kubernetes.io/part-of: reverse-tender-platform
spec:
  parentRefs:
    - name: reverse-tender-gateway
      sectionName: websocket
  
  # Generic WebSocket hostname
  hostnames:
    - "ws.reversetender.com"
  
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
        - headers:
            - name: Upgrade
              value: websocket
      backendRefs:
        - name: bidding-service
          port: 80
          weight: 100
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: X-Service-Route
                value: websocket-bidding
