# Generic HTTPRoutes for Reverse Tender Platform
# Defines routing rules that can be reused across environments

# HTTP to HTTPS redirect route
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-redirect
  namespace: reverse-tender
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: gateway-api
    app.kubernetes.io/part-of: reverse-tender-platform
spec:
  parentRefs:
    - name: reverse-tender-gateway
      sectionName: http-redirect
  
  # Generic hostname matching - can be overridden
  hostnames:
    - "api.reversetender.com"
    - "app.reversetender.com"
    - "admin.reversetender.com"
  
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301

---
# Generic API routing template
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-routes
  namespace: reverse-tender
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: gateway-api
    app.kubernetes.io/part-of: reverse-tender-platform
spec:
  parentRefs:
    - name: reverse-tender-gateway
      sectionName: https-api
  
  # Generic API hostname
  hostnames:
    - "api.reversetender.com"
  
  rules:
    # Authentication service routes
    - matches:
        - path:
            type: PathPrefix
            value: /auth
      backendRefs:
        - name: auth-service
          port: 80
          weight: 100
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: X-Service-Route
                value: auth-service
    
    # User management service routes
    - matches:
        - path:
            type: PathPrefix
            value: /users
      backendRefs:
        - name: user-service
          port: 80
          weight: 100
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: X-Service-Route
                value: user-service
    
    # Auction service routes
    - matches:
        - path:
            type: PathPrefix
            value: /auctions
      backendRefs:
        - name: auction-service
          port: 80
          weight: 100
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: X-Service-Route
                value: auction-service
    
    # Bidding service routes
    - matches:
        - path:
            type: PathPrefix
            value: /bids
      backendRefs:
        - name: bidding-service
          port: 80
          weight: 100
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: X-Service-Route
                value: bidding-service
    
    # Order management service routes
    - matches:
        - path:
            type: PathPrefix
            value: /orders
      backendRefs:
        - name: order-service
          port: 80
          weight: 100
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: X-Service-Route
                value: order-service
    
    # Payment service routes
    - matches:
        - path:
            type: PathPrefix
            value: /payments
      backendRefs:
        - name: payment-service
          port: 80
          weight: 100
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: X-Service-Route
                value: payment-service
    
    # Notification service routes
    - matches:
        - path:
            type: PathPrefix
            value: /notifications
      backendRefs:
        - name: notification-service
          port: 80
          weight: 100
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: X-Service-Route
                value: notification-service
    
    # Analytics service routes
    - matches:
        - path:
            type: PathPrefix
            value: /analytics
      backendRefs:
        - name: analytics-service
          port: 80
          weight: 100
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: X-Service-Route
                value: analytics-service
    
    # VIN OCR service routes
    - matches:
        - path:
            type: PathPrefix
            value: /vin-ocr
      backendRefs:
        - name: vin-ocr-service
          port: 80
          weight: 100
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: X-Service-Route
                value: vin-ocr-service
    
    # Default fallback route to gateway service
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: gateway-service
          port: 80
          weight: 100
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: X-Service-Route
                value: gateway-service

---
