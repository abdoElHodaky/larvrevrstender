# Kustomize Base Configuration for Reverse Tender Platform
# Updated for comprehensive database failover architecture v3.0
# Supports: Neon PostgreSQL, Cloud-Native PostgreSQL, MongoDB Atlas

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: reverse-tender-base

# Namespace for all resources
namespace: reverse-tender

# Common labels applied to all resources
commonLabels:
  app.kubernetes.io/name: reverse-tender
  app.kubernetes.io/part-of: reverse-tender-platform
  protocol: json-rpc
  version: v3.0
  database.kubernetes.io/failover-enabled: "true"

# Common annotations applied to all resources
commonAnnotations:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/version: "3.0.0"
  app.kubernetes.io/protocol: "json-rpc"
  database.kubernetes.io/failover-strategy: "primary-secondary-tertiary"
  database.kubernetes.io/providers: "neon-postgresql,cnpg-postgresql,mongodb-atlas"

# Resources to include
resources:
  - namespace.yaml
  # Common configurations
  - common-config.yaml
  - api-service-config.yaml
  # Service-specific configurations
  - gateway-config.yaml
  - auth-service-config.yaml
  - auction-service-config.yaml
  - payment-service-config.yaml
  # Cross-cutting concern configurations
  - saga-config.yaml
  - service-discovery-config.yaml
  - rpc-client-config.yaml
  - resilience-config.yaml
  - event-bus-config.yaml
  # Database Failover Resources
  - database-failover-config.yaml
  - database-failover-secrets.yaml
  - cnpg-operator.yaml
  - cnpg-cluster.yaml
  # Secrets
  - secrets/app-secrets.yaml
  # Kubernetes resources
  - deployments.yaml
  - deployments-with-database-failover.yaml
  - services.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - serviceaccount.yaml
  - rbac.yaml
  # Gateway API resources (next-generation traffic routing with database failover)
  - gateway-api/gatewayclass.yaml
  - gateway-api/gateway.yaml
  - gateway-api/httproutes.yaml
  - gateway-api/policies.yaml
  - gateway-api/database-failover-gateway.yaml
  - gateway-api/database-failover-policies.yaml

# Images to use (can be overridden in overlays)
images:
  - name: reversetender/gateway-service
    newTag: latest
  - name: reversetender/auth-service
    newTag: latest
  - name: reversetender/auction-service
    newTag: latest
  - name: reversetender/bidding-service
    newTag: latest
  - name: reversetender/user-service
    newTag: latest
  - name: reversetender/order-service
    newTag: latest
  - name: reversetender/notification-service
    newTag: latest
  - name: reversetender/payment-service
    newTag: latest
  - name: reversetender/analytics-service
    newTag: latest
  - name: reversetender/vin-ocr-service
    newTag: latest

# ConfigMap generator removed - using explicit ConfigMap files instead

# Secret generator for sensitive data
secretGenerator:
  - name: app-secrets
    type: Opaque
    literals:
      - JWT_SECRET=placeholder
      - APP_KEY=placeholder
      - DB_PASSWORD=placeholder
      - REDIS_PASSWORD=placeholder
      - MYSQL_ROOT_PASSWORD=placeholder

# Patches to apply
patches:
  # Add resource limits to all containers
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

# Replicas for each service (can be overridden)
replicas:
  - name: gateway-service
    count: 2
  - name: auth-service
    count: 2
  - name: auction-service
    count: 2
  - name: bidding-service
    count: 3
  - name: user-service
    count: 2
  - name: order-service
    count: 2
  - name: notification-service
    count: 2
  - name: payment-service
    count: 2
  - name: analytics-service
    count: 1
  - name: vin-ocr-service
    count: 2
