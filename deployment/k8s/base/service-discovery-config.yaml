# Service Discovery Configuration
# Contains configuration for service registry and discovery

apiVersion: v1
kind: ConfigMap
metadata:
  name: service-discovery-config
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: service-discovery
    app.kubernetes.io/part-of: reverse-tender-platform
data:
  # Service Registry Configuration
  SERVICE_REGISTRY_ENABLED: "true"
  SERVICE_REGISTRY_TTL: "300"
  SERVICE_REGISTRY_REFRESH_INTERVAL: "60"
  SERVICE_REGISTRY_CLEANUP_INTERVAL: "300"
  
  # Service Discovery Configuration
  SERVICE_DISCOVERY_ENABLED: "true"
  SERVICE_DISCOVERY_CACHE_TTL: "60"
  SERVICE_DISCOVERY_TIMEOUT: "10"
  SERVICE_DISCOVERY_RETRIES: "3"
  SERVICE_DISCOVERY_RETRY_DELAY: "2"
  
  # Service Health Check Configuration
  SERVICE_HEALTH_CHECK_ENABLED: "true"
  SERVICE_HEALTH_CHECK_INTERVAL: "30"
  SERVICE_HEALTH_CHECK_TIMEOUT: "10"
  SERVICE_HEALTH_CHECK_RETRIES: "3"
  SERVICE_HEALTH_CHECK_UNHEALTHY_THRESHOLD: "3"
  SERVICE_HEALTH_CHECK_HEALTHY_THRESHOLD: "2"
  
  # Service Registry Endpoints
  GATEWAY_SERVICE_URL: "http://gateway-service:8000"
  AUTH_SERVICE_URL: "http://auth-service:8001"
  AUCTION_SERVICE_URL: "http://auction-service:8002"
  BIDDING_SERVICE_URL: "http://bidding-service:8003"
  USER_SERVICE_URL: "http://user-service:8004"
  ORDER_SERVICE_URL: "http://order-service:8005"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8006"
  PAYMENT_SERVICE_URL: "http://payment-service:8007"
  ANALYTICS_SERVICE_URL: "http://analytics-service:8008"
  VIN_OCR_SERVICE_URL: "http://vin-ocr-service:8009"
  
  # Service Health Check Endpoints
  GATEWAY_SERVICE_HEALTH: "/health"
  AUTH_SERVICE_HEALTH: "/health"
  AUCTION_SERVICE_HEALTH: "/health"
  BIDDING_SERVICE_HEALTH: "/health"
  USER_SERVICE_HEALTH: "/health"
  ORDER_SERVICE_HEALTH: "/health"
  NOTIFICATION_SERVICE_HEALTH: "/health"
  PAYMENT_SERVICE_HEALTH: "/health"
  ANALYTICS_SERVICE_HEALTH: "/health"
  VIN_OCR_SERVICE_HEALTH: "/health"
  
  # Load Balancing Configuration
  LOAD_BALANCING_STRATEGY: "round_robin"
  LOAD_BALANCING_WEIGHTS_ENABLED: "false"
  
  # Service Mesh Integration
  SERVICE_MESH_ENABLED: "false"
  SERVICE_MESH_PROVIDER: "istio"
