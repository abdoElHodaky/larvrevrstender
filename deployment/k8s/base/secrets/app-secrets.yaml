# Application Secrets
# Contains sensitive configuration data that should not be in ConfigMaps

apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Database credentials
  DB_PASSWORD: "REPLACE_WITH_ACTUAL_PASSWORD"
  
  # Redis credentials
  REDIS_PASSWORD: "REPLACE_WITH_ACTUAL_PASSWORD"
  
  # JWT secrets
  JWT_SECRET: "REPLACE_WITH_ACTUAL_JWT_SECRET"
  JWT_REFRESH_SECRET: "REPLACE_WITH_ACTUAL_JWT_REFRESH_SECRET"
  
  # Laravel application key
  APP_KEY: "base64:REPLACE_WITH_ACTUAL_APP_KEY"
  
  # Encryption keys
  ENCRYPTION_KEY: "REPLACE_WITH_ACTUAL_ENCRYPTION_KEY"
  
  # API keys for external services
  PAYMENT_GATEWAY_API_KEY: "REPLACE_WITH_ACTUAL_PAYMENT_API_KEY"
  PAYMENT_GATEWAY_SECRET: "REPLACE_WITH_ACTUAL_PAYMENT_SECRET"
  
  # Email service credentials
  MAIL_PASSWORD: "REPLACE_WITH_ACTUAL_MAIL_PASSWORD"
  
  # SMS service credentials
  SMS_API_KEY: "REPLACE_WITH_ACTUAL_SMS_API_KEY"
  SMS_API_SECRET: "REPLACE_WITH_ACTUAL_SMS_SECRET"
  
  # File storage credentials (S3/MinIO)
  AWS_ACCESS_KEY_ID: "REPLACE_WITH_ACTUAL_AWS_ACCESS_KEY"
  AWS_SECRET_ACCESS_KEY: "REPLACE_WITH_ACTUAL_AWS_SECRET_KEY"
  
  # OAuth credentials
  GOOGLE_CLIENT_SECRET: "REPLACE_WITH_ACTUAL_GOOGLE_CLIENT_SECRET"
  FACEBOOK_CLIENT_SECRET: "REPLACE_WITH_ACTUAL_FACEBOOK_CLIENT_SECRET"
  
  # Webhook secrets
  WEBHOOK_SECRET: "REPLACE_WITH_ACTUAL_WEBHOOK_SECRET"
  
  # Session encryption
  SESSION_ENCRYPT_KEY: "REPLACE_WITH_ACTUAL_SESSION_KEY"

---
# Database-specific secrets
apiVersion: v1
kind: Secret
metadata:
  name: database-secrets
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: database
type: Opaque
stringData:
  # MySQL root password
  MYSQL_ROOT_PASSWORD: "REPLACE_WITH_ACTUAL_MYSQL_ROOT_PASSWORD"
  
  # MySQL user password
  MYSQL_PASSWORD: "REPLACE_WITH_ACTUAL_MYSQL_PASSWORD"
  
  # Database connection string
  DATABASE_URL: "mysql://username:REPLACE_WITH_ACTUAL_PASSWORD@mysql:3306/reverse_tender"

---
# Cache-specific secrets
apiVersion: v1
kind: Secret
metadata:
  name: cache-secrets
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: cache
type: Opaque
stringData:
  # Redis password
  REDIS_PASSWORD: "REPLACE_WITH_ACTUAL_REDIS_PASSWORD"
  
  # Redis connection string
  REDIS_URL: "redis://:REPLACE_WITH_ACTUAL_PASSWORD@redis:6379/0"

---
# External service secrets
apiVersion: v1
kind: Secret
metadata:
  name: external-service-secrets
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: external-services
type: Opaque
stringData:
  # Payment gateway credentials
  STRIPE_SECRET_KEY: "REPLACE_WITH_ACTUAL_STRIPE_SECRET"
  STRIPE_WEBHOOK_SECRET: "REPLACE_WITH_ACTUAL_STRIPE_WEBHOOK_SECRET"
  PAYPAL_CLIENT_SECRET: "REPLACE_WITH_ACTUAL_PAYPAL_SECRET"
  
  # Notification service credentials
  PUSHER_APP_SECRET: "REPLACE_WITH_ACTUAL_PUSHER_SECRET"
  FCM_SERVER_KEY: "REPLACE_WITH_ACTUAL_FCM_KEY"
  
  # Analytics service credentials
  GOOGLE_ANALYTICS_KEY: "REPLACE_WITH_ACTUAL_GA_KEY"
  
  # File upload service credentials
  CLOUDINARY_API_SECRET: "REPLACE_WITH_ACTUAL_CLOUDINARY_SECRET"
