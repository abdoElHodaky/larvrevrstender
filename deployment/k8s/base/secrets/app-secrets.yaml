# Application Secrets
# Contains sensitive configuration data that should not be in ConfigMaps
# 
# ⚠️  IMPORTANT: These are TEMPLATE/PLACEHOLDER values only!
# ⚠️  All values starting with "CHANGE_ME_" must be replaced with actual secrets in production
# ⚠️  Do NOT use these placeholder values in any real environment

apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Database credentials
  DB_PASSWORD: "CHANGE_ME_database_password_here"
  
  # Redis credentials
  REDIS_PASSWORD: "CHANGE_ME_redis_password_here"
  
  # JWT secrets
  JWT_SECRET: "CHANGE_ME_jwt_secret_here"
  JWT_REFRESH_SECRET: "CHANGE_ME_jwt_refresh_secret_here"
  
  # Laravel application key
  APP_KEY: "base64:CHANGE_ME_app_key_here"
  
  # Encryption keys
  ENCRYPTION_KEY: "CHANGE_ME_encryption_key_here"
  
  # API keys for external services
  PAYMENT_GATEWAY_API_KEY: "CHANGE_ME_payment_api_key_here"
  PAYMENT_GATEWAY_SECRET: "CHANGE_ME_payment_secret_here"
  
  # Email service credentials
  MAIL_PASSWORD: "CHANGE_ME_mail_password_here"
  
  # SMS service credentials
  SMS_API_KEY: "CHANGE_ME_sms_api_key_here"
  SMS_API_SECRET: "CHANGE_ME_sms_api_secret_here"
  
  # File storage credentials (S3/MinIO)
  AWS_ACCESS_KEY_ID: "CHANGE_ME_aws_access_key_here"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME_aws_secret_key_here"
  
  # OAuth credentials
  GOOGLE_CLIENT_SECRET: "CHANGE_ME_google_client_secret_here"
  FACEBOOK_CLIENT_SECRET: "CHANGE_ME_facebook_client_secret_here"
  
  # Webhook secrets
  WEBHOOK_SECRET: "CHANGE_ME_webhook_secret_here"
  
  # Session encryption
  SESSION_ENCRYPT_KEY: "CHANGE_ME_session_key_here"

---
# Database-specific secrets
apiVersion: v1
kind: Secret
metadata:
  name: database-secrets
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: database
type: Opaque
stringData:
  # MySQL root password
  MYSQL_ROOT_PASSWORD: "CHANGE_ME_mysql_root_password_here"
  
  # MySQL user password
  MYSQL_PASSWORD: "CHANGE_ME_mysql_password_here"
  
  # Database connection string
  DATABASE_URL: "mysql://username:CHANGE_ME_password_here@mysql:3306/reverse_tender"

---
# Cache-specific secrets
apiVersion: v1
kind: Secret
metadata:
  name: cache-secrets
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: cache
type: Opaque
stringData:
  # Redis password
  REDIS_PASSWORD: "CHANGE_ME_redis_password_here"
  
  # Redis connection string
  REDIS_URL: "redis://:CHANGE_ME_password_here@redis:6379/0"

---
# External service secrets
apiVersion: v1
kind: Secret
metadata:
  name: external-service-secrets
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: external-services
type: Opaque
stringData:
  # Payment gateway credentials
  STRIPE_SECRET_KEY: "CHANGE_ME_stripe_secret_here"
  STRIPE_WEBHOOK_SECRET: "CHANGE_ME_stripe_webhook_secret_here"
  PAYPAL_CLIENT_SECRET: "CHANGE_ME_paypal_secret_here"
  
  # Notification service credentials
  PUSHER_APP_SECRET: "CHANGE_ME_pusher_secret_here"
  FCM_SERVER_KEY: "CHANGE_ME_fcm_key_here"
  
  # Analytics service credentials
  GOOGLE_ANALYTICS_KEY: "CHANGE_ME_ga_key_here"
  
  # File upload service credentials
  CLOUDINARY_API_SECRET: "CHANGE_ME_cloudinary_secret_here"
