# Network Policy configuration for Reverse Tender Platform
# Controls network traffic between pods and external networks

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: security
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
# Allow ingress traffic to API Gateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-gateway-ingress
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: security
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000

---
# Allow inter-service communication
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inter-service-communication
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: security
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: reverse-tender
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: reverse-tender
      ports:
        - protocol: TCP
          port: 8000  # api-gateway
        - protocol: TCP
          port: 8001  # auth-service
        - protocol: TCP
          port: 8002  # auction-service
        - protocol: TCP
          port: 8003  # order-service
        - protocol: TCP
          port: 8004  # payment-service
        - protocol: TCP
          port: 8005  # notification-service
        - protocol: TCP
          port: 8006  # user-service
        - protocol: TCP
          port: 8007  # analytics-service
        - protocol: TCP
          port: 8008  # bidding-service
        - protocol: TCP
          port: 8009  # vin-ocr-service
        - protocol: TCP
          port: 8080  # bidding-service secondary port
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: reverse-tender
      ports:
        - protocol: TCP
          port: 8000  # api-gateway
        - protocol: TCP
          port: 8001  # auth-service
        - protocol: TCP
          port: 8002  # auction-service
        - protocol: TCP
          port: 8003  # order-service
        - protocol: TCP
          port: 8004  # payment-service
        - protocol: TCP
          port: 8005  # notification-service
        - protocol: TCP
          port: 8006  # user-service
        - protocol: TCP
          port: 8007  # analytics-service
        - protocol: TCP
          port: 8008  # bidding-service
        - protocol: TCP
          port: 8009  # vin-ocr-service
        - protocol: TCP
          port: 8080  # bidding-service secondary port

---
# Allow database access
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-access
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: security
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: reverse-tender
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: mysql
      ports:
        - protocol: TCP
          port: 3306

---
# Allow Redis access
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-access
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: security
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: reverse-tender
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379

---
# Allow external API access
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: external-api-access
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: security
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: reverse-tender
  policyTypes:
    - Egress
  egress:
    - to: []
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53

---
# Allow monitoring access
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-access
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: security
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: reverse-tender
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
        - podSelector:
            matchLabels:
              app: grafana
      ports:
        - protocol: TCP
          port: 8000  # api-gateway metrics
        - protocol: TCP
          port: 8001  # auth-service metrics
        - protocol: TCP
          port: 8002  # auction-service metrics
        - protocol: TCP
          port: 8003  # order-service metrics
        - protocol: TCP
          port: 8004  # payment-service metrics
        - protocol: TCP
          port: 8005  # notification-service metrics
        - protocol: TCP
          port: 8006  # user-service metrics
        - protocol: TCP
          port: 8007  # analytics-service metrics
        - protocol: TCP
          port: 8008  # bidding-service metrics
        - protocol: TCP
          port: 8009  # vin-ocr-service metrics

---
# WebSocket traffic policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: websocket-traffic
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: security
spec:
  podSelector:
    matchLabels:
      app: bidding-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8008  # bidding-service primary port
        - protocol: TCP
          port: 8080  # bidding-service WebSocket port
