# Common Configuration for Reverse Tender Platform
# Contains shared configuration data used by all services

apiVersion: v1
kind: ConfigMap
metadata:
  name: common-config
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: configuration
    app.kubernetes.io/part-of: reverse-tender-platform
data:
  # Application Common Settings
  APP_NAME: "Reverse Tender Platform"
  APP_TIMEZONE: "UTC"
  APP_LOCALE: "en"
  
  # Database Configuration - Neon PostgreSQL
  DB_CONNECTION: "pgsql"
  DB_PORT: "5432"
  # Note: DB_HOST will be provided via secrets (NEON_DB_HOST)
  
  # Redis Configuration - Upstash Redis
  REDIS_PORT: "6379"
  # Note: REDIS_HOST will be provided via secrets (UPSTASH_REDIS_URL)
  
  # Cache and Session Configuration
  CACHE_DRIVER: "redis"
  SESSION_DRIVER: "redis"
  QUEUE_CONNECTION: "redis"
  
  # Logging Configuration
  LOG_CHANNEL: "stack"
  LOG_LEVEL: "info"
  
  # Health Check Configuration
  HEALTH_CHECK_INTERVAL: "30s"
  HEALTH_CHECK_TIMEOUT: "10s"
  HEALTH_CHECK_RETRIES: "3"
  
  # Laravel Octane Configuration
  OCTANE_SERVER: "frankenphp"
  OCTANE_HTTPS: "true"
  FRANKENPHP_WORKER_MODE: "true"
  
  # Pagination Configuration
  DEFAULT_PAGE_SIZE: "20"
  MAX_PAGE_SIZE: "100"
