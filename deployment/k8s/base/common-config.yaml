# Common Configuration for Reverse Tender Platform
# Contains shared configuration data used by all services

apiVersion: v1
kind: ConfigMap
metadata:
  name: common-config
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: configuration
    app.kubernetes.io/part-of: reverse-tender-platform
data:
  # Application Common Settings
  APP_NAME: "Reverse Tender Platform"
  APP_TIMEZONE: "UTC"
  APP_LOCALE: "en"
  APP_DEBUG: "false"
  APP_URL: "https://reversetender.com"
  
  # Database Configuration - PostgreSQL
  DB_CONNECTION: "pgsql"
  DB_PORT: "5432"
  DB_CHARSET: "utf8mb4"
  DB_COLLATION: "utf8mb4_unicode_ci"
  # Note: DB_HOST, DB_DATABASE, DB_USERNAME, DB_PASSWORD provided via secrets
  
  # Redis Configuration
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  # Note: REDIS_HOST, REDIS_PASSWORD provided via secrets
  
  # Cache and Session Configuration
  CACHE_DRIVER: "redis"
  SESSION_DRIVER: "redis"
  SESSION_LIFETIME: "120"
  SESSION_ENCRYPT: "false"
  SESSION_PATH: "/"
  SESSION_DOMAIN: ""
  QUEUE_CONNECTION: "redis"
  BROADCAST_DRIVER: "reverb"
  
  # Logging Configuration
  LOG_CHANNEL: "stack"
  LOG_LEVEL: "info"
  LOG_DEPRECATIONS_CHANNEL: "null"
  LOG_STACK: "single"
  
  # JWT Configuration (Common defaults)
  JWT_ALGO: "RS256"
  JWT_TTL: "900"
  REFRESH_TTL: "43200"
  
  # OTP Configuration
  OTP_EXPIRY: "300"
  OTP_LENGTH: "6"
  
  # Pagination Configuration
  DEFAULT_PAGE_SIZE: "20"
  MAX_PAGE_SIZE: "100"
  
  # Health Check Configuration
  HEALTH_CHECK_INTERVAL: "30s"
  HEALTH_CHECK_TIMEOUT: "10s"
  HEALTH_CHECK_RETRIES: "3"
  
  # Laravel Octane Configuration
  OCTANE_SERVER: "frankenphp"
  OCTANE_HTTPS: "true"
  FRANKENPHP_WORKER_MODE: "true"
  
  # File Storage Configuration
  FILESYSTEM_DISK: "local"
  
  # Mail Configuration
  MAIL_MAILER: "smtp"
  MAIL_PORT: "587"
  MAIL_ENCRYPTION: "tls"
  MAIL_FROM_ADDRESS: "noreply@reversetender.com"
  MAIL_FROM_NAME: "Reverse Tender Platform"
  
  # Broadcasting Configuration
  PUSHER_PORT: "443"
  PUSHER_SCHEME: "https"
  PUSHER_APP_CLUSTER: "mt1"
  
  # Sanctum Configuration
  SANCTUM_STATEFUL_DOMAINS: "localhost,127.0.0.1,reversetender.com"
  
  # Telescope Configuration
  TELESCOPE_ENABLED: "true"
  
  # Horizon Configuration
  HORIZON_ENABLED: "true"
