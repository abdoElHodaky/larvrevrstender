apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: auth-service-route
  namespace: reversetender-prod
  labels:
    app: auth-service
    tier: backend
spec:
  parentRefs:
  - name: rpc-gateway
    namespace: reversetender-prod
  hostnames:
  - "api.reversetender.sa"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /rpc/auth
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /rpc
    backendRefs:
    - name: auth-service-rpc
      port: 8001
      weight: 100
  - matches:
    - path:
        type: PathPrefix
        value: /health/auth
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /health
    backendRefs:
    - name: auth-service-rpc
      port: 8000
      weight: 100

