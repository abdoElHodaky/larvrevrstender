# Analytics Service Route
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: analytics-service-route
  namespace: reversetender-prod
  labels:
    app: analytics-service
    tier: backend
spec:
  parentRefs:
  - name: rpc-gateway
    namespace: reversetender-prod
  hostnames:
  - "api.reversetender.sa"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /rpc/analytics
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /rpc
    backendRefs:
    - name: analytics-service-rpc
      port: 8003
      weight: 100
---
