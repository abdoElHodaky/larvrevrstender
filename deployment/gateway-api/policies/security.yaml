apiVersion: gateway.networking.k8s.io/v1alpha2
kind: SecurityPolicy
metadata:
  name: rpc-security-policy
  namespace: reversetender-prod
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: rpc-gateway
  cors:
    allowOrigins:
    - "https://app.reversetender.sa"
    - "https://admin.reversetender.sa"
    allowMethods:
    - GET
    - POST
    - OPTIONS
    allowHeaders:
    - "Content-Type"
    - "Authorization"
    - "X-Requested-With"
    - "X-User-ID"
    - "X-Correlation-ID"
    maxAge: 86400
  jwt:
    providers:
    - name: reversetender-jwt
      issuer: "https://auth.reversetender.sa"
      audiences:
      - "reversetender-api"
      jwksUri: "https://auth.reversetender.sa/.well-known/jwks.json"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rpc-gateway-netpol
  namespace: reversetender-prod
spec:
  podSelector:
    matchLabels:
      app: rpc-gateway
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 443
  egress:
  - to:
    - podSelector:
        matchLabels:
          tier: backend
    ports:
    - protocol: TCP
      port: 8001
    - protocol: TCP
      port: 8002
    - protocol: TCP
      port: 8003
    - protocol: TCP
      port: 8004
    - protocol: TCP
      port: 8005
    - protocol: TCP
      port: 8006
    - protocol: TCP
      port: 8007
    - protocol: TCP
      port: 8008
    - protocol: TCP
      port: 8009

