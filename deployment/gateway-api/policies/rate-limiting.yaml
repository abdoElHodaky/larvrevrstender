apiVersion: gateway.networking.k8s.io/v1alpha2
kind: RateLimitPolicy
metadata:
  name: rpc-rate-limit
  namespace: reversetender-prod
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: rpc-gateway
  limits:
    "global":
      rates:
      - limit: 1000
        duration: 60s
        unit: request
    "per-user":
      rates:
      - limit: 100
        duration: 60s
        unit: request
      counters:
      - expression: request.headers["x-user-id"]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rate-limit-config
  namespace: reversetender-prod
data:
  config.yaml: |
    domain: rpc-gateway
    descriptors:
      - key: generic_key
        value: default
        rate_limit:
          unit: minute
          requests_per_unit: 1000
      - key: user_id
        rate_limit:
          unit: minute
          requests_per_unit: 100

