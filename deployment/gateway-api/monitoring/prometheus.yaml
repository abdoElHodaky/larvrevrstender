apiVersion: v1
kind: ServiceMonitor
metadata:
  name: rpc-gateway-metrics
  namespace: reversetender-prod
  labels:
    app: rpc-gateway
    tier: infrastructure
spec:
  selector:
    matchLabels:
      app: rpc-gateway
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-grafana-dashboard
  namespace: reversetender-prod
  labels:
    grafana_dashboard: "1"
data:
  rpc-gateway-dashboard.json: |
    {
      "dashboard": {
        "id": null,
        "title": "RPC Gateway API Metrics",
        "tags": ["gateway", "rpc", "kubernetes"],
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "Request Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(gateway_requests_total[5m])",
                "legendFormat": "{{service}}"
              }
            ]
          },
          {
            "id": 2,
            "title": "Response Time",
            "type": "graph",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(gateway_request_duration_seconds_bucket[5m]))",
                "legendFormat": "95th percentile"
              }
            ]
          },
          {
            "id": 3,
            "title": "Error Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(gateway_requests_total{status=~\"5..\"}[5m])",
                "legendFormat": "5xx errors"
              }
            ]
          }
        ],
        "time": {
          "from": "now-1h",
          "to": "now"
        },
        "refresh": "30s"
      }
    }

