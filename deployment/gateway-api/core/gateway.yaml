apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: rpc-gateway
  namespace: reversetender-prod
  labels:
    app: rpc-gateway
    tier: infrastructure
spec:
  gatewayClassName: rpc-gateway-class
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    hostname: "api.reversetender.sa"
    allowedRoutes:
      namespaces:
        from: Same
      kinds:
      - kind: HTTPRoute
        group: gateway.networking.k8s.io
  - name: https
    port: 443
    protocol: HTTPS
    hostname: "api.reversetender.sa"
    tls:
      mode: Terminate
      certificateRefs:
      - name: reversetender-tls-cert
        kind: Secret
    allowedRoutes:
      namespaces:
        from: Same
      kinds:
      - kind: HTTPRoute
        group: gateway.networking.k8s.io
---
apiVersion: v1
kind: Secret
metadata:
  name: reversetender-tls-cert
  namespace: reversetender-prod
type: kubernetes.io/tls
data:
  # TLS certificate and key (base64 encoded)
  # Replace with actual certificate data
  tls.crt: LS0tLS1CRUdJTi... # placeholder
  tls.key: LS0tLS1CRUdJTi... # placeholder

