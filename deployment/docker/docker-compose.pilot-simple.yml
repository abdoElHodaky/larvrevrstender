services:
  # Infrastructure Services Only
  mysql-dev:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=pilot123
      - MYSQL_DATABASE=pilot_db
      - MYSQL_USER=pilot_user
      - MYSQL_PASSWORD=pilot123
    volumes:
      - mysql_pilot_data:/var/lib/mysql
    networks:
      - pilot-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password

  redis-dev:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_pilot_data:/data
    networks:
      - pilot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    command: redis-server --appendonly yes

  # Simplified Gateway Service (REST only for testing)
  gateway-service-rest:
    image: ghcr.io/abdoelhodaky/larvrevrstender/gateway-service:latest
    ports:
      - "8010:8000"
    environment:
      - APP_NAME=gateway-service-rest
      - APP_ENV=testing
      - DB_HOST=mysql-dev
      - REDIS_HOST=redis-dev
      - LOG_CHANNEL=stack
      - LOG_LEVEL=error
      - DB_DATABASE=pilot_db
      - DB_USERNAME=pilot_user
      - DB_PASSWORD=pilot123
    networks:
      - pilot-network
    depends_on:
      mysql-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Simplified Auth Service (REST only for testing)
  auth-service-rest:
    image: ghcr.io/abdoelhodaky/larvrevrstender/auth-service:latest
    ports:
      - "8011:8000"
    environment:
      - APP_NAME=auth-service-rest
      - APP_ENV=testing
      - DB_HOST=mysql-dev
      - REDIS_HOST=redis-dev
      - JWT_SECRET=pilot-jwt-secret-key-for-development
      - LOG_CHANNEL=stack
      - LOG_LEVEL=error
      - DB_DATABASE=pilot_db
      - DB_USERNAME=pilot_user
      - DB_PASSWORD=pilot123
    networks:
      - pilot-network
    depends_on:
      mysql-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  mysql_pilot_data:
  redis_pilot_data:

networks:
  pilot-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
