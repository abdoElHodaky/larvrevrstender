version: '3.8'

# Development Environment Overrides for Reverse Tender Platform
# This file contains development-specific configurations for local development
# Includes Laravel 12 + Octane development optimizations

# Global development environment variables for Octane
x-octane-dev-env: &octane-dev-env
  OCTANE_WORKERS: 2
  OCTANE_TASK_WORKERS: 2
  OCTANE_MAX_REQUESTS: 100
  OCTANE_MEMORY_LIMIT: 256M
  OCTANE_WATCH: true
  FRANKENPHP_DEBUG: true
  PHP_OPCACHE_ENABLE: 0
  PHP_OPCACHE_VALIDATE_TIMESTAMPS: 1
  PHP_OPCACHE_REVALIDATE_FREQ: 2

services:
  # API Gateway - Development configuration
  api-gateway:
    environment:
      <<: *octane-dev-env
      APP_ENV: local
      APP_DEBUG: true
      LOG_LEVEL: debug
      APP_URL: http://localhost:8000
    volumes:
      - ../../services/api-gateway:/var/www:cached
      - ./logs/api-gateway:/var/www/storage/logs
    ports:
      - "8000:8000"

  # Auth Service - Development configuration
  auth-service:
    environment:
      <<: *octane-dev-env
      APP_ENV: local
      APP_DEBUG: true
      LOG_LEVEL: debug
    volumes:
      - ../../services/auth-service:/var/www:cached
      - ./logs/auth-service:/var/www/storage/logs
    ports:
      - "8001:8001"

  # Bidding Service - Development configuration
  bidding-service:
    environment:
      <<: *octane-dev-env
      APP_ENV: local
      APP_DEBUG: true
      LOG_LEVEL: debug
      REVERB_SCHEME: http
    volumes:
      - ../../services/bidding-service:/var/www:cached
      - ./logs/bidding-service:/var/www/storage/logs
    ports:
      - "8002:8002"
      - "8080:8080"

  # User Service - Development configuration
  user-service:
    environment:
      <<: *octane-dev-env
      APP_ENV: local
      APP_DEBUG: true
      LOG_LEVEL: debug
    volumes:
      - ../../services/user-service:/var/www:cached
      - ./logs/user-service:/var/www/storage/logs
    ports:
      - "8003:8003"

  # Order Service - Development configuration
  order-service:
    environment:
      <<: *octane-dev-env
      APP_ENV: local
      APP_DEBUG: true
      LOG_LEVEL: debug
    volumes:
      - ../../services/order-service:/var/www:cached
      - ./logs/order-service:/var/www/storage/logs
    ports:
      - "8004:8004"

  # Notification Service - Development configuration
  notification-service:
    environment:
      <<: *octane-dev-env
      APP_ENV: local
      APP_DEBUG: true
      LOG_LEVEL: debug
    volumes:
      - ../../services/notification-service:/var/www:cached
      - ./logs/notification-service:/var/www/storage/logs
    ports:
      - "8005:8005"

  # Payment Service - Development configuration
  payment-service:
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile.payment
      args:
        SERVICE_NAME: payment-service
    environment:
      <<: *octane-dev-env
      APP_ENV: local
      APP_DEBUG: true
      LOG_LEVEL: debug
      # Development payment gateway settings
      STRIPE_ENABLED: true
      PAYPAL_ENABLED: true
      PAYPAL_MODE: sandbox
      MADA_ENABLED: false
      STC_PAY_ENABLED: false
      RAZORPAY_ENABLED: false
      SQUARE_ENABLED: false
      # Development security settings
      PAYMENT_ENCRYPTION_KEY: dev-encryption-key-change-in-production
      WEBHOOK_SIGNATURE_VERIFICATION: false
      # Development analytics
      PAYMENT_ANALYTICS_ENABLED: true
      PAYMENT_METRICS_ENABLED: true
      PAYMENT_AUDIT_ENABLED: true
    volumes:
      - ../../services/payment-service:/var/www:cached
      - ./logs/payment-service:/var/www/storage/logs
      - ./config/payment-service:/var/www/config:ro
    ports:
      - "8004:8004"

  # Analytics Service - Development configuration
  analytics-service:
    environment:
      <<: *octane-dev-env
      APP_ENV: local
      APP_DEBUG: true
      LOG_LEVEL: debug
    volumes:
      - ../../services/analytics-service:/var/www:cached
      - ./logs/analytics-service:/var/www/storage/logs
    ports:
      - "8007:8007"

  # VIN OCR Service - Development configuration
  vin-ocr-service:
    environment:
      <<: *octane-dev-env
      APP_ENV: local
      APP_DEBUG: true
      LOG_LEVEL: debug
    volumes:
      - ../../services/vin-ocr-service:/var/www:cached
      - ./logs/vin-ocr-service:/var/www/storage/logs
    ports:
      - "8008:8008"

  # Note: PostgreSQL and Redis are now external services
  # PostgreSQL: Use managed PostgreSQL instance
  # Redis: Use Upstash Redis (configured via REDIS_URL environment variable)

  # Nginx - Development configuration
  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx-dev.conf:/etc/nginx/nginx.conf
      - ./nginx/sites-dev:/etc/nginx/conf.d
      - ./logs/nginx:/var/log/nginx

  # Development Tools - MailHog for email testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: rt_mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - reverse-tender-network
    restart: unless-stopped

  # Development Tools - pgAdmin (PostgreSQL Administration)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: rt_pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@reversetender.com
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_CONFIG_SERVER_MODE=False
    ports:
      - "8080:80"
    networks:
      - reverse-tender-network
    restart: unless-stopped

  # Note: Redis Commander removed - use Upstash Redis Console instead
  # Access Upstash Redis management through: https://console.upstash.com/

volumes:
  # Note: Local database and Redis volumes removed
  # PostgreSQL and Redis are now external managed services
