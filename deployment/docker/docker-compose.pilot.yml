version: '3.8'

services:
  # Shared Service - REST & RPC
  shared-service-rest:
    build:
      context: ../../services/shared-service
      dockerfile: ../../deployment/docker/Dockerfile.rest
    ports:
      - "8010:8000"
    environment:
      - APP_NAME=shared-service-rest
      - APP_ENV=development
      - DB_HOST=mysql-dev
      - REDIS_HOST=redis-dev
      - LOG_CHANNEL=stack
      - LOG_LEVEL=debug
    volumes:
      - ../../services/shared-service:/app
      - ./logs/shared-rest:/app/storage/logs
    networks:
      - pilot-network
    depends_on:
      - mysql-dev
      - redis-dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  shared-service-rpc:
    build:
      context: ../../services/shared-service
      dockerfile: ../../deployment/docker/Dockerfile.rpc
    ports:
      - "6010:6010"
      - "8012:8000"  # HTTP health checks
    environment:
      - APP_NAME=shared-service-rpc
      - APP_ENV=development
      - OCTANE_SERVER=frankenphp
      - OCTANE_WORKERS=2
      - OCTANE_TASK_WORKERS=4
      - OCTANE_MAX_REQUESTS=500
      - RPC_PORT=6010
      - RPC_HOST=0.0.0.0
      - DB_HOST=mysql-dev
      - REDIS_HOST=redis-dev
      - LOG_CHANNEL=stack
      - LOG_LEVEL=debug
    volumes:
      - ../../services/shared-service:/app
      - ./logs/shared-rpc:/app/storage/logs
    networks:
      - pilot-network
    depends_on:
      - mysql-dev
      - redis-dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Auth Service - REST & RPC
  auth-service-rest:
    build:
      context: ../../services/auth-service
      dockerfile: ../../deployment/docker/Dockerfile.rest
    ports:
      - "8011:8000"
    environment:
      - APP_NAME=auth-service-rest
      - APP_ENV=development
      - DB_HOST=mysql-dev
      - REDIS_HOST=redis-dev
      - JWT_SECRET=pilot-jwt-secret-key-for-development
      - LOG_CHANNEL=stack
      - LOG_LEVEL=debug
    volumes:
      - ../../services/auth-service:/app
      - ./logs/auth-rest:/app/storage/logs
    networks:
      - pilot-network
    depends_on:
      - mysql-dev
      - redis-dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  auth-service-rpc:
    build:
      context: ../../services/auth-service
      dockerfile: ../../deployment/docker/Dockerfile.rpc
    ports:
      - "6011:6011"
      - "8013:8000"  # HTTP health checks
    environment:
      - APP_NAME=auth-service-rpc
      - APP_ENV=development
      - OCTANE_SERVER=frankenphp
      - OCTANE_WORKERS=2
      - OCTANE_TASK_WORKERS=4
      - OCTANE_MAX_REQUESTS=500
      - RPC_PORT=6011
      - RPC_HOST=0.0.0.0
      - DB_HOST=mysql-dev
      - REDIS_HOST=redis-dev
      - JWT_SECRET=pilot-jwt-secret-key-for-development
      - LOG_CHANNEL=stack
      - LOG_LEVEL=debug
    volumes:
      - ../../services/auth-service:/app
      - ./logs/auth-rpc:/app/storage/logs
    networks:
      - pilot-network
    depends_on:
      - mysql-dev
      - redis-dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Infrastructure Services
  mysql-dev:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=pilot123
      - MYSQL_DATABASE=reversetender_pilot
      - MYSQL_USER=pilot_user
      - MYSQL_PASSWORD=pilot123
    volumes:
      - mysql_pilot_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - pilot-network
    command: --default-authentication-plugin=mysql_native_password

  redis-dev:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_pilot_data:/data
    networks:
      - pilot-network
    command: redis-server --appendonly yes

  # Monitoring and Observability
  grafana:
    image: grafana/grafana:latest
    ports:
      - "9000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=pilot123
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_pilot_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - pilot-network
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_pilot_data:/prometheus
    networks:
      - pilot-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  # Load Testing Service
  load-tester:
    build:
      context: ./load-testing
      dockerfile: Dockerfile
    volumes:
      - ./load-testing/scripts:/scripts
      - ./load-testing/results:/results
    networks:
      - pilot-network
    depends_on:
      - shared-service-rest
      - shared-service-rpc
      - auth-service-rest
      - auth-service-rpc
    profiles:
      - testing

volumes:
  mysql_pilot_data:
  redis_pilot_data:
  grafana_pilot_data:
  prometheus_pilot_data:

networks:
  pilot-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
