# Complete RPC Services Deployment for Production
# This file contains all 9 services with optimized configurations

---
# Auth Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service-rpc
  namespace: reversetender-prod
  labels:
    app: auth-service
    version: rpc
    tier: backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: auth-service
      version: rpc
  template:
    metadata:
      labels:
        app: auth-service
        version: rpc
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: auth-service-rpc
        image: reversetender/auth-service:rpc-latest
        ports:
        - containerPort: 8000
          name: http
        - containerPort: 6011
          name: rpc
        env:
        - name: APP_NAME
          value: "auth-service"
        - name: OCTANE_RPC_PORT
          value: "6011"
        - name: OCTANE_WORKERS
          value: "4"
        - name: OCTANE_TASK_WORKERS
          value: "8"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5

