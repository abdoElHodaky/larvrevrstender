apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service-rpc
  namespace: reversetender-prod
  labels:
    app: gateway-service
    version: rpc
    tier: backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: gateway-service
      version: rpc
  template:
    metadata:
      labels:
        app: gateway-service
        version: rpc
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: gateway-service-rpc
        image: reversetender/gateway-service:rpc-latest
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        - containerPort: 6010
          name: rpc
          protocol: TCP
        env:
        - name: APP_NAME
          value: "gateway-service"
        - name: APP_ENV
          value: "production"
        - name: OCTANE_SERVER
          value: "frankenphp"
        - name: OCTANE_WORKERS
          value: "4"
        - name: OCTANE_TASK_WORKERS
          value: "8"
        - name: OCTANE_MAX_REQUESTS
          value: "1000"
        - name: OCTANE_RPC_HOST
          value: "0.0.0.0"
        - name: OCTANE_RPC_PORT
          value: "6010"
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: host
        - name: DB_DATABASE
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: database
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: password
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: host
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: password
        - name: APP_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: app-key
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        volumeMounts:
        - name: app-logs
          mountPath: /app/storage/logs
      volumes:
      - name: app-logs
        emptyDir: {}
      imagePullSecrets:
      - name: docker-registry-secret

---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service-rpc
  namespace: reversetender-prod
  labels:
    app: gateway-service
    version: rpc
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  - port: 6010
    targetPort: 6010
    protocol: TCP
    name: rpc
  selector:
    app: gateway-service
    version: rpc

---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service-rpc-headless
  namespace: reversetender-prod
  labels:
    app: gateway-service
    version: rpc
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 6010
    targetPort: 6010
    protocol: TCP
    name: rpc
  selector:
    app: gateway-service
    version: rpc

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-service-rpc-hpa
  namespace: reversetender-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway-service-rpc
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway-service-rpc-pdb
  namespace: reversetender-prod
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: gateway-service
      version: rpc

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-service-rpc-netpol
  namespace: reversetender-prod
spec:
  podSelector:
    matchLabels:
      app: gateway-service
      version: rpc
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: reversetender-prod
    - podSelector:
        matchLabels:
          tier: backend
    ports:
    - protocol: TCP
      port: 8000
    - protocol: TCP
      port: 6010
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: reversetender-prod
    ports:
    - protocol: TCP
      port: 3306  # MySQL
    - protocol: TCP
      port: 6379  # Redis
  - to: []  # Allow all outbound for external APIs
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
