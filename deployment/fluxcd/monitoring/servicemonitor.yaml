apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: flux-system
  namespace: flux-system
  labels:
    app.kubernetes.io/name: flux-system
    app.kubernetes.io/part-of: flux
spec:
  selector:
    matchLabels:
      app: source-controller
  endpoints:
  - port: http-prom
    interval: 15s
    path: /metrics
    scheme: http
---
