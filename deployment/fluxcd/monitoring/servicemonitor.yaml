---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: reverse-tender-services
  namespace: reverse-tender
  labels:
    app.kubernetes.io/name: reverse-tender-services
    app.kubernetes.io/part-of: reverse-tender-platform
    blue-green.deployment/monitoring: "true"
spec:
  selector:
    matchLabels:
      tier: backend
  endpoints:
  - port: http
    interval: 30s
    path: /metrics
    scheme: http
    metricRelabelings:
    - sourceLabels: [__meta_kubernetes_pod_label_blue_green_deployment_environment]
      targetLabel: environment_color
    - sourceLabels: [__meta_kubernetes_service_name]
      targetLabel: service_name
  - port: http
    interval: 30s
    path: /octane/metrics
    scheme: http
    metricRelabelings:
    - sourceLabels: [__meta_kubernetes_pod_label_blue_green_deployment_environment]
      targetLabel: environment_color
    - sourceLabels: [__meta_kubernetes_service_name]
      targetLabel: service_name
      replacement: "${1}_octane"
