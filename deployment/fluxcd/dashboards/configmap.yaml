apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-fluxcd
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana-dashboards-fluxcd
    app.kubernetes.io/part-of: reverse-tender-platform
    grafana_dashboard: "1"
data:
  fluxcd-control-plane.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": "-- Grafana --",
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "FluxCD Control Plane monitoring dashboard for blue-green deployment",
      "editable": true,
      "gnetId": null,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 10,
                "gradientMode": "none",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "vis": false
                },
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "single"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(gotk_reconcile_condition{type=\"Ready\",status=\"True\"}[5m])) by (kind)",
              "interval": "",
              "legendFormat": "{{kind}} - Success",
              "refId": "A"
            },
            {
              "expr": "sum(rate(gotk_reconcile_condition{type=\"Ready\",status=\"False\"}[5m])) by (kind)",
              "interval": "",
              "legendFormat": "{{kind}} - Failure",
              "refId": "B"
            }
          ],
          "title": "Reconciliation Rate by Kind",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "8.0.0",
          "targets": [
            {
              "expr": "sum(gotk_reconcile_condition{type=\"Ready\",status=\"False\"})",
              "interval": "",
              "legendFormat": "Failed Resources",
              "refId": "A"
            }
          ],
          "title": "Failed Resources",
          "type": "stat"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 27,
      "style": "dark",
      "tags": [
        "flux",
        "gitops",
        "kubernetes"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "",
      "title": "FluxCD Control Plane",
      "uid": "flux-control-plane",
      "version": 1
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-blue-green
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana-dashboards-blue-green
    app.kubernetes.io/part-of: reverse-tender-platform
    grafana_dashboard: "1"
data:
  blue-green-deployment.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": "-- Grafana --",
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "Blue-Green Deployment monitoring dashboard for Laravel Reverse Tender Platform",
      "editable": true,
      "gnetId": null,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "blue": {
                      "color": "blue",
                      "index": 0,
                      "text": "Blue"
                    },
                    "green": {
                      "color": "green",
                      "index": 1,
                      "text": "Green"
                    }
                  },
                  "type": "value"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value"
          },
          "pluginVersion": "8.0.0",
          "targets": [
            {
              "expr": "label_replace(blue_green:active_environment, \"environment\", \"$1\", \"environment_color\", \"(.*)\")",
              "interval": "",
              "legendFormat": "{{environment_color}}",
              "refId": "A"
            }
          ],
          "title": "Active Environment",
          "type": "stat"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 27,
      "style": "dark",
      "tags": [
        "blue-green",
        "deployment",
        "laravel",
        "octane"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "",
      "title": "Blue-Green Deployment",
      "uid": "blue-green-deployment",
      "version": 1
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-database-failover
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana-dashboards-database-failover
    app.kubernetes.io/part-of: reverse-tender-platform
    grafana_dashboard: "1"
    flagger.app/monitoring: "true"
data:
  database-failover-overview.json: |
    {
      "dashboard": {
        "id": null,
        "title": "Database Failover Overview",
        "tags": ["database", "failover", "flagger", "reverse-tender"],
        "style": "dark",
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "Database Failover Status",
            "type": "stat",
            "targets": [
              {
                "expr": "database_failover:active_provider",
                "legendFormat": "Active Provider: {{provider}}"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {"mode": "palette-classic"},
                "custom": {"displayMode": "list", "orientation": "horizontal"},
                "mappings": [
                  {"options": {"neon": {"text": "Neon PostgreSQL", "color": "green"}}},
                  {"options": {"cnpg": {"text": "CNPG PostgreSQL", "color": "blue"}}},
                  {"options": {"mongodb": {"text": "MongoDB Atlas", "color": "orange"}}}
                ]
              }
            },
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "Available Database Providers",
            "type": "stat",
            "targets": [
              {
                "expr": "database_failover:available_providers_count",
                "legendFormat": "Available: {{value}}/3"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {"mode": "thresholds"},
                "thresholds": {
                  "steps": [
                    {"color": "red", "value": 0},
                    {"color": "yellow", "value": 1},
                    {"color": "green", "value": 2}
                  ]
                }
              }
            },
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
          },
          {
            "id": 3,
            "title": "Database Provider Health",
            "type": "timeseries",
            "targets": [
              {
                "expr": "database_failover_provider_health_status",
                "legendFormat": "{{provider}} Health"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {"mode": "palette-classic"},
                "custom": {"drawStyle": "line", "lineInterpolation": "linear"}
              }
            },
            "gridPos": {"h": 8, "w": 24, "x": 0, "y": 8}
          },
          {
            "id": 4,
            "title": "Query Latency (95th Percentile)",
            "type": "timeseries",
            "targets": [
              {
                "expr": "database_failover:query_latency_p95",
                "legendFormat": "{{provider}} P95 Latency"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {"mode": "palette-classic"},
                "unit": "s"
              }
            },
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16}
          },
          {
            "id": 5,
            "title": "Connection Pool Utilization",
            "type": "timeseries",
            "targets": [
              {
                "expr": "database_failover:connection_pool_utilization",
                "legendFormat": "{{provider}} Pool Usage"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {"mode": "palette-classic"},
                "unit": "percent",
                "max": 100
              }
            },
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16}
          }
        ],
        "time": {"from": "now-1h", "to": "now"},
        "refresh": "30s",
        "schemaVersion": 27,
        "version": 1,
        "uid": "database-failover-overview"
      }
    }
