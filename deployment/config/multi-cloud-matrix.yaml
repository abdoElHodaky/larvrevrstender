# Multi-Cloud Configuration Matrix for Reverse Tender Platform
# Defines supported combinations of cloud providers, environments, and configurations

apiVersion: v1
kind: ConfigMap
metadata:
  name: multi-cloud-configuration-matrix
  namespace: reverse-tender
  labels:
    app.kubernetes.io/name: reverse-tender
    app.kubernetes.io/component: configuration
    app.kubernetes.io/part-of: reverse-tender-platform
data:
  matrix.yaml: |
    # Multi-Cloud Configuration Matrix
    version: "2.0"
    
    # Supported cloud providers
    cloud_providers:
      gcp:
        name: "Google Cloud Platform"
        service: "GKE"
        controller: "gke.io/gateway-controller"
        load_balancer: "Global HTTP(S) Load Balancer"
        ssl_management: "Google-managed certificates"
        features:
          - "Cloud Armor (WAF/DDoS)"
          - "Cloud CDN"
          - "Global load balancing"
          - "Workload Identity"
        complexity: "medium"
        maturity: "high"
        cost_tier: "premium"
        
      azure:
        name: "Microsoft Azure"
        service: "AKS"
        controller: "azure/application-gateway"
        load_balancer: "Application Gateway"
        ssl_management: "Azure Key Vault"
        features:
          - "Web Application Firewall"
          - "Azure Monitor integration"
          - "Managed Identity"
          - "Azure Front Door"
        complexity: "medium"
        maturity: "high"
        cost_tier: "premium"
        
      digitalocean:
        name: "DigitalOcean"
        service: "DOKS"
        controller: "nginx.org/nginx-gateway-fabric"
        load_balancer: "DigitalOcean Load Balancer"
        ssl_management: "DigitalOcean Certificates"
        features:
          - "Managed load balancer"
          - "Simple SSL configuration"
          - "Health checks"
          - "Sticky sessions"
        complexity: "low"
        maturity: "medium"
        cost_tier: "standard"
        
      linode:
        name: "Linode"
        service: "LKE"
        controller: "nginx.org/nginx-gateway-fabric"
        load_balancer: "NodeBalancer"
        ssl_management: "cert-manager + Let's Encrypt"
        features:
          - "NodeBalancer"
          - "Automatic SSL certificates"
          - "Health checks"
          - "Regional deployment"
        complexity: "low"
        maturity: "medium"
        cost_tier: "budget"
        
      openstack:
        name: "OpenStack"
        service: "Kubernetes"
        controller: "nginx.org/nginx-gateway-fabric"
        load_balancer: "Octavia Load Balancer"
        ssl_management: "Barbican Key Manager"
        features:
          - "Octavia LBaaS v2"
          - "Neutron networking"
          - "Heat templates"
          - "Barbican secrets"
        complexity: "high"
        maturity: "medium"
        cost_tier: "variable"
    
    # Supported environments
    environments:
      development:
        description: "Development environment"
        replicas: 1
        resources:
          cpu: "100m"
          memory: "128Mi"
        load_balancer_size: "small"
        ssl_required: false
        monitoring: "basic"
        
      staging:
        description: "Staging environment"
        replicas: 2
        resources:
          cpu: "200m"
          memory: "256Mi"
        load_balancer_size: "medium"
        ssl_required: true
        monitoring: "standard"
        
      production:
        description: "Production environment"
        replicas: 3
        resources:
          cpu: "500m"
          memory: "512Mi"
        load_balancer_size: "large"
        ssl_required: true
        monitoring: "comprehensive"
    
    # Configuration matrix - supported combinations
    supported_combinations:
      # GCP combinations
      - provider: "gcp"
        environment: "development"
        gateway_class: "reverse-tender-gke-gateway-class"
        load_balancer_type: "EXTERNAL_MANAGED"
        ssl_policy: "modern"
        cdn_enabled: false
        
      - provider: "gcp"
        environment: "staging"
        gateway_class: "reverse-tender-gke-gateway-class"
        load_balancer_type: "EXTERNAL_MANAGED"
        ssl_policy: "modern"
        cdn_enabled: true
        
      - provider: "gcp"
        environment: "production"
        gateway_class: "reverse-tender-gke-gateway-class"
        load_balancer_type: "EXTERNAL_MANAGED"
        ssl_policy: "modern"
        cdn_enabled: true
        security_policy: "reverse-tender-security-policy"
        
      # Azure combinations
      - provider: "azure"
        environment: "development"
        gateway_class: "reverse-tender-azure-gateway-class"
        application_gateway_sku: "Standard_v2"
        waf_enabled: false
        
      - provider: "azure"
        environment: "staging"
        gateway_class: "reverse-tender-azure-gateway-class"
        application_gateway_sku: "Standard_v2"
        waf_enabled: true
        
      - provider: "azure"
        environment: "production"
        gateway_class: "reverse-tender-azure-gateway-class"
        application_gateway_sku: "WAF_v2"
        waf_enabled: true
        front_door_enabled: true
        
      # DigitalOcean combinations
      - provider: "digitalocean"
        environment: "development"
        gateway_class: "reverse-tender-do-gateway-class"
        load_balancer_size: "lb-small"
        sticky_sessions: false
        
      - provider: "digitalocean"
        environment: "staging"
        gateway_class: "reverse-tender-do-gateway-class"
        load_balancer_size: "lb-medium"
        sticky_sessions: true
        
      - provider: "digitalocean"
        environment: "production"
        gateway_class: "reverse-tender-do-gateway-class"
        load_balancer_size: "lb-large"
        sticky_sessions: true
        firewall_enabled: true
        
      # Linode combinations
      - provider: "linode"
        environment: "development"
        gateway_class: "reverse-tender-linode-gateway-class"
        nodebalancer_throttle: "10"
        cert_manager_enabled: true
        
      - provider: "linode"
        environment: "staging"
        gateway_class: "reverse-tender-linode-gateway-class"
        nodebalancer_throttle: "20"
        cert_manager_enabled: true
        
      - provider: "linode"
        environment: "production"
        gateway_class: "reverse-tender-linode-gateway-class"
        nodebalancer_throttle: "20"
        cert_manager_enabled: true
        firewall_enabled: true
        
      # OpenStack combinations
      - provider: "openstack"
        environment: "development"
        gateway_class: "reverse-tender-openstack-gateway-class"
        load_balancer_provider: "amphora"
        barbican_enabled: false
        
      - provider: "openstack"
        environment: "staging"
        gateway_class: "reverse-tender-openstack-gateway-class"
        load_balancer_provider: "amphora"
        barbican_enabled: true
        
      - provider: "openstack"
        environment: "production"
        gateway_class: "reverse-tender-openstack-gateway-class"
        load_balancer_provider: "amphora"
        barbican_enabled: true
        heat_template_enabled: true
    
    # Multi-cloud deployment scenarios
    deployment_scenarios:
      single_cloud:
        description: "Single cloud provider deployment"
        providers: 1
        complexity: "low"
        use_cases:
          - "Simple deployment"
          - "Cost optimization"
          - "Single region requirements"
        
      primary_backup:
        description: "Primary cloud with backup cloud for disaster recovery"
        providers: 2
        complexity: "medium"
        use_cases:
          - "Disaster recovery"
          - "Business continuity"
          - "Risk mitigation"
        
      geographic_distribution:
        description: "Multiple clouds for geographic distribution"
        providers: 2-3
        complexity: "high"
        use_cases:
          - "Global presence"
          - "Latency optimization"
          - "Regulatory compliance"
        
      hybrid_cloud:
        description: "Mix of cloud and on-premises (OpenStack)"
        providers: 2-4
        complexity: "very high"
        use_cases:
          - "Data sovereignty"
          - "Legacy system integration"
          - "Gradual cloud migration"
        
      multi_cloud_active:
        description: "Active-active deployment across multiple clouds"
        providers: 3-5
        complexity: "very high"
        use_cases:
          - "Maximum availability"
          - "Vendor lock-in avoidance"
          - "Performance optimization"
    
    # Feature compatibility matrix
    feature_compatibility:
      ssl_termination:
        gcp: "native"
        azure: "native"
        digitalocean: "native"
        linode: "cert-manager"
        openstack: "barbican"
        
      load_balancer_types:
        gcp: ["EXTERNAL_MANAGED", "INTERNAL_MANAGED"]
        azure: ["ApplicationGateway", "LoadBalancer"]
        digitalocean: ["LoadBalancer"]
        linode: ["NodeBalancer"]
        openstack: ["Octavia"]
        
      session_persistence:
        gcp: "CLIENT_IP"
        azure: "GENERATED_COOKIE"
        digitalocean: "cookies"
        linode: "CLIENT_IP"
        openstack: "HTTP_COOKIE"
        
      health_checks:
        gcp: "native"
        azure: "native"
        digitalocean: "native"
        linode: "native"
        openstack: "native"
        
      waf_ddos_protection:
        gcp: "Cloud Armor"
        azure: "Application Gateway WAF"
        digitalocean: "limited"
        linode: "limited"
        openstack: "limited"
        
      cdn_integration:
        gcp: "Cloud CDN"
        azure: "Azure Front Door"
        digitalocean: "limited"
        linode: "none"
        openstack: "none"
    
    # Cost comparison (relative scale 1-5, 5 being most expensive)
    cost_comparison:
      gcp:
        load_balancer: 4
        ssl_certificates: 1  # Free managed certificates
        bandwidth: 3
        compute: 4
        total_score: 3.0
        
      azure:
        load_balancer: 4
        ssl_certificates: 2  # Key Vault costs
        bandwidth: 3
        compute: 4
        total_score: 3.25
        
      digitalocean:
        load_balancer: 2
        ssl_certificates: 1  # Free certificates
        bandwidth: 2
        compute: 2
        total_score: 1.75
        
      linode:
        load_balancer: 2
        ssl_certificates: 1  # Free Let's Encrypt
        bandwidth: 2
        compute: 2
        total_score: 1.75
        
      openstack:
        load_balancer: 1  # Variable, depends on deployment
        ssl_certificates: 1
        bandwidth: 1
        compute: 1
        total_score: 1.0  # Highly variable
    
    # Performance characteristics
    performance_characteristics:
      gcp:
        global_reach: "excellent"
        latency: "low"
        throughput: "high"
        availability: "99.95%"
        
      azure:
        global_reach: "excellent"
        latency: "low"
        throughput: "high"
        availability: "99.95%"
        
      digitalocean:
        global_reach: "good"
        latency: "medium"
        throughput: "medium"
        availability: "99.9%"
        
      linode:
        global_reach: "good"
        latency: "medium"
        throughput: "medium"
        availability: "99.9%"
        
      openstack:
        global_reach: "variable"
        latency: "variable"
        throughput: "variable"
        availability: "variable"

