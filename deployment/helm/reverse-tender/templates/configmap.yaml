apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "reverse-tender.fullname" . }}-config
  labels:
    {{- include "reverse-tender.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.configMaps.app }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  
  # Blue-Green Configuration
  BLUE_GREEN_ENABLED: {{ .Values.blueGreen.enabled | quote }}
  BLUE_GREEN_ACTIVE_ENVIRONMENT: {{ .Values.blueGreen.activeEnvironment | quote }}
  BLUE_GREEN_CANARY_PERCENTAGE: {{ .Values.blueGreen.trafficSwitching.canaryPercentage | quote }}
  
  # Database URL
  DATABASE_URL: {{ include "reverse-tender.databaseUrl" . | quote }}
  
  # Redis URL
  REDIS_URL: {{ include "reverse-tender.redisUrl" . | quote }}
