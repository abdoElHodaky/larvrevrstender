{{- range $serviceName, $serviceConfig := .Values.microservices }}
{{- if $serviceConfig.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "reverse-tender.fullname" $ }}-{{ $serviceName }}-{{ $.Values.environment }}
  labels:
    {{- include "reverse-tender.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $serviceName }}
    environment: {{ $.Values.environment }}
  {{- with $.Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $.Values.service.type }}
  ports:
    - port: {{ $serviceConfig.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "reverse-tender.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $serviceName }}
    environment: {{ $.Values.environment }}
{{- end }}
{{- end }}

---
# Main service for traffic switching (Blue-Green)
apiVersion: v1
kind: Service
metadata:
  name: {{ include "reverse-tender.fullname" . }}-main
  labels:
    {{- include "reverse-tender.labels" . | nindent 4 }}
    app.kubernetes.io/component: main
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "reverse-tender.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
    environment: {{ .Values.blueGreen.activeEnvironment }}
