# Default values for rpc-services.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  imageRegistry: ghcr.io
  imagePullPolicy: IfNotPresent
  storageClass: ""

# Service configurations
services:
  authService:
    enabled: true
    name: auth-service
    replicas: 1
    image: 
      repository: abdoElHodaky/larvrevrstender/auth-service
      tag: latest
      pullPolicy: IfNotPresent
    port: 8000
    targetPort: 8000
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"
    env: []
    
  userService:
    enabled: true
    name: user-service
    replicas: 1
    image: 
      repository: abdoElHodaky/larvrevrstender/user-service
      tag: latest
      pullPolicy: IfNotPresent
    port: 8001
    targetPort: 8001
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"
    env: []

  analyticsService:
    enabled: true
    name: analytics-service
    replicas: 1
    image: 
      repository: abdoElHodaky/larvrevrstender/analytics-service
      tag: latest
      pullPolicy: IfNotPresent
    port: 8002
    targetPort: 8002
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"
    env: []

  notificationService:
    enabled: true
    name: notification-service
    replicas: 1
    image: 
      repository: abdoElHodaky/larvrevrstender/notification-service
      tag: latest
      pullPolicy: IfNotPresent
    port: 8003
    targetPort: 8003
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"
    env: []

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: rpc.local
      paths:
        - path: /
          pathType: Prefix
          service: auth-service
        - path: /api/users
          pathType: Prefix
          service: user-service
        - path: /api/analytics
          pathType: Prefix
          service: analytics-service
        - path: /api/notifications
          pathType: Prefix
          service: notification-service
  tls: []

# Redis configuration (external dependency)
redis:
  enabled: true
  auth:
    enabled: false
  master:
    persistence:
      enabled: false
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"
  replica:
    replicaCount: 0

# PostgreSQL configuration (using external Neon service)
postgresql:
  enabled: false

# Service account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod security context
podSecurityContext: {}

# Security context
securityContext: {}

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Autoscaling
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
