# Prometheus Configuration for Laravel 12 + Octane Monitoring
# Optimized for Reverse Tender Platform microservices

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'reverse-tender'
    environment: '${ENVIRONMENT:-production}'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'.
rule_files:
  - "alert_rules.yml"
  - "recording_rules.yml"

# Scrape configuration
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # API Gateway monitoring
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8000']
    metrics_path: '/octane/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    params:
      format: ['prometheus']

  # Auth Service monitoring
  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:8001']
    metrics_path: '/octane/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Bidding Service monitoring (with WebSocket metrics)
  - job_name: 'bidding-service'
    static_configs:
      - targets: ['bidding-service:8002']
    metrics_path: '/octane/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # User Service monitoring
  - job_name: 'user-service'
    static_configs:
      - targets: ['user-service:8003']
    metrics_path: '/octane/metrics'
    scrape_interval: 10s

  # Order Service monitoring
  - job_name: 'order-service'
    static_configs:
      - targets: ['order-service:8004']
    metrics_path: '/octane/metrics'
    scrape_interval: 10s

  # Notification Service monitoring
  - job_name: 'notification-service'
    static_configs:
      - targets: ['notification-service:8005']
    metrics_path: '/octane/metrics'
    scrape_interval: 10s

  # Payment Service monitoring
  - job_name: 'payment-service'
    static_configs:
      - targets: ['payment-service:8006']
    metrics_path: '/octane/metrics'
    scrape_interval: 10s

  # Analytics Service monitoring
  - job_name: 'analytics-service'
    static_configs:
      - targets: ['analytics-service:8007']
    metrics_path: '/octane/metrics'
    scrape_interval: 10s

  # VIN OCR Service monitoring
  - job_name: 'vin-ocr-service'
    static_configs:
      - targets: ['vin-ocr-service:8008']
    metrics_path: '/octane/metrics'
    scrape_interval: 10s

  # Infrastructure monitoring
  # Note: PostgreSQL and Upstash Redis monitoring handled externally
  # PostgreSQL: Use managed PostgreSQL monitoring dashboard
  # Upstash Redis: Use Upstash Console for Redis monitoring

  # Node exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s

  # cAdvisor for container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 30s

  # Laravel Reverb WebSocket metrics
  - job_name: 'reverb-websocket'
    static_configs:
      - targets: ['bidding-service:8080']
    metrics_path: '/metrics'
    scrape_interval: 15s

# Remote write configuration for long-term storage (optional)
# remote_write:
#   - url: "https://prometheus-remote-write-endpoint"
#     basic_auth:
#       username: "${REMOTE_WRITE_USERNAME}"
#       password: "${REMOTE_WRITE_PASSWORD}"
