# Prometheus Alert Rules for Laravel 12 + Octane Monitoring
# Reverse Tender Platform - Production Alerts

groups:
  - name: octane_workers
    rules:
      - alert: OctaneWorkersDown
        expr: up{job=~".*-service"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Octane workers are down for {{ $labels.job }}"
          description: "{{ $labels.job }} has been down for more than 1 minute."

      - alert: OctaneHighMemoryUsage
        expr: (container_memory_usage_bytes{name=~"rt_.*_service"} / container_spec_memory_limit_bytes{name=~"rt_.*_service"}) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage for {{ $labels.name }}"
          description: "{{ $labels.name }} is using {{ $value }}% of allocated memory."

      - alert: OctaneHighCPUUsage
        expr: rate(container_cpu_usage_seconds_total{name=~"rt_.*_service"}[5m]) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage for {{ $labels.name }}"
          description: "{{ $labels.name }} CPU usage is {{ $value }}%."

  - name: laravel_application
    rules:
      - alert: HighErrorRate
        expr: rate(laravel_requests_total{status=~"5.."}[5m]) / rate(laravel_requests_total[5m]) * 100 > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High error rate for {{ $labels.service }}"
          description: "Error rate is {{ $value }}% for {{ $labels.service }}."

      - alert: SlowResponseTime
        expr: histogram_quantile(0.95, rate(laravel_request_duration_seconds_bucket[5m])) > 2
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Slow response time for {{ $labels.service }}"
          description: "95th percentile response time is {{ $value }}s for {{ $labels.service }}."

      # Note: Database connection monitoring moved to managed PostgreSQL service
      # Monitor PostgreSQL connections through your managed database provider's dashboard

  - name: infrastructure
    rules:
      # Note: Redis and PostgreSQL monitoring moved to external managed services
      # Redis: Monitor through Upstash Console - https://console.upstash.com/
      # PostgreSQL: Monitor through your managed database provider's dashboard

      - alert: DiskSpaceHigh
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Low disk space"
          description: "Disk space is below 10% on {{ $labels.instance }}."

  - name: websocket
    rules:
      - alert: ReverbConnectionsHigh
        expr: reverb_connections_total > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High WebSocket connections"
          description: "Laravel Reverb has {{ $value }} active connections."

      - alert: ReverbMessageQueueHigh
        expr: reverb_message_queue_size > 100
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High WebSocket message queue"
          description: "Laravel Reverb message queue has {{ $value }} pending messages."
