version: '3.8'

# Docker Compose file for building services with proper shared context
# This builds from repository root to include both services and shared directories

services:
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
      args:
        SERVICE_NAME: gateway
    image: larvrevrstender/gateway:latest

  analytics:
    build:
      context: .
      dockerfile: services/analytics/Dockerfile
      args:
        SERVICE_NAME: analytics
    image: larvrevrstender/analytics:latest

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
      args:
        SERVICE_NAME: auth
    image: larvrevrstender/auth:latest

  users:
    build:
      context: .
      dockerfile: services/users/Dockerfile
      args:
        SERVICE_NAME: users
    image: larvrevrstender/users:latest

  payments:
    build:
      context: .
      dockerfile: services/payments/Dockerfile
      args:
        SERVICE_NAME: payments
    image: larvrevrstender/payments:latest

  orders:
    build:
      context: .
      dockerfile: services/orders/Dockerfile
      args:
        SERVICE_NAME: orders
    image: larvrevrstender/orders:latest

  bidding:
    build:
      context: .
      dockerfile: services/bidding/Dockerfile
      args:
        SERVICE_NAME: bidding
    image: larvrevrstender/bidding:latest

  notifications:
    build:
      context: .
      dockerfile: services/notifications/Dockerfile
      args:
        SERVICE_NAME: notifications
    image: larvrevrstender/notifications:latest

  auctions:
    build:
      context: .
      dockerfile: services/auctions/Dockerfile
      args:
        SERVICE_NAME: auctions
    image: larvrevrstender/auctions:latest

  vin-ocr:
    build:
      context: .
      dockerfile: services/vin-ocr/Dockerfile
      args:
        SERVICE_NAME: vin-ocr
    image: larvrevrstender/vin-ocr:latest

