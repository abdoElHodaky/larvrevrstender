# 🗄️ Database Configuration for Laravel Reverse Tender Platform
# Primary: Neon PostgreSQL | Secondary: Cloud PostgreSQL | Fallback: MongoDB Atlas

version: '3.8'

services:
  # Primary PostgreSQL Database (Neon-compatible)
  postgres-primary:
    image: postgres:15-alpine
    container_name: larvrevrstender-postgres-primary
    environment:
      POSTGRES_DB: larvrevrstender_primary
      POSTGRES_USER: ${DB_USERNAME:-larvrevrstender}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password_123}
      POSTGRES_MULTIPLE_DATABASES: "auth_service,user_service,auction_service,bidding_service,payment_service,order_service,notification_service,analytics_service,gateway_service,vin_ocr_service,shared_service"
    ports:
      - "5432:5432"
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - ./database/init-scripts:/docker-entrypoint-initdb.d
    networks:
      - larvrevrstender-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-larvrevrstender}"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Secondary PostgreSQL Database (Cloud backup)
  postgres-secondary:
    image: postgres:15-alpine
    container_name: larvrevrstender-postgres-secondary
    environment:
      POSTGRES_DB: larvrevrstender_secondary
      POSTGRES_USER: ${DB_USERNAME:-larvrevrstender}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password_123}
      POSTGRES_MULTIPLE_DATABASES: "auth_service,user_service,auction_service,bidding_service,payment_service,order_service,notification_service,analytics_service,gateway_service,vin_ocr_service,shared_service"
    ports:
      - "5433:5432"
    volumes:
      - postgres_secondary_data:/var/lib/postgresql/data
      - ./database/init-scripts:/docker-entrypoint-initdb.d
    networks:
      - larvrevrstender-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-larvrevrstender}"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MongoDB Atlas Fallback (Local development)
  mongodb-fallback:
    image: mongo:7.0
    container_name: larvrevrstender-mongodb-fallback
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-larvrevrstender}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-secure_password_123}
      MONGO_INITDB_DATABASE: larvrevrstender_fallback
    ports:
      - "27017:27017"
    volumes:
      - mongodb_fallback_data:/data/db
      - ./database/mongo-init:/docker-entrypoint-initdb.d
    networks:
      - larvrevrstender-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for Caching and Session Management
  redis:
    image: redis:7-alpine
    container_name: larvrevrstender-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - larvrevrstender-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Database Administration Tools
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: larvrevrstender-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@larvrevrstender.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_password_123}
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - larvrevrstender-network
    restart: unless-stopped
    depends_on:
      - postgres-primary
      - postgres-secondary

  mongo-express:
    image: mongo-express:latest
    container_name: larvrevrstender-mongo-express
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USERNAME:-larvrevrstender}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD:-secure_password_123}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USERNAME:-larvrevrstender}:${MONGO_PASSWORD:-secure_password_123}@mongodb-fallback:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-admin_password_123}
    ports:
      - "8081:8081"
    networks:
      - larvrevrstender-network
    restart: unless-stopped
    depends_on:
      - mongodb-fallback

volumes:
  postgres_primary_data:
    driver: local
  postgres_secondary_data:
    driver: local
  mongodb_fallback_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  larvrevrstender-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
