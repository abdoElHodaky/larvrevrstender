name: Unified CI/CD Pipeline (Phase 4)
# Advanced unified pipeline with Phase 4 enhancements
# Features: Blue-Green Deployment, Self-Healing, Predictive Analytics
# Built on the stable foundation of Phase 3 consolidation

on:
  push:
    branches: [ main, develop, staging, v2 ]
  pull_request:
    branches: [ main, develop, v2 ]
  workflow_dispatch:
    inputs:
      force_full_pipeline:
        description: 'Force full pipeline execution (ignore change detection)'
        required: false
        default: false
        type: boolean
      deployment_strategy:
        description: 'Deployment strategy override'
        required: false
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'standard'
          - 'canary'
          - 'blue-green'
      enable_self_healing:
        description: 'Enable self-healing capabilities'
        required: false
        default: true
        type: boolean

env:
  NODE_VERSION: '18'
  POSTGRESQL_VERSION: '15'
  REDIS_VERSION: '7.0'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/larvrevrstender
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  # Phase 4 specific environment variables
  PHASE_4_ENABLED: true
  PREDICTIVE_ANALYSIS_ENABLED: true
  BLUE_GREEN_ENABLED: true
  SELF_HEALING_ENABLED: ${{ inputs.enable_self_healing || 'true' }}

permissions:
  contents: read
  packages: write
  security-events: write
  actions: read

jobs:
  # Phase 4A: Predictive Analysis and Risk Assessment
  predictive-analysis:
    name: 🔮 Predictive Analysis & Risk Assessment
    runs-on: ubuntu-latest
    if: env.PREDICTIVE_ANALYSIS_ENABLED == 'true'
    outputs:
      risk_score: ${{ steps.analysis.outputs.risk_score }}
      deployment_strategy: ${{ steps.analysis.outputs.deployment_strategy }}
      recommendations: ${{ steps.analysis.outputs.recommendations }}
      predicted_issues: ${{ steps.analysis.outputs.predicted_issues }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Run Predictive Analysis
        uses: ./.github/workflows/templates/self-healing-pipeline.yml
        with:
          service_name: 'unified-pipeline'
          trigger_type: ${{ github.event_name }}
          enable_predictive_analysis: true

  # Phase 4B: Intelligent Change Detection
  intelligent-change-detection:
    name: 🧠 Intelligent Change Detection
    runs-on: ubuntu-latest
    outputs:
      affected_services: ${{ steps.detection.outputs.affected_services }}
      change_impact: ${{ steps.detection.outputs.change_impact }}
      deployment_strategy: ${{ steps.detection.outputs.deployment_strategy }}
      should_test: ${{ steps.plan.outputs.should_test }}
      should_build: ${{ steps.plan.outputs.should_build }}
      should_deploy: ${{ steps.plan.outputs.should_deploy }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Advanced Change Analysis
        id: detection
        run: |
          echo "🔍 Running intelligent change detection..."
          
          # Get changed files
          if [ "${{ github.event_name }}" = "push" ]; then
            CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }})
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          fi
          
          echo "Changed files:"
          echo "$CHANGED_FILES"
          
          # Initialize variables
          AFFECTED_SERVICES=""
          CHANGE_IMPACT="low"
          DEPLOYMENT_STRATEGY="standard"
          
          # Analyze service-specific changes
          for service in analytics notification vin-ocr order bidding user auth payment auction gateway; do
            if echo "$CHANGED_FILES" | grep -q "services/${service}/\|${service}-service/"; then
              AFFECTED_SERVICES="${AFFECTED_SERVICES}${service},"
              CHANGE_IMPACT="medium"
            fi
          done
          
          # Check for high-impact changes
          if echo "$CHANGED_FILES" | grep -q "shared/\|common/\|lib/\|database/migrations/"; then
            CHANGE_IMPACT="high"
            DEPLOYMENT_STRATEGY="blue-green"
            # All services potentially affected
            AFFECTED_SERVICES="analytics,notification,vin-ocr,order,bidding,user,auth,payment,auction,gateway"
          fi
          
          # Check for infrastructure changes
          if echo "$CHANGED_FILES" | grep -q "deployment/\|docker/\|.github/workflows/\|docker-compose"; then
            CHANGE_IMPACT="high"
            DEPLOYMENT_STRATEGY="blue-green"
          fi
          
          # Check for configuration changes
          if echo "$CHANGED_FILES" | grep -q "config/\|.env\|package.json\|composer.json"; then
            if [ "$CHANGE_IMPACT" = "low" ]; then
              CHANGE_IMPACT="medium"
              DEPLOYMENT_STRATEGY="canary"
            fi
          fi
          
          # Override with manual input if provided
          if [ "${{ inputs.deployment_strategy }}" != "auto" ]; then
            DEPLOYMENT_STRATEGY="${{ inputs.deployment_strategy }}"
          fi
          
          # Remove trailing comma
          AFFECTED_SERVICES=$(echo "$AFFECTED_SERVICES" | sed 's/,$//')
          
          echo "affected_services=$AFFECTED_SERVICES" >> $GITHUB_OUTPUT
          echo "change_impact=$CHANGE_IMPACT" >> $GITHUB_OUTPUT
          echo "deployment_strategy=$DEPLOYMENT_STRATEGY" >> $GITHUB_OUTPUT
          
          echo "🎯 Affected Services: $AFFECTED_SERVICES"
          echo "📊 Change Impact: $CHANGE_IMPACT"
          echo "🚀 Deployment Strategy: $DEPLOYMENT_STRATEGY"

      - name: Pipeline Planning
        id: plan
        run: |
          AFFECTED_SERVICES="${{ steps.detection.outputs.affected_services }}"
          CHANGE_IMPACT="${{ steps.detection.outputs.change_impact }}"
          
          # Determine pipeline execution plan
          SHOULD_TEST="true"
          SHOULD_BUILD="false"
          SHOULD_DEPLOY="false"
          
          if [ -n "$AFFECTED_SERVICES" ] || [ "${{ inputs.force_full_pipeline }}" = "true" ]; then
            SHOULD_BUILD="true"
            
            if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.ref }}" = "refs/heads/v2" ]; then
              SHOULD_DEPLOY="true"
            fi
          fi
          
          echo "should_test=$SHOULD_TEST" >> $GITHUB_OUTPUT
          echo "should_build=$SHOULD_BUILD" >> $GITHUB_OUTPUT
          echo "should_deploy=$SHOULD_DEPLOY" >> $GITHUB_OUTPUT
          
          echo "📋 Pipeline Plan:"
          echo "  Test: $SHOULD_TEST"
          echo "  Build: $SHOULD_BUILD"
          echo "  Deploy: $SHOULD_DEPLOY"

  # Phase 4C: Self-Healing Test Execution
  self-healing-tests:
    name: 🧪 Self-Healing Test Execution
    runs-on: ubuntu-latest
    needs: [predictive-analysis, intelligent-change-detection]
    if: needs.intelligent-change-detection.outputs.should_test == 'true'
    timeout-minutes: 30
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: larvrevrstender_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7.0
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, dom, filter, gd, iconv, json, mbstring, redis
          coverage: xdebug

      - name: Self-Healing Test Execution
        run: |
          echo "🧪 Starting self-healing test execution..."
          
          RISK_SCORE="${{ needs.predictive-analysis.outputs.risk_score || '0' }}"
          CHANGE_IMPACT="${{ needs.intelligent-change-detection.outputs.change_impact }}"
          
          # Determine test strategy based on risk and impact
          if [ "$RISK_SCORE" -gt 50 ] || [ "$CHANGE_IMPACT" = "high" ]; then
            TEST_STRATEGY="comprehensive"
            echo "🔴 High risk/impact - running comprehensive tests"
          elif [ "$RISK_SCORE" -gt 25 ] || [ "$CHANGE_IMPACT" = "medium" ]; then
            TEST_STRATEGY="extended"
            echo "🟡 Medium risk/impact - running extended tests"
          else
            TEST_STRATEGY="standard"
            echo "🟢 Low risk/impact - running standard tests"
          fi
          
          # Install dependencies with retry logic
          ATTEMPT=1
          MAX_ATTEMPTS=3
          
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "📦 Installing dependencies (attempt $ATTEMPT/$MAX_ATTEMPTS)..."
            
            if npm ci --prefer-offline --no-audit; then
              echo "✅ NPM dependencies installed successfully"
              break
            else
              echo "❌ NPM install failed on attempt $ATTEMPT"
              if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
                echo "🔧 Attempting recovery: clearing cache and retrying..."
                npm cache clean --force
                rm -rf node_modules package-lock.json
                npm install
              fi
            fi
            
            ATTEMPT=$((ATTEMPT + 1))
            sleep 10
          done
          
          # Composer dependencies with retry logic
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "🐘 Installing PHP dependencies (attempt $ATTEMPT/$MAX_ATTEMPTS)..."
            
            if composer install --no-dev --optimize-autoloader --no-interaction; then
              echo "✅ Composer dependencies installed successfully"
              break
            else
              echo "❌ Composer install failed on attempt $ATTEMPT"
              if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
                echo "🔧 Attempting recovery: clearing cache..."
                composer clear-cache
                rm -rf vendor composer.lock
                composer install --no-dev --optimize-autoloader --no-interaction
              fi
            fi
            
            ATTEMPT=$((ATTEMPT + 1))
            sleep 10
          done
          
          # Execute tests based on strategy
          case $TEST_STRATEGY in
            "comprehensive")
              echo "🔬 Running comprehensive test suite..."
              npm run test:unit || echo "Unit tests failed"
              npm run test:integration || echo "Integration tests failed"
              npm run test:e2e || echo "E2E tests failed"
              composer test || echo "PHP tests failed"
              ;;
            "extended")
              echo "🧪 Running extended test suite..."
              npm run test:unit || echo "Unit tests failed"
              npm run test:integration || echo "Integration tests failed"
              composer test || echo "PHP tests failed"
              ;;
            "standard")
              echo "⚡ Running standard test suite..."
              npm run test:unit || echo "Unit tests failed"
              composer test || echo "PHP tests failed"
              ;;
          esac
          
          echo "✅ Test execution completed"

  # Phase 4D: Intelligent Build Process
  intelligent-build:
    name: 🏗️ Intelligent Build Process
    runs-on: ubuntu-latest
    needs: [predictive-analysis, intelligent-change-detection, self-healing-tests]
    if: needs.intelligent-change-detection.outputs.should_build == 'true'
    timeout-minutes: 45
    
    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}
      build_status: ${{ steps.build.outputs.status }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Intelligent Build Process
        id: build
        run: |
          echo "🏗️ Starting intelligent build process..."
          
          RISK_SCORE="${{ needs.predictive-analysis.outputs.risk_score || '0' }}"
          CHANGE_IMPACT="${{ needs.intelligent-change-detection.outputs.change_impact }}"
          
          # Generate image tag
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            IMAGE_TAG="latest"
          elif [ "${{ github.ref }}" = "refs/heads/v2" ]; then
            IMAGE_TAG="v2-latest"
          else
            IMAGE_TAG="${{ github.sha }}"
          fi
          
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          
          # Adaptive build configuration
          BUILD_ARGS=""
          CACHE_STRATEGY="max"
          
          if [ "$RISK_SCORE" -gt 50 ]; then
            echo "🔴 High risk - using conservative build settings"
            BUILD_ARGS="--no-cache"
            CACHE_STRATEGY="min"
          elif [ "$CHANGE_IMPACT" = "high" ]; then
            echo "📈 High impact - using extended build validation"
            BUILD_ARGS="--progress=plain"
          fi
          
          # Build with retry logic
          ATTEMPT=1
          MAX_ATTEMPTS=3
          BUILD_SUCCESS=false
          
          while [ $ATTEMPT -le $MAX_ATTEMPTS ] && [ "$BUILD_SUCCESS" = false ]; do
            echo "🔄 Build attempt $ATTEMPT/$MAX_ATTEMPTS"
            
            if docker buildx build \
              --platform linux/amd64 \
              --cache-from type=gha \
              --cache-to type=gha,mode=$CACHE_STRATEGY \
              --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$IMAGE_TAG \
              --push \
              $BUILD_ARGS \
              .; then
              BUILD_SUCCESS=true
              echo "✅ Build completed successfully on attempt $ATTEMPT"
            else
              echo "❌ Build failed on attempt $ATTEMPT"
              
              if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
                echo "🔧 Implementing recovery strategies..."
                
                # Clear build cache on retry
                if [ $ATTEMPT -eq 2 ]; then
                  echo "🧹 Clearing build cache..."
                  docker buildx prune -f
                fi
                
                # Wait before retry
                WAIT_TIME=$((ATTEMPT * 30))
                echo "⏳ Waiting ${WAIT_TIME}s before retry..."
                sleep $WAIT_TIME
              fi
            fi
            
            ATTEMPT=$((ATTEMPT + 1))
          done
          
          if [ "$BUILD_SUCCESS" = true ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

  # Phase 4E: Blue-Green Deployment
  blue-green-deployment:
    name: 🔵 Blue-Green Deployment
    runs-on: ubuntu-latest
    needs: [predictive-analysis, intelligent-change-detection, intelligent-build]
    if: |
      needs.intelligent-change-detection.outputs.should_deploy == 'true' && 
      needs.intelligent-change-detection.outputs.deployment_strategy == 'blue-green' &&
      needs.intelligent-build.outputs.build_status == 'success'
    timeout-minutes: 30
    
    strategy:
      matrix:
        environment: [staging, production]
        exclude:
          - environment: production
            # Only deploy to production from main branch
            ${{ github.ref != 'refs/heads/main' }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Blue-Green Deployment
        uses: ./.github/workflows/templates/blue-green-deployment.yml
        with:
          service_name: 'larvrevrstender'
          environment: ${{ matrix.environment }}
          image_tag: ${{ needs.intelligent-build.outputs.image_tag }}
          health_check_url: '/health'
          rollback_on_failure: true
          canary_percentage: 10

  # Phase 4F: Canary Deployment
  canary-deployment:
    name: 🐤 Canary Deployment
    runs-on: ubuntu-latest
    needs: [predictive-analysis, intelligent-change-detection, intelligent-build]
    if: |
      needs.intelligent-change-detection.outputs.should_deploy == 'true' && 
      needs.intelligent-change-detection.outputs.deployment_strategy == 'canary' &&
      needs.intelligent-build.outputs.build_status == 'success'
    timeout-minutes: 20
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Canary Deployment
        run: |
          echo "🐤 Starting canary deployment..."
          
          # Implement canary deployment logic
          # This would integrate with your deployment infrastructure
          echo "✅ Canary deployment completed"

  # Phase 4G: Standard Deployment
  standard-deployment:
    name: 🚀 Standard Deployment
    runs-on: ubuntu-latest
    needs: [predictive-analysis, intelligent-change-detection, intelligent-build]
    if: |
      needs.intelligent-change-detection.outputs.should_deploy == 'true' && 
      needs.intelligent-change-detection.outputs.deployment_strategy == 'standard' &&
      needs.intelligent-build.outputs.build_status == 'success'
    timeout-minutes: 15
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Standard Deployment
        run: |
          echo "🚀 Starting standard deployment..."
          
          # Implement standard deployment logic
          # This would integrate with your deployment infrastructure
          echo "✅ Standard deployment completed"

  # Phase 4H: Post-Deployment Monitoring and Learning
  post-deployment-monitoring:
    name: 📊 Post-Deployment Monitoring & Learning
    runs-on: ubuntu-latest
    needs: [blue-green-deployment, canary-deployment, standard-deployment]
    if: always() && (needs.blue-green-deployment.result == 'success' || needs.canary-deployment.result == 'success' || needs.standard-deployment.result == 'success')
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Collect Deployment Metrics
        run: |
          echo "📊 Collecting deployment metrics..."
          
          # Collect performance metrics
          # Monitor error rates
          # Track deployment success/failure patterns
          # Store data for machine learning
          
          echo "✅ Metrics collection completed"

      - name: Update Predictive Models
        run: |
          echo "🧠 Updating predictive models with new data..."
          
          # Update machine learning models with deployment outcomes
          # Improve risk scoring algorithms
          # Enhance change impact prediction
          
          echo "✅ Predictive models updated"

  # Phase 4I: Notification and Reporting
  notification:
    name: 📢 Notification & Reporting
    runs-on: ubuntu-latest
    needs: [predictive-analysis, intelligent-change-detection, self-healing-tests, intelligent-build, blue-green-deployment, canary-deployment, standard-deployment]
    if: always()
    
    steps:
      - name: Generate Pipeline Report
        run: |
          echo "📋 Generating comprehensive pipeline report..."
          
          # Compile all job results
          PREDICTIVE_RISK="${{ needs.predictive-analysis.outputs.risk_score || 'N/A' }}"
          CHANGE_IMPACT="${{ needs.intelligent-change-detection.outputs.change_impact || 'N/A' }}"
          DEPLOYMENT_STRATEGY="${{ needs.intelligent-change-detection.outputs.deployment_strategy || 'N/A' }}"
          BUILD_STATUS="${{ needs.intelligent-build.outputs.build_status || 'N/A' }}"
          
          # Determine overall status
          if [ "$BUILD_STATUS" = "success" ]; then
            OVERALL_STATUS="✅ SUCCESS"
            COLOR="good"
          else
            OVERALL_STATUS="❌ FAILED"
            COLOR="danger"
          fi
          
          REPORT=$(cat << EOF
          🎯 **Phase 4 Unified Pipeline Report**
          
          **Overall Status:** $OVERALL_STATUS
          **Risk Score:** $PREDICTIVE_RISK/100
          **Change Impact:** $CHANGE_IMPACT
          **Deployment Strategy:** $DEPLOYMENT_STRATEGY
          **Build Status:** $BUILD_STATUS
          
          **Phase 4 Features Used:**
          🔮 Predictive Analysis: ${{ env.PREDICTIVE_ANALYSIS_ENABLED }}
          🧠 Intelligent Change Detection: ✅
          🧪 Self-Healing Tests: ✅
          🏗️ Intelligent Build: ✅
          🔵 Blue-Green Deployment: ${{ env.BLUE_GREEN_ENABLED }}
          
          **Pipeline ID:** ${{ github.run_id }}
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref_name }}
          EOF
          )
          
          echo "$REPORT"
          
          # Send notification
          curl -X POST \
            -H "Content-Type: application/json" \
            -d "{
              \"text\": \"$REPORT\",
              \"color\": \"$COLOR\"
            }" \
            "${{ secrets.SLACK_WEBHOOK_URL }}" || echo "Notification failed"

