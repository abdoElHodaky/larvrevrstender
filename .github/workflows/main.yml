name: Main CI/CD Pipeline
# Enterprise microservices pipeline with template integration
# Features: Service orchestration, dependency management, template integration

on:
  push:
    branches: [ main, develop, staging, v2 ]
  pull_request:
    branches: [ main, develop, v2 ]
  workflow_dispatch:
    inputs:
      force_full_pipeline:
        description: 'Force full pipeline execution (ignore change detection)'
        required: false
        default: false
        type: boolean
      deployment_strategy:
        description: 'Deployment strategy override'
        required: false
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'standard'
          - 'canary'
          - 'blue-green'
      target_environment:
        description: 'Target deployment environment'
        required: false
        default: 'staging'
        type: choice
        options:
          - 'staging'
          - 'production'
      enable_self_healing:
        description: 'Enable self-healing capabilities'
        required: false
        default: true
        type: boolean

env:
  NODE_VERSION: '18'
  PHP_VERSION: '8.2'
  POSTGRESQL_VERSION: '15'
  REDIS_VERSION: '7.0'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/larvrevrstender
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  # Enterprise features
  PREDICTIVE_ANALYSIS_ENABLED: true
  BLUE_GREEN_ENABLED: true
  SELF_HEALING_ENABLED: ${{ inputs.enable_self_healing || 'true' }}

permissions:
  contents: read
  packages: write
  security-events: write
  actions: read

jobs:
  # Phase 1: Intelligent Change Detection & Analysis
  change-detection:
    name: 🔍 Change Detection & Risk Analysis
    runs-on: ubuntu-latest
    outputs:
      affected_services: ${{ steps.analyze.outputs.affected_services }}
      change_impact: ${{ steps.analyze.outputs.change_impact }}
      deployment_strategy: ${{ steps.analyze.outputs.deployment_strategy }}
      should_deploy: ${{ steps.analyze.outputs.should_deploy }}
      risk_score: ${{ steps.analyze.outputs.risk_score }}
      services_matrix: ${{ steps.analyze.outputs.services_matrix }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Intelligent Change Analysis
        id: analyze
        run: |
          echo "🔍 Analyzing changes and calculating risk..."
          
          # Get changed files
          if [ "${{ github.event_name }}" = "push" ]; then
            CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }})
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          fi
          
          echo "Changed files:"
          echo "$CHANGED_FILES"
          
          # Initialize variables
          AFFECTED_SERVICES=""
          CHANGE_IMPACT="low"
          DEPLOYMENT_STRATEGY="standard"
          RISK_SCORE=10
          
          # Define service dependencies
          declare -A SERVICE_DEPS
          SERVICE_DEPS[shared]=""
          SERVICE_DEPS[auth]="shared"
          SERVICE_DEPS[user]="shared,auth"
          SERVICE_DEPS[auction]="shared,auth,user"
          SERVICE_DEPS[bidding]="shared,auth,user,auction"
          SERVICE_DEPS[payment]="shared,auth,user"
          SERVICE_DEPS[order]="shared,auth,user,payment"
          SERVICE_DEPS[notification]="shared,auth,user"
          SERVICE_DEPS[analytics]="shared,auth,user"
          SERVICE_DEPS[vin-ocr]="shared,auth"
          SERVICE_DEPS[gateway]="shared,auth,user,auction,bidding,payment,order,notification,analytics,vin-ocr"
          
          # Analyze service-specific changes
          SERVICES_ARRAY=()
          for service in shared auth user auction bidding payment order notification analytics vin-ocr gateway; do
            if echo "$CHANGED_FILES" | grep -q "services/${service}/\|services/${service}-service/"; then
              AFFECTED_SERVICES="${AFFECTED_SERVICES}${service},"
              SERVICES_ARRAY+=("\"$service\"")
              CHANGE_IMPACT="medium"
              RISK_SCORE=$((RISK_SCORE + 15))
              
              # If shared service is affected, all services are potentially affected
              if [ "$service" = "shared" ]; then
                CHANGE_IMPACT="high"
                DEPLOYMENT_STRATEGY="blue-green"
                RISK_SCORE=$((RISK_SCORE + 30))
                SERVICES_ARRAY=("\"shared\"" "\"auth\"" "\"user\"" "\"auction\"" "\"bidding\"" "\"payment\"" "\"order\"" "\"notification\"" "\"analytics\"" "\"vin-ocr\"" "\"gateway\"")
                AFFECTED_SERVICES="shared,auth,user,auction,bidding,payment,order,notification,analytics,vin-ocr,gateway"
                break
              fi
            fi
          done
          
          # Check for high-impact changes
          if echo "$CHANGED_FILES" | grep -q "database/migrations/\|migration/scripts/"; then
            CHANGE_IMPACT="high"
            DEPLOYMENT_STRATEGY="blue-green"
            RISK_SCORE=$((RISK_SCORE + 25))
          fi
          
          # Check for infrastructure changes
          if echo "$CHANGED_FILES" | grep -q "deployment/\|docker/\|.github/workflows/\|docker-compose"; then
            CHANGE_IMPACT="high"
            DEPLOYMENT_STRATEGY="blue-green"
            RISK_SCORE=$((RISK_SCORE + 20))
          fi
          
          # Override with manual input if provided
          if [ "${{ inputs.deployment_strategy }}" != "auto" ]; then
            DEPLOYMENT_STRATEGY="${{ inputs.deployment_strategy }}"
          fi
          
          # Determine if deployment is needed
          SHOULD_DEPLOY="false"
          if [ "$CHANGE_IMPACT" != "low" ] || [ "${{ inputs.force_full_pipeline }}" = "true" ]; then
            SHOULD_DEPLOY="true"
          fi
          
          # Create services matrix JSON
          if [ ${#SERVICES_ARRAY[@]} -eq 0 ]; then
            SERVICES_MATRIX='{"service": []}'
          else
            SERVICES_JSON=$(IFS=,; echo "${SERVICES_ARRAY[*]}")
            SERVICES_MATRIX="{\"service\": [$SERVICES_JSON]}"
          fi
          
          # Output results
          echo "affected_services=${AFFECTED_SERVICES%,}" >> $GITHUB_OUTPUT
          echo "change_impact=$CHANGE_IMPACT" >> $GITHUB_OUTPUT
          echo "deployment_strategy=$DEPLOYMENT_STRATEGY" >> $GITHUB_OUTPUT
          echo "should_deploy=$SHOULD_DEPLOY" >> $GITHUB_OUTPUT
          echo "risk_score=$RISK_SCORE" >> $GITHUB_OUTPUT
          echo "services_matrix=$SERVICES_MATRIX" >> $GITHUB_OUTPUT
          
          echo "📊 Analysis Results:"
          echo "  Affected Services: ${AFFECTED_SERVICES%,}"
          echo "  Change Impact: $CHANGE_IMPACT"
          echo "  Deployment Strategy: $DEPLOYMENT_STRATEGY"
          echo "  Should Deploy: $SHOULD_DEPLOY"
          echo "  Risk Score: $RISK_SCORE/100"
          echo "  Services Matrix: $SERVICES_MATRIX"

  # Phase 2: Service Dependency & Environment Validation
  dependency-environment-validation:
    name: 🔗 Service Dependencies & Environment Config
    needs: [change-detection]
    if: needs.change-detection.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    outputs:
      deployment_order: ${{ steps.dependency-analysis.outputs.deployment_order }}
      environment_config: ${{ steps.env-validation.outputs.config_status }}
      health_check_urls: ${{ steps.health-checks.outputs.urls }}
      dependency_graph: ${{ steps.dependency-analysis.outputs.dependency_graph }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Advanced Service Dependency Analysis
        id: dependency-analysis
        run: |
          echo "🔍 Analyzing service dependencies and deployment order..."
          
          # Define comprehensive service dependency graph
          declare -A SERVICE_DEPS
          declare -A SERVICE_HEALTH_ENDPOINTS
          declare -A SERVICE_STARTUP_TIME
          declare -A SERVICE_CRITICALITY
          
          # Service dependencies (what each service depends on)
          SERVICE_DEPS[shared]=""
          SERVICE_DEPS[auth]="shared"
          SERVICE_DEPS[user]="shared,auth"
          SERVICE_DEPS[auction]="shared,auth,user"
          SERVICE_DEPS[bidding]="shared,auth,user,auction"
          SERVICE_DEPS[payment]="shared,auth,user"
          SERVICE_DEPS[order]="shared,auth,user,payment"
          SERVICE_DEPS[notification]="shared,auth,user"
          SERVICE_DEPS[analytics]="shared,auth,user"
          SERVICE_DEPS[vin-ocr]="shared,auth"
          SERVICE_DEPS[gateway]="shared,auth,user,auction,bidding,payment,order,notification,analytics,vin-ocr"
          
          # Health check endpoints for each service
          SERVICE_HEALTH_ENDPOINTS[shared]="/health"
          SERVICE_HEALTH_ENDPOINTS[auth]="/api/auth/health"
          SERVICE_HEALTH_ENDPOINTS[user]="/api/users/health"
          SERVICE_HEALTH_ENDPOINTS[auction]="/api/auctions/health"
          SERVICE_HEALTH_ENDPOINTS[bidding]="/api/bids/health"
          SERVICE_HEALTH_ENDPOINTS[payment]="/api/payments/health"
          SERVICE_HEALTH_ENDPOINTS[order]="/api/orders/health"
          SERVICE_HEALTH_ENDPOINTS[notification]="/api/notifications/health"
          SERVICE_HEALTH_ENDPOINTS[analytics]="/api/analytics/health"
          SERVICE_HEALTH_ENDPOINTS[vin-ocr]="/api/ocr/health"
          SERVICE_HEALTH_ENDPOINTS[gateway]="/api/gateway/health"
          
          # Estimated startup times (seconds)
          SERVICE_STARTUP_TIME[shared]=30
          SERVICE_STARTUP_TIME[auth]=45
          SERVICE_STARTUP_TIME[user]=40
          SERVICE_STARTUP_TIME[auction]=60
          SERVICE_STARTUP_TIME[bidding]=50
          SERVICE_STARTUP_TIME[payment]=55
          SERVICE_STARTUP_TIME[order]=45
          SERVICE_STARTUP_TIME[notification]=40
          SERVICE_STARTUP_TIME[analytics]=50
          SERVICE_STARTUP_TIME[vin-ocr]=70
          SERVICE_STARTUP_TIME[gateway]=35
          
          # Service criticality (1=low, 5=critical)
          SERVICE_CRITICALITY[shared]=5
          SERVICE_CRITICALITY[auth]=5
          SERVICE_CRITICALITY[user]=4
          SERVICE_CRITICALITY[auction]=5
          SERVICE_CRITICALITY[bidding]=4
          SERVICE_CRITICALITY[payment]=5
          SERVICE_CRITICALITY[order]=4
          SERVICE_CRITICALITY[notification]=3
          SERVICE_CRITICALITY[analytics]=2
          SERVICE_CRITICALITY[vin-ocr]=3
          SERVICE_CRITICALITY[gateway]=5
          
          # Calculate deployment order based on dependencies
          DEPLOYMENT_ORDER=()
          
          # Level 0: No dependencies
          for service in shared; do
            DEPLOYMENT_ORDER+=("$service")
          done
          
          # Level 1: Depends only on shared
          for service in auth; do
            DEPLOYMENT_ORDER+=("$service")
          done
          
          # Level 2: Depends on shared + auth
          for service in user; do
            DEPLOYMENT_ORDER+=("$service")
          done
          
          # Level 3: Depends on shared + auth + user
          for service in auction payment notification analytics vin-ocr; do
            DEPLOYMENT_ORDER+=("$service")
          done
          
          # Level 4: Depends on multiple services
          for service in bidding order; do
            DEPLOYMENT_ORDER+=("$service")
          done
          
          # Level 5: Gateway (depends on everything)
          for service in gateway; do
            DEPLOYMENT_ORDER+=("$service")
          done
          
          # Create deployment order JSON
          DEPLOYMENT_ORDER_JSON=$(printf '%s\n' "${DEPLOYMENT_ORDER[@]}" | jq -R . | jq -s .)
          
          # Create dependency graph JSON
          DEPENDENCY_GRAPH="{"
          for service in "${DEPLOYMENT_ORDER[@]}"; do
            deps="${SERVICE_DEPS[$service]}"
            health="${SERVICE_HEALTH_ENDPOINTS[$service]}"
            startup="${SERVICE_STARTUP_TIME[$service]}"
            criticality="${SERVICE_CRITICALITY[$service]}"
            
            DEPENDENCY_GRAPH="$DEPENDENCY_GRAPH\"$service\":{\"dependencies\":\"$deps\",\"health_endpoint\":\"$health\",\"startup_time\":$startup,\"criticality\":$criticality},"
          done
          DEPENDENCY_GRAPH="${DEPENDENCY_GRAPH%,}}"
          
          # Output results
          echo "deployment_order=$DEPLOYMENT_ORDER_JSON" >> $GITHUB_OUTPUT
          echo "dependency_graph=$DEPENDENCY_GRAPH" >> $GITHUB_OUTPUT
          
          echo "📊 Service Deployment Order:"
          printf '%s\n' "${DEPLOYMENT_ORDER[@]}" | nl
          
          echo "🔗 Dependency Graph Created:"
          echo "$DEPENDENCY_GRAPH" | jq .

      - name: Environment Configuration Validation
        id: env-validation
        run: |
          echo "⚙️ Validating environment configurations..."
          
          TARGET_ENV="${{ inputs.target_environment || 'staging' }}"
          
          # Define environment-specific configurations
          declare -A ENV_CONFIGS
          declare -A ENV_SECRETS
          declare -A ENV_DATABASES
          declare -A ENV_REDIS
          declare -A ENV_DOMAINS
          
          # Staging environment configuration
          ENV_CONFIGS[staging_db_host]="staging-postgres.larvrevrstender.com"
          ENV_CONFIGS[staging_redis_host]="staging-redis.larvrevrstender.com"
          ENV_CONFIGS[staging_domain]="staging.larvrevrstender.com"
          ENV_CONFIGS[staging_replicas]=2
          ENV_CONFIGS[staging_resources_cpu]="500m"
          ENV_CONFIGS[staging_resources_memory]="1Gi"
          
          # Production environment configuration
          ENV_CONFIGS[production_db_host]="prod-postgres.larvrevrstender.com"
          ENV_CONFIGS[production_redis_host]="prod-redis.larvrevrstender.com"
          ENV_CONFIGS[production_domain]="larvrevrstender.com"
          ENV_CONFIGS[production_replicas]=5
          ENV_CONFIGS[production_resources_cpu]="1000m"
          ENV_CONFIGS[production_resources_memory]="2Gi"
          
          # Required secrets per environment
          ENV_SECRETS[staging]="STAGING_DB_PASSWORD,STAGING_REDIS_PASSWORD,STAGING_JWT_SECRET,STAGING_APP_KEY"
          ENV_SECRETS[production]="PROD_DB_PASSWORD,PROD_REDIS_PASSWORD,PROD_JWT_SECRET,PROD_APP_KEY,PROD_PAYMENT_API_KEY"
          
          # Validate environment configuration
          CONFIG_STATUS="valid"
          MISSING_CONFIGS=()
          
          # Check required configurations exist
          REQUIRED_CONFIGS=(
            "${TARGET_ENV}_db_host"
            "${TARGET_ENV}_redis_host"
            "${TARGET_ENV}_domain"
            "${TARGET_ENV}_replicas"
            "${TARGET_ENV}_resources_cpu"
            "${TARGET_ENV}_resources_memory"
          )
          
          for config in "${REQUIRED_CONFIGS[@]}"; do
            if [ -z "${ENV_CONFIGS[$config]}" ]; then
              MISSING_CONFIGS+=("$config")
              CONFIG_STATUS="invalid"
            else
              echo "✅ $config: ${ENV_CONFIGS[$config]}"
            fi
          done
          
          # Validate docker-compose files exist for environment
          COMPOSE_FILES=(
            "docker-compose.yml"
            "docker-compose.${TARGET_ENV}.yml"
          )
          
          for compose_file in "${COMPOSE_FILES[@]}"; do
            if [ -f "$compose_file" ]; then
              echo "✅ Found: $compose_file"
            else
              echo "⚠️ Missing: $compose_file"
              if [ "$compose_file" = "docker-compose.${TARGET_ENV}.yml" ]; then
                echo "ℹ️ Using base docker-compose.yml for $TARGET_ENV"
              fi
            fi
          done
          
          # Create environment configuration JSON
          ENV_CONFIG_JSON="{"
          ENV_CONFIG_JSON="$ENV_CONFIG_JSON\"environment\":\"$TARGET_ENV\","
          ENV_CONFIG_JSON="$ENV_CONFIG_JSON\"db_host\":\"${ENV_CONFIGS[${TARGET_ENV}_db_host]}\","
          ENV_CONFIG_JSON="$ENV_CONFIG_JSON\"redis_host\":\"${ENV_CONFIGS[${TARGET_ENV}_redis_host]}\","
          ENV_CONFIG_JSON="$ENV_CONFIG_JSON\"domain\":\"${ENV_CONFIGS[${TARGET_ENV}_domain]}\","
          ENV_CONFIG_JSON="$ENV_CONFIG_JSON\"replicas\":${ENV_CONFIGS[${TARGET_ENV}_replicas]},"
          ENV_CONFIG_JSON="$ENV_CONFIG_JSON\"resources\":{\"cpu\":\"${ENV_CONFIGS[${TARGET_ENV}_resources_cpu]}\",\"memory\":\"${ENV_CONFIGS[${TARGET_ENV}_resources_memory]}\"},"
          ENV_CONFIG_JSON="$ENV_CONFIG_JSON\"status\":\"$CONFIG_STATUS\""
          ENV_CONFIG_JSON="$ENV_CONFIG_JSON}"
          
          # Output results
          echo "config_status=$CONFIG_STATUS" >> $GITHUB_OUTPUT
          echo "environment_config=$ENV_CONFIG_JSON" >> $GITHUB_OUTPUT
          
          if [ "$CONFIG_STATUS" = "invalid" ]; then
            echo "❌ Environment configuration validation failed"
            echo "Missing configurations: ${MISSING_CONFIGS[*]}"
            exit 1
          else
            echo "✅ Environment configuration validation passed"
          fi

      - name: Generate Health Check URLs
        id: health-checks
        run: |
          echo "🏥 Generating health check URLs for services..."
          
          TARGET_ENV="${{ inputs.target_environment || 'staging' }}"
          DOMAIN=$(echo '${{ steps.env-validation.outputs.environment_config }}' | jq -r '.domain')
          
          # Parse affected services
          IFS=',' read -ra SERVICES <<< "${{ needs.change-detection.outputs.affected_services }}"
          
          HEALTH_URLS="{"
          for service in "${SERVICES[@]}"; do
            service=$(echo "$service" | xargs)  # trim whitespace
            if [ -n "$service" ]; then
              # Get health endpoint from dependency graph
              HEALTH_ENDPOINT=$(echo '${{ steps.dependency-analysis.outputs.dependency_graph }}' | jq -r ".\"$service\".health_endpoint // \"/health\"")
              HEALTH_URL="https://${service}-${TARGET_ENV}.${DOMAIN}${HEALTH_ENDPOINT}"
              HEALTH_URLS="$HEALTH_URLS\"$service\":\"$HEALTH_URL\","
            fi
          done
          HEALTH_URLS="${HEALTH_URLS%,}}"
          
          echo "urls=$HEALTH_URLS" >> $GITHUB_OUTPUT
          
          echo "🏥 Health Check URLs Generated:"
          echo "$HEALTH_URLS" | jq .

      - name: Service Dependency Summary
        run: |
          echo "## 🔗 Service Dependencies & Environment Configuration" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Target Environment:** ${{ inputs.target_environment || 'staging' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Configuration Status:** ${{ steps.env-validation.outputs.config_status == 'valid' && '✅ Valid' || '❌ Invalid' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Deployment Order" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Parse deployment order and create table
          DEPLOYMENT_ORDER='${{ steps.dependency-analysis.outputs.deployment_order }}'
          echo "| Order | Service | Dependencies | Criticality |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|---------|--------------|-------------|" >> $GITHUB_STEP_SUMMARY
          
          ORDER=1
          echo "$DEPLOYMENT_ORDER" | jq -r '.[]' | while read service; do
            DEPS=$(echo '${{ steps.dependency-analysis.outputs.dependency_graph }}' | jq -r ".\"$service\".dependencies // \"none\"")
            CRIT=$(echo '${{ steps.dependency-analysis.outputs.dependency_graph }}' | jq -r ".\"$service\".criticality")
            echo "| $ORDER | $service | $DEPS | $CRIT/5 |" >> $GITHUB_STEP_SUMMARY
            ORDER=$((ORDER + 1))
          done

  # Phase 3: Security Scanning (Template Integration)
  security-scan:
    name: 🔒 Security Scanning
    needs: [change-detection, dependency-environment-validation]
    if: needs.change-detection.outputs.should_deploy == 'true'
    uses: ./.github/workflows/templates/security.yml
    with:
      services: ${{ needs.change-detection.outputs.affected_services }}
      risk_score: ${{ needs.change-detection.outputs.risk_score }}
    secrets: inherit

  # Phase 4: Service Build Matrix (Dependency-Ordered Orchestration)
  service-build:
    name: 🏗️ Service Build (Dependency-Ordered)
    needs: [change-detection, dependency-environment-validation, security-scan]
    if: needs.change-detection.outputs.should_deploy == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.change-detection.outputs.services_matrix) }}
    uses: ./.github/workflows/templates/build.yml
    with:
      service_name: ${{ matrix.service }}
      php_version: ${{ env.PHP_VERSION }}
      environment: ${{ inputs.target_environment || 'staging' }}
      registry: ${{ env.REGISTRY }}
      image_name: ${{ env.IMAGE_NAME }}
      dependency_graph: ${{ needs.dependency-environment-validation.outputs.dependency_graph }}
      deployment_order: ${{ needs.dependency-environment-validation.outputs.deployment_order }}
    secrets: inherit

  # Phase 5: Database Migration Integration
  database-migration:
    name: 🗄️ Database Migration
    needs: [change-detection, dependency-environment-validation]
    if: |
      needs.change-detection.outputs.should_deploy == 'true' && 
      (contains(needs.change-detection.outputs.affected_services, 'shared') || 
       needs.change-detection.outputs.change_impact == 'high')
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: larvrevrstender_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, dom, filter, gd, redis

      - name: Validate Migration Scripts
        run: |
          echo "🔍 Validating migration infrastructure..."
          
          # Check migration scripts exist
          if [ ! -d "migration/scripts" ]; then
            echo "❌ Migration scripts directory not found"
            exit 1
          fi
          
          # Validate migration orchestrator
          if [ -f "migration/scripts/migration-orchestrator.php" ]; then
            echo "✅ Migration orchestrator found"
            php -l migration/scripts/migration-orchestrator.php
          fi
          
          # Validate migration config
          if [ -f "migration/config/migration-config.php" ]; then
            echo "✅ Migration config found"
            php -l migration/config/migration-config.php
          fi
          
          # Run migration validation
          if [ -f "migration/scripts/validate-migration.php" ]; then
            echo "🧪 Running migration validation..."
            cd migration/scripts
            php validate-migration.php --dry-run
          fi

      - name: Execute Migration (Staging)
        if: inputs.target_environment != 'production'
        run: |
          echo "🚀 Executing staging migration..."
          cd migration/scripts
          
          # Run comprehensive validation first
          if [ -f "comprehensive-validation.php" ]; then
            php comprehensive-validation.php
          fi
          
          # Execute migration phases
          for phase in {2..8}; do
            if [ -f "phase${phase}-execution.php" ]; then
              echo "📋 Executing Phase $phase..."
              php "phase${phase}-execution.php" --environment=staging
            fi
          done

  # Phase 6: Comprehensive Testing (Template Integration)
  comprehensive-testing:
    name: 🧪 Comprehensive Testing
    needs: [change-detection, dependency-environment-validation, service-build, database-migration]
    if: |
      always() && 
      needs.change-detection.outputs.should_deploy == 'true' &&
      (needs.service-build.result == 'success' || needs.service-build.result == 'skipped') &&
      (needs.database-migration.result == 'success' || needs.database-migration.result == 'skipped')
    uses: ./.github/workflows/templates/test.yml
    with:
      services: ${{ needs.change-detection.outputs.affected_services }}
      test_strategy: ${{ needs.change-detection.outputs.change_impact == 'high' && 'comprehensive' || 'targeted' }}
      environment: ${{ inputs.target_environment || 'staging' }}
    secrets: inherit

  # Phase 7: Self-Healing & Optimization (Template Integration)
  self-healing:
    name: 🔧 Self-Healing & Optimization
    needs: [change-detection, dependency-environment-validation, comprehensive-testing]
    if: |
      always() && 
      needs.change-detection.outputs.should_deploy == 'true' &&
      needs.comprehensive-testing.result == 'success' &&
      env.SELF_HEALING_ENABLED == 'true'
    uses: ./.github/workflows/templates/healing.yml
    with:
      risk_score: ${{ needs.change-detection.outputs.risk_score }}
      affected_services: ${{ needs.change-detection.outputs.affected_services }}
      enable_predictive_recovery: true
    secrets: inherit

  # Phase 8: Blue-Green Deployment (Dependency-Ordered)
  deployment:
    name: 🚀 Blue-Green Deployment (Dependency-Ordered)
    needs: [change-detection, dependency-environment-validation, service-build, comprehensive-testing, self-healing]
    if: |
      always() && 
      needs.change-detection.outputs.should_deploy == 'true' &&
      needs.service-build.result == 'success' &&
      needs.comprehensive-testing.result == 'success' &&
      (needs.self-healing.result == 'success' || needs.self-healing.result == 'skipped')
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.change-detection.outputs.services_matrix) }}
    uses: ./.github/workflows/templates/deploy.yml
    with:
      service_name: ${{ matrix.service }}
      environment: ${{ inputs.target_environment || 'staging' }}
      image_tag: ${{ github.sha }}
      health_check_url: ${{ fromJson(needs.dependency-environment-validation.outputs.health_check_urls)[matrix.service] || format('https://{0}-{1}.larvrevrstender.com/health', matrix.service, inputs.target_environment || 'staging') }}
      deployment_strategy: ${{ needs.change-detection.outputs.deployment_strategy }}
      rollback_on_failure: true
      dependency_graph: ${{ needs.dependency-environment-validation.outputs.dependency_graph }}
      deployment_order: ${{ needs.dependency-environment-validation.outputs.deployment_order }}
      environment_config: ${{ needs.dependency-environment-validation.outputs.environment_config }}
    secrets: inherit

  # Phase 9: Risk Scoring Optimization (Template Integration)
  optimization:
    name: 📊 Risk Scoring Optimization
    needs: [change-detection, dependency-environment-validation, deployment]
    if: |
      always() && 
      needs.deployment.result == 'success' &&
      needs.change-detection.outputs.change_impact == 'high'
    uses: ./.github/workflows/templates/optimize.yml
    with:
      deployment_success: true
      risk_score: ${{ needs.change-detection.outputs.risk_score }}
      services: ${{ needs.change-detection.outputs.affected_services }}
    secrets: inherit

  # Phase 10: Final Reporting & Notifications
  pipeline-summary:
    name: 📋 Pipeline Summary
    runs-on: ubuntu-latest
    needs: [change-detection, dependency-environment-validation, security-scan, service-build, database-migration, comprehensive-testing, self-healing, deployment, optimization]
    if: always()
    
    steps:
      - name: Generate Pipeline Report
        run: |
          echo "📊 Generating comprehensive pipeline report..."
          
          # Determine overall status
          OVERALL_STATUS="success"
          if [ "${{ needs.security-scan.result }}" = "failure" ] || 
             [ "${{ needs.service-build.result }}" = "failure" ] || 
             [ "${{ needs.comprehensive-testing.result }}" = "failure" ] || 
             [ "${{ needs.deployment.result }}" = "failure" ]; then
            OVERALL_STATUS="failure"
          fi
          
          # Generate report
          REPORT=$(cat << EOF
          ## 🚀 **ENTERPRISE CI/CD PIPELINE REPORT**
          
          **Pipeline ID:** ${{ github.run_id }}
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref_name }}
          **Environment:** ${{ inputs.target_environment || 'staging' }}
          
          ### 📊 **EXECUTION SUMMARY**
          
          **Overall Status:** $([ "$OVERALL_STATUS" = "success" ] && echo "✅ SUCCESS" || echo "❌ FAILURE")
          **Risk Score:** ${{ needs.change-detection.outputs.risk_score }}/100
          **Change Impact:** ${{ needs.change-detection.outputs.change_impact }}
          **Deployment Strategy:** ${{ needs.change-detection.outputs.deployment_strategy }}
          **Affected Services:** ${{ needs.change-detection.outputs.affected_services }}
          
          ### 🔄 **PHASE RESULTS**
          
          - 🔍 **Change Detection:** ✅ Completed
          - 🔒 **Security Scanning:** ${{ needs.security-scan.result == 'success' && '✅' || needs.security-scan.result == 'failure' && '❌' || '⏭️' }} ${{ needs.security-scan.result }}
          - 🏗️ **Service Build:** ${{ needs.service-build.result == 'success' && '✅' || needs.service-build.result == 'failure' && '❌' || '⏭️' }} ${{ needs.service-build.result }}
          - 🗄️ **Database Migration:** ${{ needs.database-migration.result == 'success' && '✅' || needs.database-migration.result == 'failure' && '❌' || '⏭️' }} ${{ needs.database-migration.result }}
          - 🧪 **Comprehensive Testing:** ${{ needs.comprehensive-testing.result == 'success' && '✅' || needs.comprehensive-testing.result == 'failure' && '❌' || '⏭️' }} ${{ needs.comprehensive-testing.result }}
          - 🔧 **Self-Healing:** ${{ needs.self-healing.result == 'success' && '✅' || needs.self-healing.result == 'failure' && '❌' || '⏭️' }} ${{ needs.self-healing.result }}
          - 🚀 **Deployment:** ${{ needs.deployment.result == 'success' && '✅' || needs.deployment.result == 'failure' && '❌' || '⏭️' }} ${{ needs.deployment.result }}
          - 📊 **Optimization:** ${{ needs.optimization.result == 'success' && '✅' || needs.optimization.result == 'failure' && '❌' || '⏭️' }} ${{ needs.optimization.result }}
          
          ### 🎯 **ENTERPRISE FEATURES ACTIVATED**
          
          - ✅ **Template Integration:** All templates properly integrated
          - ✅ **Service Orchestration:** 11 microservices with dependency management
          - ✅ **Environment Configuration:** Multi-environment support
          - ✅ **Database Migration:** Automated migration pipeline
          - ✅ **Security Scanning:** Comprehensive security validation
          - ✅ **Self-Healing:** Intelligent recovery mechanisms
          - ✅ **Blue-Green Deployment:** Zero-downtime deployments
          
          **🚀 Enterprise CI/CD Pipeline - Production Ready!**
          EOF
          )
          
          echo "$REPORT"
          
          # Send notification (if webhook configured)
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -X POST \
              -H "Content-Type: application/json" \
              -d "{
                \"text\": \"$REPORT\",
                \"color\": \"$([ "$OVERALL_STATUS" = "success" ] && echo "good" || echo "danger")\"
              }" \
              "${{ secrets.SLACK_WEBHOOK_URL }}" || echo "Notification failed"
          fi
