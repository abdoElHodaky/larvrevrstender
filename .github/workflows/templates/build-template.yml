name: Reusable Service Build Template
# Reusable workflow template for building Docker images for Laravel microservices
# Features: BuildKit optimization, multi-stage builds, caching strategies

on:
  workflow_call:
    inputs:
      service_name:
        description: 'Name of the service to build'
        required: true
        type: string
      dockerfile_path:
        description: 'Path to Dockerfile'
        required: false
        type: string
        default: 'deployment/docker/Dockerfile.rpc'
      build_context:
        description: 'Build context directory'
        required: false
        type: string
        default: '.'
      registry:
        description: 'Container registry'
        required: false
        type: string
        default: 'ghcr.io'
      image_name:
        description: 'Base image name'
        required: true
        type: string
      push_image:
        description: 'Push image to registry'
        required: false
        type: boolean
        default: true
      platforms:
        description: 'Target platforms'
        required: false
        type: string
        default: 'linux/amd64'
    secrets:
      registry_username:
        description: 'Registry username'
        required: false
      registry_password:
        description: 'Registry password'
        required: false
    outputs:
      image_tag:
        description: 'Built image tag'
        value: ${{ jobs.build.outputs.tag }}
      image_digest:
        description: 'Image digest'
        value: ${{ jobs.build.outputs.digest }}

env:
  DOCKER_BUILDKIT: 1
  BUILDX_NO_DEFAULT_ATTESTATIONS: 1

jobs:
  build:
    name: Build ${{ inputs.service_name }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Check if service exists
      id: check-service
      run: |
        SERVICE_PATH="services/${{ inputs.service_name }}"
        if [ -d "$SERVICE_PATH" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "path=$SERVICE_PATH" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "⚠️ Service ${{ inputs.service_name }} not found at $SERVICE_PATH"
        fi
        
    - name: Check if Dockerfile exists
      id: check-dockerfile
      if: steps.check-service.outputs.exists == 'true'
      run: |
        if [ -f "${{ inputs.dockerfile_path }}" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "⚠️ Dockerfile not found at ${{ inputs.dockerfile_path }}"
        fi
      
    - name: Set up Docker Buildx
      if: steps.check-service.outputs.exists == 'true' && steps.check-dockerfile.outputs.exists == 'true'
      uses: docker/setup-buildx-action@v3
      with:
        driver-opts: |
          network=host
          
    - name: Log in to Container Registry
      if: steps.check-service.outputs.exists == 'true' && steps.check-dockerfile.outputs.exists == 'true' && inputs.push_image
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ secrets.registry_username || github.actor }}
        password: ${{ secrets.registry_password || secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata
      if: steps.check-service.outputs.exists == 'true' && steps.check-dockerfile.outputs.exists == 'true'
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ inputs.registry }}/${{ inputs.image_name }}/${{ inputs.service_name }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
        labels: |
          org.opencontainers.image.title=${{ inputs.service_name }}
          org.opencontainers.image.description=Laravel microservice: ${{ inputs.service_name }}
          org.opencontainers.image.vendor=Reverse Tender Platform
          
    - name: Build and push Docker image
      if: steps.check-service.outputs.exists == 'true' && steps.check-dockerfile.outputs.exists == 'true'
      id: build
      uses: docker/build-push-action@v5
      with:
        context: ${{ inputs.build_context }}
        file: ${{ inputs.dockerfile_path }}
        platforms: ${{ inputs.platforms }}
        push: ${{ inputs.push_image }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          SERVICE_NAME=${{ inputs.service_name }}
          BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          VCS_REF=${{ github.sha }}
        cache-from: type=gha,scope=${{ inputs.service_name }}
        cache-to: type=gha,mode=max,scope=${{ inputs.service_name }}
        
    - name: Generate SBOM
      if: steps.check-service.outputs.exists == 'true' && steps.check-dockerfile.outputs.exists == 'true' && inputs.push_image
      uses: anchore/sbom-action@v0
      with:
        image: ${{ steps.meta.outputs.tags }}
        format: spdx-json
        output-file: sbom-${{ inputs.service_name }}.spdx.json
        
    - name: Upload SBOM
      if: steps.check-service.outputs.exists == 'true' && steps.check-dockerfile.outputs.exists == 'true' && inputs.push_image
      uses: actions/upload-artifact@v4
      with:
        name: sbom-${{ inputs.service_name }}
        path: sbom-${{ inputs.service_name }}.spdx.json
        retention-days: 30
        
    - name: Run Trivy vulnerability scanner
      if: steps.check-service.outputs.exists == 'true' && steps.check-dockerfile.outputs.exists == 'true'
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ steps.meta.outputs.tags }}
        format: 'sarif'
        output: 'trivy-results-${{ inputs.service_name }}.sarif'
        
    - name: Upload Trivy scan results
      if: steps.check-service.outputs.exists == 'true' && steps.check-dockerfile.outputs.exists == 'true'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results-${{ inputs.service_name }}.sarif'
        category: 'trivy-${{ inputs.service_name }}'
        
    - name: Image Summary
      if: steps.check-service.outputs.exists == 'true' && steps.check-dockerfile.outputs.exists == 'true'
      run: |
        echo "## 🐳 Docker Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "**Service:** ${{ inputs.service_name }}" >> $GITHUB_STEP_SUMMARY
        echo "**Image:** ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
        echo "**Digest:** ${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
        echo "**Platforms:** ${{ inputs.platforms }}" >> $GITHUB_STEP_SUMMARY
        echo "**Pushed:** ${{ inputs.push_image }}" >> $GITHUB_STEP_SUMMARY
