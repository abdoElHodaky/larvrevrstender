name: Consolidated CI/CD Pipeline with Blue-Green Deployment
# Enterprise-grade consolidated workflow combining all best practices
# Features: Smart change detection, blue-green deployment, comprehensive testing

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'services/**'
      - 'deployment/**'
      - '.github/workflows/consolidated-deployment.yml'
  pull_request:
    branches-ignore:
      - main
    paths:
      - 'services/**'
      - 'deployment/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/larvrevrstender
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  NODE_VERSION: '18'
  POSTGRESQL_VERSION: '15'
  REDIS_VERSION: '7.0'

permissions:
  contents: read
  packages: write
  security-events: write
  deployments: write

jobs:
  # ============================================================================
  # PHASE 1: CHANGE DETECTION & PLANNING
  # ============================================================================
  
  detect-changes:
    name: 🔍 Detect Changes & Plan Deployment
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.changes.outputs.services }}
      deployment: ${{ steps.changes.outputs.deployment }}
      workflows: ${{ steps.changes.outputs.workflows }}
      services_list: ${{ steps.services.outputs.list }}
      services_matrix: ${{ steps.services.outputs.matrix }}
      deploy_strategy: ${{ steps.strategy.outputs.strategy }}
      cloud_provider: ${{ steps.cloud.outputs.provider }}
      helm_values_file: ${{ steps.cloud.outputs.values_file }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Detect file changes
      id: changes
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
        else
          BASE_SHA="origin/main"
        fi
        
        echo "🔍 Comparing against base: $BASE_SHA"
        echo "📍 Current HEAD: $(git rev-parse HEAD)"
        
        # Detect changes in different areas
        if git diff --name-only $BASE_SHA HEAD | grep -q "^services/"; then
          echo "services=true" >> $GITHUB_OUTPUT
          echo "✅ Services changes detected"
        else
          echo "services=false" >> $GITHUB_OUTPUT
          echo "ℹ️ No services changes"
        fi
        
        if git diff --name-only $BASE_SHA HEAD | grep -q "^deployment/"; then
          echo "deployment=true" >> $GITHUB_OUTPUT
          echo "✅ Deployment changes detected"
        else
          echo "deployment=false" >> $GITHUB_OUTPUT
          echo "ℹ️ No deployment changes"
        fi
        
        if git diff --name-only $BASE_SHA HEAD | grep -q "^\.github/workflows/"; then
          echo "workflows=true" >> $GITHUB_OUTPUT
          echo "✅ Workflow changes detected"
        else
          echo "workflows=false" >> $GITHUB_OUTPUT
          echo "ℹ️ No workflow changes"
        fi

    - name: Determine changed services
      id: services
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
        else
          BASE_SHA="origin/main"
        fi
        
        # Get list of changed services
        CHANGED_SERVICES=$(git diff --name-only $BASE_SHA HEAD | grep "^services/" | cut -d'/' -f2 | sort -u | tr '\n' ',' | sed 's/,$//')
        
        echo "📋 Raw changed files in services:"
        git diff --name-only $BASE_SHA HEAD | grep "^services/" || echo "No service files changed"
        
        # Handle shared service changes
        if git diff --name-only $BASE_SHA HEAD | grep -q "^services/shared/"; then
          echo "🔄 Shared service changed, adding notification-service to build list"
          if [ -z "$CHANGED_SERVICES" ]; then
            CHANGED_SERVICES="notification-service"
          else
            CHANGED_SERVICES="$CHANGED_SERVICES,notification-service"
          fi
        fi
        
        # If no specific services changed, test all services
        if [ -z "$CHANGED_SERVICES" ]; then
          CHANGED_SERVICES="auth-service,user-service,analytics-service,order-service,payment-service,bidding-service,notification-service,vin-ocr-service,gateway-service,auction-service,shared"
          echo "🔄 No specific changes detected, testing all services"
        fi
        
        # Create JSON matrix for GitHub Actions
        SERVICES_ARRAY=$(echo "$CHANGED_SERVICES" | tr "," "\n" | jq -R . | jq -s . | jq -c .)
        
        echo "list=$CHANGED_SERVICES" >> $GITHUB_OUTPUT
        echo "matrix=$SERVICES_ARRAY" >> $GITHUB_OUTPUT
        echo "🎯 Services to process: $CHANGED_SERVICES"

    - name: Determine deployment strategy
      id: strategy
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "strategy=staging" >> $GITHUB_OUTPUT
          echo "🎯 PR detected: Using staging deployment"
        elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
          echo "strategy=staging" >> $GITHUB_OUTPUT
          echo "🎯 Develop branch: Using staging deployment"
        elif [ "${{ github.ref }}" = "refs/heads/v2" ]; then
          echo "strategy=blue-green" >> $GITHUB_OUTPUT
          echo "🎯 V2 branch: Using blue-green deployment"
        else
          echo "strategy=staging" >> $GITHUB_OUTPUT
          echo "🎯 Feature branch: Using staging deployment"
        fi

    - name: Detect cloud provider
      id: cloud
      run: |
        # Default to Azure if no specific provider is detected
        CLOUD_PROVIDER="azure"
        HELM_VALUES_FILE="values-azure.yaml"
        
        # Check for cloud provider hints in commit message or branch name
        COMMIT_MSG="${{ github.event.head_commit.message || github.event.pull_request.title }}"
        BRANCH_NAME="${{ github.ref_name }}"
        
        if echo "$COMMIT_MSG $BRANCH_NAME" | grep -qi "digitalocean\|do\|doks"; then
          CLOUD_PROVIDER="digitalocean"
          HELM_VALUES_FILE="values-digitalocean.yaml"
          echo "🌊 DigitalOcean deployment detected"
        elif echo "$COMMIT_MSG $BRANCH_NAME" | grep -qi "linode\|lke"; then
          CLOUD_PROVIDER="linode"
          HELM_VALUES_FILE="values-linode.yaml"
          echo "🔗 Linode deployment detected"
        elif echo "$COMMIT_MSG $BRANCH_NAME" | grep -qi "openstack\|heat"; then
          CLOUD_PROVIDER="openstack"
          HELM_VALUES_FILE="values-openstack.yaml"
          echo "☁️ OpenStack deployment detected"
        elif echo "$COMMIT_MSG $BRANCH_NAME" | grep -qi "azure\|aks"; then
          CLOUD_PROVIDER="azure"
          HELM_VALUES_FILE="values-azure.yaml"
          echo "🔷 Azure deployment detected"
        else
          echo "🔷 Default Azure deployment selected"
        fi
        
        # Check for environment variables that might indicate cloud provider
        if [ -n "${{ secrets.DO_TOKEN }}" ] && [ "$CLOUD_PROVIDER" = "azure" ]; then
          CLOUD_PROVIDER="digitalocean"
          HELM_VALUES_FILE="values-digitalocean.yaml"
          echo "🌊 DigitalOcean detected via secrets"
        elif [ -n "${{ secrets.LINODE_TOKEN }}" ] && [ "$CLOUD_PROVIDER" = "azure" ]; then
          CLOUD_PROVIDER="linode"
          HELM_VALUES_FILE="values-linode.yaml"
          echo "🔗 Linode detected via secrets"
        elif [ -n "${{ secrets.OS_AUTH_URL }}" ] && [ "$CLOUD_PROVIDER" = "azure" ]; then
          CLOUD_PROVIDER="openstack"
          HELM_VALUES_FILE="values-openstack.yaml"
          echo "☁️ OpenStack detected via secrets"
        fi
        
        echo "provider=$CLOUD_PROVIDER" >> $GITHUB_OUTPUT
        echo "values_file=$HELM_VALUES_FILE" >> $GITHUB_OUTPUT
        echo "🎯 Selected cloud provider: $CLOUD_PROVIDER"
        echo "📄 Helm values file: $HELM_VALUES_FILE"

  # ============================================================================
  # PHASE 2: CODE QUALITY & SECURITY
  # ============================================================================
  
  code-quality:
    name: 🔍 Code Quality & Security (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.services == 'true'
    strategy:
      matrix:
        php-version: ['8.2', '8.3']
      fail-fast: false
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup PHP ${{ matrix.php-version }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, dom, filter, gd, json, redis, curl
        tools: composer:v2, phpstan, phpcs
        coverage: xdebug
        
    - name: Cache Composer dependencies
      uses: actions/cache@v4
      with:
        path: ~/.composer/cache/files
        key: composer-php${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          composer-php${{ matrix.php-version }}-
          composer-
        
    - name: Install dependencies and run quality checks
      run: |
        echo "🔍 Running code quality checks for changed services..."
        SERVICES_LIST="${{ needs.detect-changes.outputs.services_list }}"
        IFS=',' read -ra SERVICES <<< "$SERVICES_LIST"
        
        TOTAL_SERVICES=0
        SUCCESSFUL_SERVICES=0
        
        for service in "${SERVICES[@]}"; do
          if [ -f "services/$service/composer.json" ] && [ -f "services/$service/artisan" ]; then
            echo "🔍 Processing service: $service"
            cd "services/$service"
            
            # Create required directories
            mkdir -p bootstrap/cache storage/logs
            chmod -R 755 bootstrap/cache storage
            
            # Install dependencies
            if COMPOSER_ALLOW_SUPERUSER=1 composer install --no-progress --prefer-dist --optimize-autoloader --no-scripts; then
              echo "✅ Dependencies installed for $service"
              
              # Run PHPStan if configuration exists
              if [ -f "phpstan.neon" ] || [ -f "phpstan.neon.dist" ]; then
                echo "🔍 Running PHPStan analysis for $service..."
                vendor/bin/phpstan analyse --no-progress --error-format=github || echo "⚠️ PHPStan issues found in $service"
              fi
              
              # Run PHPCS if configuration exists
              if [ -f "phpcs.xml" ] || [ -f "phpcs.xml.dist" ]; then
                echo "🔍 Running PHPCS analysis for $service..."
                vendor/bin/phpcs --standard=phpcs.xml --report=github || echo "⚠️ PHPCS issues found in $service"
              fi
              
              SUCCESSFUL_SERVICES=$((SUCCESSFUL_SERVICES + 1))
            else
              echo "⚠️ Failed to install dependencies for $service"
            fi
            
            cd - > /dev/null
            TOTAL_SERVICES=$((TOTAL_SERVICES + 1))
          fi
        done
        
        echo "📊 Quality Check Summary:"
        echo "  - Total services processed: $TOTAL_SERVICES"
        echo "  - Successful checks: $SUCCESSFUL_SERVICES"

  # ============================================================================
  # PHASE 3: COMPREHENSIVE TESTING
  # ============================================================================
  
  test-services:
    name: 🧪 Test Services
    runs-on: ubuntu-latest
    needs: [detect-changes, code-quality]
    if: needs.detect-changes.outputs.services == 'true'
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services_matrix) }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, pdo_mysql, pdo_pgsql, redis, curl
        coverage: xdebug

    - name: Cache Composer packages
      uses: actions/cache@v4
      with:
        path: |
          services/${{ matrix.service }}/vendor
          ~/.composer/cache
        key: ${{ runner.os }}-composer-${{ matrix.service }}-${{ hashFiles(format('services/{0}/composer.lock', matrix.service)) }}
        restore-keys: |
          ${{ runner.os }}-composer-${{ matrix.service }}-
          ${{ runner.os }}-composer-

    - name: Setup test environment
      working-directory: services/${{ matrix.service }}
      run: |
        # Create test databases
        touch /tmp/${{ matrix.service }}_test.sqlite
        echo "✅ SQLite database created"
        
        # Setup environment
        if [ -f ".env.example" ]; then
          cp .env.example .env
          
          # CI-optimized configuration
          cat >> .env << EOF
        CACHE_STORE=array
        SESSION_DRIVER=array
        QUEUE_CONNECTION=sync
        DB_CONNECTION=sqlite
        DB_DATABASE=/tmp/${{ matrix.service }}_test.sqlite
        REDIS_CLIENT=predis
        APP_ENV=testing
        EOF
          echo "✅ Test environment configured"
        fi

    - name: Install dependencies
      working-directory: services/${{ matrix.service }}
      run: |
        if [ -f "composer.json" ]; then
          echo "📦 Installing dependencies for ${{ matrix.service }}..."
          composer install --prefer-dist --no-progress --optimize-autoloader
          
          # Generate dependency report
          composer show --format=json > composer-dependencies.json
          echo "✅ Dependencies installed successfully"
        else
          echo "⚠️ No composer.json found, skipping..."
          exit 0
        fi

    - name: Run PHPUnit tests
      working-directory: services/${{ matrix.service }}
      env:
        XDEBUG_MODE: coverage
      run: |
        if [ -f "phpunit.xml" ] || [ -f "phpunit.xml.dist" ]; then
          echo "🧪 Running PHPUnit tests for ${{ matrix.service }}..."
          vendor/bin/phpunit --coverage-clover=coverage.xml --log-junit=test-results.xml --testdox
        else
          echo "⚠️ No PHPUnit configuration found, skipping tests..."
        fi

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.service }}
        path: |
          services/${{ matrix.service }}/coverage.xml
          services/${{ matrix.service }}/test-results.xml
        retention-days: 7

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: services/${{ matrix.service }}/coverage.xml
        flags: ${{ matrix.service }}
        name: ${{ matrix.service }}-coverage
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ============================================================================
  # PHASE 4: SECURITY SCANNING
  # ============================================================================
  
  security-scan:
    name: 🛡️ Security Scanning
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.services == 'true' || needs.detect-changes.outputs.deployment == 'true'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Run dependency security audit
      run: |
        echo "🔍 Running security audit on changed services..."
        SERVICES_LIST="${{ needs.detect-changes.outputs.services_list }}"
        IFS=',' read -ra SERVICES <<< "$SERVICES_LIST"
        
        for service in "${SERVICES[@]}"; do
          if [ -f "services/$service/composer.json" ]; then
            echo "🔍 Auditing $service..."
            cd "services/$service"
            composer audit --no-dev || echo "⚠️ Security issues found in $service"
            cd - > /dev/null
          fi
        done

  # ============================================================================
  # PHASE 5: BUILD & CONTAINERIZATION
  # ============================================================================
  
  build-images:
    name: 🏗️ Build Container Images
    runs-on: ubuntu-latest
    needs: [detect-changes, test-services, security-scan]
    if: |
      always() && 
      (needs.detect-changes.outputs.services == 'true' || needs.detect-changes.outputs.deployment == 'true') &&
      (needs.test-services.result == 'success' || needs.test-services.result == 'skipped') &&
      (needs.security-scan.result == 'success' || needs.security-scan.result == 'skipped')
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services_matrix) }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: services/${{ matrix.service }}
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          SERVICE_NAME=${{ matrix.service }}
          BUILD_DATE=${{ github.event.head_commit.timestamp }}
          VCS_REF=${{ github.sha }}

  # ============================================================================
  # PHASE 6: BLUE-GREEN DEPLOYMENT
  # ============================================================================
  
  deploy-blue-green:
    name: 🔄 Blue-Green Deployment
    runs-on: ubuntu-latest
    needs: [detect-changes, build-images]
    if: |
      needs.detect-changes.outputs.deploy_strategy == 'blue-green' &&
      needs.build-images.result == 'success'
    environment:
      name: production-blue-green
      url: ${{ steps.deploy.outputs.environment_url }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Kubernetes tools
      run: |
        # Install kubectl
        curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
        chmod +x kubectl
        sudo mv kubectl /usr/local/bin/
        
        # Install Helm
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

    - name: Configure Kubernetes access
      run: |
        echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
        kubectl cluster-info

    - name: Determine current environment
      id: current
      run: |
        # Check which environment is currently active
        CURRENT_ENV=$(kubectl get service app-service -o jsonpath='{.spec.selector.environment}' 2>/dev/null || echo "green")
        if [ "$CURRENT_ENV" = "blue" ]; then
          TARGET_ENV="green"
        else
          TARGET_ENV="blue"
        fi
        
        echo "current=$CURRENT_ENV" >> $GITHUB_OUTPUT
        echo "target=$TARGET_ENV" >> $GITHUB_OUTPUT
        echo "🎯 Current environment: $CURRENT_ENV"
        echo "🎯 Target environment: $TARGET_ENV"

    - name: Deploy to target environment
      id: deploy
      run: |
        TARGET_ENV="${{ steps.current.outputs.target }}"
        CLOUD_PROVIDER="${{ needs.detect-changes.outputs.cloud_provider }}"
        HELM_VALUES_FILE="${{ needs.detect-changes.outputs.helm_values_file }}"
        
        echo "🚀 Deploying to $TARGET_ENV environment..."
        echo "☁️ Using cloud provider: $CLOUD_PROVIDER"
        echo "📄 Using Helm values: $HELM_VALUES_FILE"
        
        # Create cloud provider-specific values override
        cat > values-$TARGET_ENV-override.yaml << EOF
        blueGreen:
          enabled: true
          activeEnvironment: $TARGET_ENV
        environment: $TARGET_ENV
        image:
          tag: ${{ github.sha }}
        replicaCount: 3
        global:
          cloudProvider: $CLOUD_PROVIDER
        EOF
        
        # Deploy using Helm with cloud provider-specific values
        helm upgrade --install app-$TARGET_ENV ./deployment/helm/reverse-tender \
          --namespace default \
          --values ./deployment/helm/reverse-tender/$HELM_VALUES_FILE \
          --values values-$TARGET_ENV-override.yaml \
          --set image.tag=${{ github.sha }} \
          --set environment=$TARGET_ENV \
          --set blueGreen.activeEnvironment=$TARGET_ENV \
          --set global.cloudProvider=$CLOUD_PROVIDER \
          --wait --timeout=15m
        
        echo "✅ Blue-Green deployment to $TARGET_ENV completed for $CLOUD_PROVIDER"
        echo "environment_url=https://$TARGET_ENV.reversetender.com" >> $GITHUB_OUTPUT

    - name: Run health checks
      run: |
        TARGET_ENV="${{ steps.current.outputs.target }}"
        
        echo "🏥 Running health checks on $TARGET_ENV environment..."
        
        # Wait for pods to be ready
        kubectl wait --for=condition=ready pod -l app=reverse-tender,environment=$TARGET_ENV --timeout=300s
        
        # Run health check tests
        for i in {1..30}; do
          if kubectl exec -l app=reverse-tender,environment=$TARGET_ENV -- curl -f http://localhost:8000/health; then
            echo "✅ Health check passed"
            break
          else
            echo "⏳ Health check attempt $i/30 failed, retrying..."
            sleep 10
          fi
        done

    - name: Run smoke tests
      run: |
        TARGET_ENV="${{ steps.current.outputs.target }}"
        
        echo "🧪 Running smoke tests on $TARGET_ENV environment..."
        
        # Run basic API tests
        kubectl run smoke-test-$TARGET_ENV --rm -i --restart=Never --image=curlimages/curl -- \
          sh -c "
            curl -f https://$TARGET_ENV.reversetender.com/api/health &&
            curl -f https://$TARGET_ENV.reversetender.com/api/status &&
            echo 'Smoke tests passed'
          "

    - name: Switch traffic (Blue-Green Cutover)
      run: |
        TARGET_ENV="${{ steps.current.outputs.target }}"
        CURRENT_ENV="${{ steps.current.outputs.current }}"
        
        echo "🔄 Switching traffic from $CURRENT_ENV to $TARGET_ENV..."
        
        # Update service selector to point to new environment
        kubectl patch service app-service -p '{"spec":{"selector":{"environment":"'$TARGET_ENV'"}}}'
        
        # Update ingress to point to new environment
        kubectl patch ingress app-ingress -p '{"spec":{"rules":[{"host":"reversetender.com","http":{"paths":[{"path":"/","pathType":"Prefix","backend":{"service":{"name":"app-service-'$TARGET_ENV'","port":{"number":80}}}}]}}]}}'
        
        echo "✅ Traffic switched to $TARGET_ENV environment"
        
        # Wait for traffic to stabilize
        sleep 30

    - name: Verify deployment
      run: |
        TARGET_ENV="${{ steps.current.outputs.target }}"
        
        echo "✅ Running final verification..."
        
        # Verify the switch was successful
        for i in {1..10}; do
          if curl -f https://reversetender.com/api/health | grep -q "healthy"; then
            echo "✅ Production traffic verification passed"
            break
          else
            echo "⏳ Verification attempt $i/10, retrying..."
            sleep 5
          fi
        done

    - name: Cleanup old environment
      run: |
        CURRENT_ENV="${{ steps.current.outputs.current }}"
        
        echo "🧹 Cleaning up old $CURRENT_ENV environment..."
        
        # Scale down old environment (keep for quick rollback)
        kubectl scale deployment app-$CURRENT_ENV --replicas=1
        
        echo "✅ Old environment scaled down (kept for rollback)"

  # ============================================================================
  # PHASE 7: STAGING DEPLOYMENT
  # ============================================================================
  
  deploy-staging:
    name: 🎭 Deploy to Staging
    runs-on: ubuntu-latest
    needs: [detect-changes, build-images]
    if: |
      needs.detect-changes.outputs.deploy_strategy == 'staging' &&
      needs.build-images.result == 'success'
    environment:
      name: staging
      url: https://staging.reversetender.com
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Kind cluster
      uses: helm/kind-action@v1
      with:
        cluster_name: staging-cluster
        config: deployment/kind/cluster-config.yaml

    - name: Deploy to staging with Helm
      run: |
        echo "🎭 Deploying to staging environment..."
        CLOUD_PROVIDER="${{ needs.detect-changes.outputs.cloud_provider }}"
        HELM_VALUES_FILE="${{ needs.detect-changes.outputs.helm_values_file }}"
        
        echo "☁️ Using cloud provider: $CLOUD_PROVIDER"
        echo "📄 Using Helm values: $HELM_VALUES_FILE"
        
        # Install Helm chart with cloud provider-specific values
        helm upgrade --install reverse-tender-staging ./deployment/helm/reverse-tender \
          --namespace staging --create-namespace \
          --values ./deployment/helm/reverse-tender/$HELM_VALUES_FILE \
          --set image.tag=${{ github.sha }} \
          --set environment=staging \
          --set replicaCount=2 \
          --set global.cloudProvider=$CLOUD_PROVIDER \
          --wait --timeout=10m
        
        echo "✅ Staging deployment completed for $CLOUD_PROVIDER"

    - name: Run integration tests
      run: |
        echo "🧪 Running integration tests on staging..."
        
        # Wait for services to be ready
        kubectl wait --for=condition=ready pod -l app=reverse-tender -n staging --timeout=300s
        
        # Run comprehensive test suite
        kubectl run integration-tests --rm -i --restart=Never -n staging --image=curlimages/curl -- \
          sh -c "
            echo 'Running integration tests...'
            curl -f http://reverse-tender-staging:80/api/health
            curl -f http://reverse-tender-staging:80/api/services/status
            echo 'Integration tests completed'
          "

  # ============================================================================
  # PHASE 8: MONITORING & NOTIFICATIONS
  # ============================================================================
  
  deployment-monitoring:
    name: 📊 Deployment Monitoring
    runs-on: ubuntu-latest
    needs: [deploy-blue-green, deploy-staging]
    if: always() && (needs.deploy-blue-green.result != 'skipped' || needs.deploy-staging.result != 'skipped')
    
    steps:
    - name: Collect deployment metrics
      run: |
        echo "📊 Collecting deployment metrics..."
        
        # Create deployment summary
        cat > deployment-summary.json << EOF
        {
          "deployment_id": "${{ github.run_id }}",
          "commit_sha": "${{ github.sha }}",
          "branch": "${{ github.ref_name }}",
          "deployment_time": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "blue_green_result": "${{ needs.deploy-blue-green.result }}",
          "staging_result": "${{ needs.deploy-staging.result }}",
          "services_deployed": "${{ needs.detect-changes.outputs.services_list }}"
        }
        EOF
        
        echo "📋 Deployment Summary:"
        cat deployment-summary.json

    - name: Send deployment notification
      if: always()
      run: |
        STATUS="✅ Success"
        if [ "${{ needs.deploy-blue-green.result }}" = "failure" ] || [ "${{ needs.deploy-staging.result }}" = "failure" ]; then
          STATUS="❌ Failed"
        fi
        
        echo "📢 Deployment $STATUS - Run ID: ${{ github.run_id }}"
        echo "🔗 View details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # ============================================================================
  # PHASE 9: ROLLBACK CAPABILITY
  # ============================================================================
  
  rollback-on-failure:
    name: 🔄 Automatic Rollback
    runs-on: ubuntu-latest
    needs: [deploy-blue-green, detect-changes]
    if: |
      always() && 
      needs.deploy-blue-green.result == 'failure' && 
      needs.detect-changes.outputs.deploy_strategy == 'blue-green'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure Kubernetes access
      run: |
        echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config

    - name: Perform automatic rollback
      run: |
        echo "🚨 Deployment failed, performing automatic rollback..."
        
        # Get the previous stable environment
        CURRENT_SERVICE_ENV=$(kubectl get service app-service -o jsonpath='{.spec.selector.environment}' 2>/dev/null || echo "blue")
        
        if [ "$CURRENT_SERVICE_ENV" = "blue" ]; then
          ROLLBACK_ENV="green"
        else
          ROLLBACK_ENV="blue"
        fi
        
        echo "🔄 Rolling back to $ROLLBACK_ENV environment..."
        
        # Switch service back to stable environment
        kubectl patch service app-service -p '{"spec":{"selector":{"environment":"'$ROLLBACK_ENV'"}}}'
        
        # Scale up the stable environment
        kubectl scale deployment app-$ROLLBACK_ENV --replicas=3
        
        echo "✅ Rollback completed to $ROLLBACK_ENV environment"

    - name: Verify rollback
      run: |
        echo "✅ Verifying rollback..."
        
        # Verify the rollback was successful
        for i in {1..10}; do
          if curl -f https://reversetender.com/api/health | grep -q "healthy"; then
            echo "✅ Rollback verification passed"
            break
          else
            echo "⏳ Rollback verification attempt $i/10, retrying..."
            sleep 5
          fi
        done

  # ============================================================================
  # PHASE 10: CLEANUP
  # ============================================================================
  
  cleanup:
    name: 🧹 Cleanup Resources
    runs-on: ubuntu-latest
    needs: [deploy-blue-green, deploy-staging, rollback-on-failure]
    if: always()
    
    steps:
    - name: Cleanup temporary resources
      run: |
        echo "🧹 Cleaning up temporary resources..."
        
        # Clean up any temporary files or resources
        echo "✅ Cleanup completed"

    - name: Archive deployment artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: deployment-artifacts-${{ github.run_id }}
        path: |
          deployment-summary.json
          values-*.yaml
        retention-days: 30
