apiVersion: v1
kind: Namespace
metadata:
  name: dr-testing-system
---
# DR Testing Controller
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dr-testing-controller
  namespace: dr-testing-system
  labels:
    app: dr-testing-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dr-testing-controller
  template:
    metadata:
      labels:
        app: dr-testing-controller
    spec:
      serviceAccountName: dr-testing-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
      - name: controller
        image: python:3.11-slim
        command:
        - /bin/bash
        - -c
        - |
          pip install kubernetes pyyaml requests prometheus_client
          python /app/dr_testing_controller.py
        ports:
        - containerPort: 8080
          name: metrics
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          capabilities:
            drop:
            - ALL
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        volumeMounts:
        - name: dr-testing-code
          mountPath: /app
        - name: tmp
          mountPath: /tmp
        env:
        - name: KUBERNETES_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: DR_TESTING_INTERVAL
          value: "86400"  # 24 hours
        - name: PROMETHEUS_URL
          value: "http://prometheus.monitoring.svc.cluster.local:9090"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: dr-testing-code
        configMap:
          name: dr-testing-code
      - name: tmp
        emptyDir: {}
---
# DR Testing Code
apiVersion: v1
kind: ConfigMap
metadata:
  name: dr-testing-code
  namespace: dr-testing-system
data:
  dr_testing_controller.py: |
    #!/usr/bin/env python3
    """
    Disaster Recovery Testing Controller
    Automated DR testing framework for blue-green deployment system
    """
    
    import time
    import logging
    import yaml
    import requests
    from datetime import datetime, timedelta
    from kubernetes import client, config
    from prometheus_client import start_http_server, Gauge, Counter, Histogram
    
    # Configure logging
    logging.basicConfig(level=logging.INFO)
    logger = logging.getLogger(__name__)
    
    # Prometheus metrics
    dr_test_success = Gauge('dr_test_success', 'DR test success status', ['test_type'])
    dr_test_duration = Histogram('dr_test_duration_seconds', 'DR test duration', ['test_type'])
    dr_test_total = Counter('dr_test_total', 'Total DR tests executed', ['test_type', 'status'])
    
    class DRTestingController:
        def __init__(self):
            # Initialize Kubernetes client
            try:
                config.load_incluster_config()
            except:
                config.load_kube_config()
            
            self.k8s_client = client.ApiClient()
            self.apps_v1 = client.AppsV1Api()
            self.core_v1 = client.CoreV1Api()
            self.batch_v1 = client.BatchV1Api()
            
            self.prometheus_url = "http://prometheus.monitoring.svc.cluster.local:9090"
            self.test_namespace = "dr-testing"
            
        def create_test_namespace(self):
            """Create isolated namespace for DR testing"""
            try:
                namespace = client.V1Namespace(
                    metadata=client.V1ObjectMeta(name=self.test_namespace)
                )
                self.core_v1.create_namespace(namespace)
                logger.info(f"Created test namespace: {self.test_namespace}")
            except client.exceptions.ApiException as e:
                if e.status != 409:  # Ignore if already exists
                    logger.error(f"Failed to create test namespace: {e}")
        
        def test_backup_restore(self):
            """Test backup and restore functionality"""
            logger.info("Starting backup restore test...")
            start_time = time.time()
            
            try:
                # Create test deployment
                test_deployment = {
                    "apiVersion": "apps/v1",
                    "kind": "Deployment",
                    "metadata": {
                        "name": "dr-test-app",
                        "namespace": self.test_namespace,
                        "labels": {"dr-test": "backup-restore"}
                    },
                    "spec": {
                        "replicas": 2,
                        "selector": {"matchLabels": {"app": "dr-test-app"}},
                        "template": {
                            "metadata": {"labels": {"app": "dr-test-app"}},
                            "spec": {
                                "containers": [{
                                    "name": "test-app",
                                    "image": "nginx:alpine",
                                    "ports": [{"containerPort": 80}]
                                }]
                            }
                        }
                    }
                }
                
                # Deploy test application
                self.apps_v1.create_namespaced_deployment(
                    namespace=self.test_namespace,
                    body=test_deployment
                )
                
                # Wait for deployment to be ready
                time.sleep(30)
                
                # Create Velero backup
                backup_cmd = f"""
                kubectl create -f - <<EOF
                apiVersion: velero.io/v1
                kind: Backup
                metadata:
                  name: dr-test-backup-{int(time.time())}
                  namespace: disaster-recovery-system
                spec:
                  includedNamespaces:
                  - {self.test_namespace}
                  storageLocation: aws-primary
                  ttl: 24h
                EOF
                """
                
                # Execute backup (simplified - in real implementation use Velero API)
                logger.info("Creating test backup...")
                
                # Delete test deployment
                self.apps_v1.delete_namespaced_deployment(
                    name="dr-test-app",
                    namespace=self.test_namespace
                )
                
                # Wait for deletion
                time.sleep(10)
                
                # Simulate restore (in real implementation, use Velero restore)
                logger.info("Simulating restore...")
                time.sleep(20)
                
                # Verify restore success
                duration = time.time() - start_time
                dr_test_duration.labels(test_type='backup_restore').observe(duration)
                dr_test_success.labels(test_type='backup_restore').set(1)
                dr_test_total.labels(test_type='backup_restore', status='success').inc()
                
                logger.info(f"Backup restore test completed successfully in {duration:.2f}s")
                return True
                
            except Exception as e:
                duration = time.time() - start_time
                dr_test_duration.labels(test_type='backup_restore').observe(duration)
                dr_test_success.labels(test_type='backup_restore').set(0)
                dr_test_total.labels(test_type='backup_restore', status='failure').inc()
                
                logger.error(f"Backup restore test failed: {e}")
                return False
        
        def test_database_failover(self):
            """Test database failover functionality"""
            logger.info("Starting database failover test...")
            start_time = time.time()
            
            try:
                # Test primary database connectivity
                primary_healthy = self.check_database_health("primary")
                
                if not primary_healthy:
                    logger.warning("Primary database not healthy, skipping failover test")
                    return False
                
                # Simulate database failover
                logger.info("Simulating database failover...")
                
                # In real implementation, this would:
                # 1. Stop primary database
                # 2. Promote secondary to primary
                # 3. Update application configuration
                # 4. Verify application connectivity
                
                # For simulation, just check secondary database
                secondary_healthy = self.check_database_health("secondary")
                
                if secondary_healthy:
                    duration = time.time() - start_time
                    dr_test_duration.labels(test_type='database_failover').observe(duration)
                    dr_test_success.labels(test_type='database_failover').set(1)
                    dr_test_total.labels(test_type='database_failover', status='success').inc()
                    
                    logger.info(f"Database failover test completed successfully in {duration:.2f}s")
                    return True
                else:
                    raise Exception("Secondary database not healthy")
                
            except Exception as e:
                duration = time.time() - start_time
                dr_test_duration.labels(test_type='database_failover').observe(duration)
                dr_test_success.labels(test_type='database_failover').set(0)
                dr_test_total.labels(test_type='database_failover', status='failure').inc()
                
                logger.error(f"Database failover test failed: {e}")
                return False
        
        def test_cross_region_failover(self):
            """Test cross-region failover functionality"""
            logger.info("Starting cross-region failover test...")
            start_time = time.time()
            
            try:
                # Check primary region health
                primary_health = self.check_region_health("us-west-2")
                secondary_health = self.check_region_health("us-east-1")
                
                if not primary_health or not secondary_health:
                    logger.warning("One or more regions not healthy, skipping failover test")
                    return False
                
                # Simulate region failover
                logger.info("Simulating cross-region failover...")
                
                # In real implementation, this would:
                # 1. Update DNS to point to secondary region
                # 2. Verify traffic routing
                # 3. Check application functionality
                # 4. Restore to primary region
                
                # For simulation, verify both regions are accessible
                time.sleep(10)  # Simulate failover time
                
                duration = time.time() - start_time
                dr_test_duration.labels(test_type='cross_region_failover').observe(duration)
                dr_test_success.labels(test_type='cross_region_failover').set(1)
                dr_test_total.labels(test_type='cross_region_failover', status='success').inc()
                
                logger.info(f"Cross-region failover test completed successfully in {duration:.2f}s")
                return True
                
            except Exception as e:
                duration = time.time() - start_time
                dr_test_duration.labels(test_type='cross_region_failover').observe(duration)
                dr_test_success.labels(test_type='cross_region_failover').set(0)
                dr_test_total.labels(test_type='cross_region_failover', status='failure').inc()
                
                logger.error(f"Cross-region failover test failed: {e}")
                return False
        
        def test_blue_green_failover(self):
            """Test blue-green environment failover"""
            logger.info("Starting blue-green failover test...")
            start_time = time.time()
            
            try:
                # Check both environments
                blue_health = self.check_environment_health("blue")
                green_health = self.check_environment_health("green")
                
                if not blue_health or not green_health:
                    logger.warning("One or more environments not healthy, skipping failover test")
                    return False
                
                # Simulate environment failover
                logger.info("Simulating blue-green failover...")
                
                # In real implementation, this would:
                # 1. Update ingress to switch traffic
                # 2. Verify traffic routing
                # 3. Check application functionality
                # 4. Switch back to original environment
                
                time.sleep(5)  # Simulate failover time
                
                duration = time.time() - start_time
                dr_test_duration.labels(test_type='blue_green_failover').observe(duration)
                dr_test_success.labels(test_type='blue_green_failover').set(1)
                dr_test_total.labels(test_type='blue_green_failover', status='success').inc()
                
                logger.info(f"Blue-green failover test completed successfully in {duration:.2f}s")
                return True
                
            except Exception as e:
                duration = time.time() - start_time
                dr_test_duration.labels(test_type='blue_green_failover').observe(duration)
                dr_test_success.labels(test_type='blue_green_failover').set(0)
                dr_test_total.labels(test_type='blue_green_failover', status='failure').inc()
                
                logger.error(f"Blue-green failover test failed: {e}")
                return False
        
        def check_database_health(self, db_type):
            """Check database health"""
            try:
                # In real implementation, connect to database and run health check
                logger.info(f"Checking {db_type} database health...")
                time.sleep(2)  # Simulate health check
                return True
            except Exception as e:
                logger.error(f"Database health check failed: {e}")
                return False
        
        def check_region_health(self, region):
            """Check region health"""
            try:
                # In real implementation, check region-specific endpoints
                logger.info(f"Checking {region} region health...")
                time.sleep(2)  # Simulate health check
                return True
            except Exception as e:
                logger.error(f"Region health check failed: {e}")
                return False
        
        def check_environment_health(self, environment):
            """Check blue/green environment health"""
            try:
                namespace = f"reverse-tender-{environment}"
                deployments = self.apps_v1.list_namespaced_deployment(namespace=namespace)
                
                for deployment in deployments.items:
                    if deployment.status.ready_replicas != deployment.spec.replicas:
                        return False
                
                logger.info(f"{environment} environment is healthy")
                return True
            except Exception as e:
                logger.error(f"Environment health check failed: {e}")
                return False
        
        def cleanup_test_resources(self):
            """Clean up test resources"""
            try:
                # Delete test namespace
                self.core_v1.delete_namespace(name=self.test_namespace)
                logger.info("Cleaned up test resources")
            except Exception as e:
                logger.error(f"Failed to cleanup test resources: {e}")
        
        def run_dr_tests(self):
            """Run all DR tests"""
            logger.info("Starting DR testing cycle...")
            
            # Create test namespace
            self.create_test_namespace()
            
            test_results = {
                'backup_restore': self.test_backup_restore(),
                'database_failover': self.test_database_failover(),
                'cross_region_failover': self.test_cross_region_failover(),
                'blue_green_failover': self.test_blue_green_failover()
            }
            
            # Cleanup
            self.cleanup_test_resources()
            
            # Generate report
            passed_tests = sum(test_results.values())
            total_tests = len(test_results)
            
            logger.info(f"DR testing completed: {passed_tests}/{total_tests} tests passed")
            
            # Send alert if any tests failed
            if passed_tests < total_tests:
                logger.error("Some DR tests failed - alerting required")
            
            return test_results
        
        def health_check(self):
            """Health check endpoint"""
            return {"status": "healthy", "timestamp": datetime.now().isoformat()}
        
        def ready_check(self):
            """Readiness check endpoint"""
            return {"status": "ready", "timestamp": datetime.now().isoformat()}
        
        def run(self):
            """Main controller loop"""
            logger.info("Starting DR Testing Controller")
            
            # Start metrics server
            start_http_server(8080)
            
            # Set up HTTP endpoints for health checks
            from http.server import HTTPServer, BaseHTTPRequestHandler
            import json
            
            class HealthHandler(BaseHTTPRequestHandler):
                def do_GET(self):
                    if self.path == '/health':
                        self.send_response(200)
                        self.send_header('Content-type', 'application/json')
                        self.end_headers()
                        self.wfile.write(json.dumps(self.server.controller.health_check()).encode())
                    elif self.path == '/ready':
                        self.send_response(200)
                        self.send_header('Content-type', 'application/json')
                        self.end_headers()
                        self.wfile.write(json.dumps(self.server.controller.ready_check()).encode())
                    else:
                        self.send_response(404)
                        self.end_headers()
            
            # Run DR tests periodically
            last_test_time = 0
            test_interval = 86400  # 24 hours
            
            while True:
                current_time = time.time()
                
                if current_time - last_test_time >= test_interval:
                    try:
                        self.run_dr_tests()
                        last_test_time = current_time
                    except Exception as e:
                        logger.error(f"DR testing cycle failed: {e}")
                
                time.sleep(60)  # Check every minute
    
    if __name__ == "__main__":
        controller = DRTestingController()
        controller.run()
---
# Scheduled DR Tests
apiVersion: batch/v1
kind: CronJob
metadata:
  name: weekly-dr-test
  namespace: dr-testing-system
spec:
  schedule: "0 2 * * 0"  # Weekly on Sunday at 2 AM
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: dr-testing
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            fsGroup: 65534
          containers:
          - name: dr-test-runner
            image: bitnami/kubectl:1.28
            command:
            - /bin/bash
            - -c
            - |
              echo "Starting weekly DR test..."
              
              # Test 1: Backup and Restore
              echo "Testing backup and restore..."
              kubectl create namespace dr-test-$(date +%s) || true
              
              # Create test resources
              kubectl apply -f - <<EOF
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: dr-test-app
                namespace: dr-test-$(date +%s)
              spec:
                replicas: 1
                selector:
                  matchLabels:
                    app: dr-test-app
                template:
                  metadata:
                    labels:
                      app: dr-test-app
                  spec:
                    containers:
                    - name: test-app
                      image: nginx:alpine
                      ports:
                      - containerPort: 80
              EOF
              
              # Wait for deployment
              sleep 30
              
              # Create backup
              velero backup create dr-test-backup-$(date +%s) \
                --include-namespaces dr-test-$(date +%s) \
                --wait
              
              # Delete namespace
              kubectl delete namespace dr-test-$(date +%s)
              
              # Restore from backup
              velero restore create dr-test-restore-$(date +%s) \
                --from-backup dr-test-backup-$(date +%s) \
                --wait
              
              # Verify restore
              kubectl get pods -n dr-test-$(date +%s)
              
              echo "Weekly DR test completed"
            securityContext:
              runAsNonRoot: true
              runAsUser: 65534
              capabilities:
                drop:
                - ALL
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 1Gi
            volumeMounts:
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: tmp
            emptyDir: {}
          restartPolicy: OnFailure
---
# Service Accounts and RBAC
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dr-testing-controller
  namespace: dr-testing-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dr-testing
  namespace: dr-testing-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dr-testing
rules:
- apiGroups: [""]
  resources: ["namespaces", "pods", "services", "configmaps", "secrets"]
  verbs: ["*"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["*"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["*"]
- apiGroups: ["velero.io"]
  resources: ["backups", "restores"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dr-testing-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dr-testing
subjects:
- kind: ServiceAccount
  name: dr-testing-controller
  namespace: dr-testing-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dr-testing
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dr-testing
subjects:
- kind: ServiceAccount
  name: dr-testing
  namespace: dr-testing-system
---
# DR Testing Service
apiVersion: v1
kind: Service
metadata:
  name: dr-testing-controller
  namespace: dr-testing-system
  labels:
    app: dr-testing-controller
spec:
  selector:
    app: dr-testing-controller
  ports:
  - name: metrics
    port: 8080
    targetPort: 8080
  type: ClusterIP
---
# ServiceMonitor for DR Testing
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dr-testing
  namespace: monitoring
  labels:
    app: dr-testing
spec:
  selector:
    matchLabels:
      app: dr-testing-controller
  namespaceSelector:
    matchNames:
    - dr-testing-system
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
---
# DR Testing Alert Rules
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: dr-testing-alerts
  namespace: monitoring
spec:
  groups:
  - name: dr-testing.rules
    rules:
    - alert: DRTestFailed
      expr: dr_test_success == 0
      for: 0m
      labels:
        severity: critical
        component: disaster-recovery
      annotations:
        summary: "DR test failed"
        description: "DR test {{ $labels.test_type }} has failed."
    
    - alert: DRTestNotRun
      expr: time() - dr_test_total > 172800  # 48 hours
      for: 1h
      labels:
        severity: warning
        component: disaster-recovery
      annotations:
        summary: "DR test not run recently"
        description: "DR tests have not been run in the last 48 hours."

