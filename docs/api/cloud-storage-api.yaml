openapi: 3.0.3
info:
  title: Reverse Tender Platform - Cloud Storage Integration API
  description: |
    Comprehensive API documentation for cloud storage integration across the Reverse Tender Platform microservices architecture.
    
    This API provides unified file upload, management, and processing capabilities across multiple services including:
    - User profile management (avatars)
    - KYC document verification workflow
    - VIN OCR image processing
    
    ## Features
    - **Multi-Cloud Support**: DigitalOcean Spaces, Linode Object Storage, AWS S3 compatibility
    - **Automatic Optimization**: Image compression, resizing, and format optimization
    - **Security**: Document encryption for sensitive files, secure access controls
    - **Scalability**: Distributed across microservices with service-specific configurations
    - **Audit Trail**: Complete file lifecycle tracking and metadata management
    
    ## Architecture
    The platform uses a microservices architecture with the following services:
    - **user-service**: Profile and KYC document management
    - **vin-ocr-service**: Vehicle identification number processing
    - **auth-service**: Authentication and authorization
    - **bidding-service**: Auction and bidding operations
    - **order-service**: Order management
    - **payment-service**: Payment processing
    - **notification-service**: Communication services
    - **analytics-service**: Data analysis and reporting
    
    ## Authentication
    All endpoints require JWT authentication obtained from the auth-service.
    Include the token in the Authorization header: `Bearer <your-jwt-token>`
    
    ## Error Handling
    All endpoints follow consistent error response patterns:
    - **400**: Bad Request - Invalid input or validation errors
    - **401**: Unauthorized - Authentication required or invalid token
    - **403**: Forbidden - Insufficient permissions
    - **404**: Not Found - Resource not found
    - **413**: Payload Too Large - File size exceeds limits
    - **422**: Unprocessable Entity - Validation errors
    - **500**: Internal Server Error - Server-side errors
    
    ## Rate Limiting
    API endpoints are rate-limited to ensure fair usage:
    - **File Upload**: 100 requests per hour per user
    - **File Retrieval**: 1000 requests per hour per user
    - **VIN Processing**: 50 requests per hour per user
    
    ## File Size Limits
    - **Avatar Images**: 5MB maximum
    - **KYC Documents**: 10MB maximum
    - **VIN Images**: 10MB maximum
    
    ## Supported File Formats
    - **Images**: JPEG, PNG, GIF, WebP, BMP
    - **Documents**: PDF, JPEG, PNG
    
