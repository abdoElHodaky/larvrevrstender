# CircleCI Configuration for Laravel Microservices Platform - COMPLETE VERSION
# Enterprise-grade CI/CD with optimal performance and cost efficiency
# Version: 2.1 with complete service matrix

version: 2.1

# ============================================================================
# ORBS - Reusable packages of configuration
# ============================================================================
orbs:
  docker: circleci/docker@2.6.0
  node: circleci/node@5.2.0
  slack: circleci/slack@4.13.3
  codecov: codecov/codecov@4.0.1

# ============================================================================
# EXECUTORS - Reusable execution environments
# ============================================================================
executors:
  # Small executor for lightweight tasks
  small-executor:
    docker:
      - image: cimg/php:8.3-node
    resource_class: small
    environment:
      PHP_VERSION: "8.3"
      NODE_VERSION: "18"
    
  # Medium executor for service testing
  medium-executor:
    docker:
      - image: cimg/php:8.3-node
      - image: cimg/postgres:15.0
        environment:
          POSTGRES_USER: laravel
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: laravel_test
      - image: cimg/redis:7.0
    resource_class: medium
    environment:
      PHP_VERSION: "8.3"
      NODE_VERSION: "18"
      DB_CONNECTION: pgsql
      DB_HOST: localhost
      DB_PORT: 5432
      DB_DATABASE: laravel_test
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      REDIS_HOST: localhost
      REDIS_PORT: 6379
    
  # Large executor for Docker builds
  large-executor:
    docker:
      - image: cimg/php:8.3-node
    resource_class: large
    environment:
      DOCKER_BUILDKIT: 1
      COMPOSE_DOCKER_CLI_BUILD: 1
    
  # XLarge executor for performance testing
  xlarge-executor:
    docker:
      - image: cimg/php:8.3-node
    resource_class: xlarge
    environment:
      PHP_VERSION: "8.3"
      NODE_VERSION: "18"

# ============================================================================
# COMMANDS - Reusable command sequences
# ============================================================================
commands:
  # Setup PHP environment with extensions
  setup-php:
    description: "Setup PHP with required extensions"
    steps:
      - run:
          name: Install PHP extensions
          command: |
            sudo apt-get update
            sudo apt-get install -y \
              php8.3-pgsql \
              php8.3-redis \
              php8.3-gd \
              php8.3-zip \
              php8.3-xml \
              php8.3-mbstring \
              php8.3-curl \
              php8.3-bcmath \
              php8.3-intl
            
            # Verify PHP configuration
            php -v
            php -m | grep -E "(pdo_pgsql|redis|gd|zip)"
  
  # Install and cache Composer dependencies
  install-composer-deps:
    description: "Install Composer dependencies with caching"
    parameters:
      service:
        type: string
        default: "."
    steps:
      - restore_cache:
          keys:
            - composer-v2-{{ .Environment.CIRCLE_JOB }}-{{ checksum "<< parameters.service >>/composer.lock" }}
            - composer-v2-{{ .Environment.CIRCLE_JOB }}-
            - composer-v2-
      
      - run:
          name: Install Composer dependencies
          command: |
            # Handle both service naming patterns
            if [ -d "<< parameters.service >>-service" ]; then
              cd << parameters.service >>-service
            elif [ -d "<< parameters.service >>" ]; then
              cd << parameters.service >>
            else
              echo "Service directory not found: << parameters.service >>"
              exit 1
            fi
            composer install --no-interaction --prefer-dist --optimize-autoloader
            
      - save_cache:
          key: composer-v2-{{ .Environment.CIRCLE_JOB }}-{{ checksum "<< parameters.service >>/composer.lock" }}
          paths:
            - << parameters.service >>/vendor
            - ~/.composer/cache
  
  # Install and cache Node dependencies
  install-node-deps:
    description: "Install Node dependencies with caching"
    parameters:
      service:
        type: string
        default: "."
    steps:
      - restore_cache:
          keys:
            - node-v2-{{ .Environment.CIRCLE_JOB }}-{{ checksum "<< parameters.service >>/package-lock.json" }}
            - node-v2-{{ .Environment.CIRCLE_JOB }}-
            - node-v2-
      
      - run:
          name: Install Node dependencies
          command: |
            # Handle both service naming patterns
            if [ -d "<< parameters.service >>-service" ]; then
              cd << parameters.service >>-service
            elif [ -d "<< parameters.service >>" ]; then
              cd << parameters.service >>
            else
              echo "Service directory not found: << parameters.service >>"
              exit 1
            fi
            
            if [ -f package-lock.json ]; then
              npm ci
            elif [ -f yarn.lock ]; then
              yarn install --frozen-lockfile
            fi
            
      - save_cache:
          key: node-v2-{{ .Environment.CIRCLE_JOB }}-{{ checksum "<< parameters.service >>/package-lock.json" }}
          paths:
            - << parameters.service >>/node_modules
            - ~/.npm
  
  # Notify Slack on job completion
  notify-slack:
    description: "Send Slack notification"
    parameters:
      status:
        type: string
      job_name:
        type: string
    steps:
      - slack/notify:
          event: << parameters.status >>
          custom: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":circleci: *<< parameters.job_name >>* << parameters.status >> for `${CIRCLE_BRANCH}` branch"
                  }
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "Build: <${CIRCLE_BUILD_URL}|#${CIRCLE_BUILD_NUM}> | Commit: <https://github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}/commit/${CIRCLE_SHA1}|${CIRCLE_SHA1:0:7}>"
                    }
                  ]
                }
              ]
            }

# ============================================================================
# JOBS - Individual units of work
# ============================================================================
jobs:
  # Phase 0: Change Detection & Planning
  change-detection:
    executor: small-executor
    steps:
      - checkout
      - run:
          name: Detect changed files
          command: |
            # Get changed files between current commit and main
            if [ "$CIRCLE_BRANCH" != "main" ]; then
              git fetch origin main
              CHANGED_FILES=$(git diff --name-only origin/main...HEAD)
            else
              CHANGED_FILES=$(git diff --name-only HEAD~1...HEAD)
            fi
            
            echo "Changed files:"
            echo "$CHANGED_FILES"
            
            # Determine affected services
            AFFECTED_SERVICES=""
            for service in auth user auction bidding payment gateway order analytics notification vin-ocr; do
              if echo "$CHANGED_FILES" | grep -q "services/$service-service/"; then
                AFFECTED_SERVICES="$AFFECTED_SERVICES $service"
              fi
            done
            
            # Check shared service (different naming pattern)
            if echo "$CHANGED_FILES" | grep -q "services/shared/"; then
              AFFECTED_SERVICES="$AFFECTED_SERVICES shared"
            fi
            
            # Check for global changes
            GLOBAL_CHANGES=false
            if echo "$CHANGED_FILES" | grep -qE "(\.github/|docker-compose|Dockerfile|\.circleci/)"; then
              GLOBAL_CHANGES=true
              AFFECTED_SERVICES="auth user auction bidding payment gateway order analytics notification vin-ocr shared"
            fi
            
            echo "Affected services: $AFFECTED_SERVICES"
            echo "Global changes: $GLOBAL_CHANGES"
            
            # Save to workspace
            mkdir -p /tmp/workspace
            echo "$AFFECTED_SERVICES" > /tmp/workspace/affected_services
            echo "$GLOBAL_CHANGES" > /tmp/workspace/global_changes
            
      - persist_to_workspace:
          root: /tmp/workspace
          paths:
            - affected_services
            - global_changes
            
      - notify-slack:
          status: "started"
          job_name: "Change Detection"
  
  # Phase 1: Security Scanning
  security-scanning:
    executor: small-executor
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/workspace
          
      - run:
          name: Install Trivy
          command: |
            sudo apt-get update
            sudo apt-get install wget apt-transport-https gnupg lsb-release
            wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
            echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
            sudo apt-get update
            sudo apt-get install trivy
            
      - run:
          name: Run Trivy filesystem scan
          command: |
            trivy fs --format json --output trivy-results.json .
            trivy fs --format table .
            
      - store_artifacts:
          path: trivy-results.json
          destination: security/trivy-results.json
          
      - notify-slack:
          status: "passed"
          job_name: "Security Scanning"
  
  # Phase 1: Code Quality PHP 8.2
  code-quality-php82:
    executor: medium-executor
    docker:
      - image: cimg/php:8.2-node
    steps:
      - checkout
      - setup-php
      - install-composer-deps
      
      - run:
          name: Run PHP CodeSniffer
          command: |
            if [ -f vendor/bin/phpcs ]; then
              vendor/bin/phpcs --standard=PSR12 --report=junit --report-file=phpcs-results.xml services/
            fi
            
      - store_test_results:
          path: phpcs-results.xml
          
      - notify-slack:
          status: "passed"
          job_name: "Code Quality PHP 8.2"
  
  # Phase 1: Code Quality PHP 8.3
  code-quality-php83:
    executor: medium-executor
    steps:
      - checkout
      - setup-php
      - install-composer-deps
      
      - run:
          name: Run PHP CodeSniffer
          command: |
            if [ -f vendor/bin/phpcs ]; then
              vendor/bin/phpcs --standard=PSR12 --report=junit --report-file=phpcs-results.xml services/
            fi
            
      - store_test_results:
          path: phpcs-results.xml
          
      - notify-slack:
          status: "passed"
          job_name: "Code Quality PHP 8.3"

