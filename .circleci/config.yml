# DYNAMIC SERVICE TESTING JOBS - Phase 2
# ============================================================================

  # Test job for auth service
  test-auth-service:
    executor: medium-executor
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/workspace
      - setup-php
      - install-composer-deps:
          service: services/auth-service
      - run:
          name: Check for Node dependencies
          command: |
            if [ -f services/auth-service/package.json ]; then
              echo "Installing Node dependencies for auth"
            fi
      - install-node-deps:
          service: services/auth-service
      - run:
          name: Setup auth test environment
          command: |
            cd services/auth-service
            if [ -f .env.testing ]; then
              cp .env.testing .env
            elif [ -f .env.example ]; then
              cp .env.example .env
            fi
            
            # Generate application key
            php artisan key:generate --force
            
            # Cache configuration
            php artisan config:cache
            
            # Clear any existing cache
            php artisan cache:clear || true
            php artisan view:clear || true

      - run:
          name: Run auth database migrations
          command: |
            cd services/auth-service
            php artisan migrate --force --seed

      - run:
          name: Run auth PHPUnit tests
          command: |
            cd services/auth-service
            vendor/bin/phpunit \
              --coverage-clover=coverage.xml \
              --coverage-html=coverage-html \
              --log-junit=test-results.xml \
              --testdox-html=testdox.html

      - run:
          name: Run auth Feature tests
          command: |
            cd services/auth-service
            if [ -d tests/Feature ]; then
              vendor/bin/phpunit tests/Feature \
                --log-junit=feature-test-results.xml
            fi

      - store_test_results:
          path: services/auth-service/test-results.xml
      - store_test_results:
          path: services/auth-service/feature-test-results.xml
      - store_artifacts:
          path: services/auth-service/coverage-html
          destination: coverage-auth
      - store_artifacts:
          path: services/auth-service/testdox.html
          destination: testdox-auth.html

      - codecov/upload:
