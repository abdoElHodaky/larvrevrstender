# ============================================================================
# WORKFLOWS - Complete orchestration of all jobs
# ============================================================================
workflows:
  version: 2
  enterprise-pipeline:
    jobs:
      # Phase 0: Change Detection (Sequential)
      - change-detection:
          filters:
            branches:
              only: /.*/
      
      # Phase 1: Parallel Security & Quality (3 concurrent)
      - security-scanning:
          requires: [change-detection]
          
      - code-quality-php82:
          requires: [change-detection]
          
      - code-quality-php83:
          requires: [change-detection]
      
      # Phase 2: Service Testing (11 parallel services)
      - test-auth-service:
          requires:
            - security-scanning
            - code-quality-php82
            - code-quality-php83
          filters:
            branches:
              only: /.*/
