# Service Testing Jobs (Phase 2)
  # Test job for auth service (core service - use medium resources)
  test-auth-service:
    executor: medium-executor-php83  # Core service needs medium resources
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/workspace
      - setup-php
      - install-composer-deps:
          service: services/auth
      - run:
          name: Check for Node dependencies
          command: |
            if [ -f services/auth/package.json ]; then
              echo "Installing Node dependencies for auth"
            fi
      - install-node-deps:
          service: services/auth
      - run:
          name: Setup auth test environment
          command: |
            cd services/auth
            if [ -f .env.testing ]; then
              cp .env.testing .env
            elif [ -f .env.example ]; then
              cp .env.example .env
            fi
            
            # Generate application key
            php artisan key:generate --force
            
            # Cache configuration
            php artisan config:cache
            
            # Clear any existing cache
            php artisan cache:clear || true
            php artisan view:clear || true

      - run:
          name: Run auth database migrations
          command: |
            cd services/auth
            php artisan migrate --force --seed

      - run:
          name: Run auth PHPUnit tests
          command: |
            cd services/auth
            vendor/bin/phpunit \
              --coverage-clover=coverage.xml \
              --coverage-html=coverage-html \
              --log-junit=test-results.xml \
              --testdox-html=testdox.html

      - run:
          name: Run auth Feature tests
          command: |
            cd services/auth
            if [ -d tests/Feature ]; then
              vendor/bin/phpunit tests/Feature \
                --log-junit=feature-test-results.xml
            fi

      - store_test_results:
          path: services/auth/test-results.xml
      - store_test_results:
          path: services/auth/feature-test-results.xml
      - store_artifacts:
          path: services/auth/coverage-html
          destination: coverage-auth
      - store_artifacts:
          path: services/auth/testdox.html
          destination: testdox-auth.html

      - codecov/upload:
          file: services/auth/coverage.xml
          flags: auth

      - notify-slack:
          status: "passed"
          job_name: "Test auth Service"

  # Test job for user service (core service - use medium resources)
  test-user-service:
