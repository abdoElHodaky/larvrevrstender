  # Additional service test jobs would continue here...
  # (For brevity, showing pattern for first 2 services)

# Service Build Jobs (Phase 3)  
  # Build job for auth service (Docker build - use large resources)
  build-auth-service:
    executor: large-executor-php83  # Docker builds need large resources
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/workspace
      - setup_remote_docker:
          docker_layer_caching: true

      - run:
          name: Check if auth should be built (Phase 7: Conditional Execution)
          command: |
            AFFECTED_SERVICES=$(cat /tmp/workspace/affected_services)
            SKIP_DOCKER_BUILDS=$(cat /tmp/workspace/skip_docker_builds)
            
            # Check if service is affected and Docker builds are not skipped
            if echo "$AFFECTED_SERVICES" | grep -q "auth" && [ "$SKIP_DOCKER_BUILDS" = "false" ]; then
              echo "Building auth service (affected and Docker builds enabled)..."
              echo "true" > /tmp/should_build_auth
            elif echo "$AFFECTED_SERVICES" | grep -q "auth" && [ "$SKIP_DOCKER_BUILDS" = "true" ]; then
              echo "Skipping auth Docker build (service affected but Docker builds disabled for optimization)"
              echo "false" > /tmp/should_build_auth
            else
              echo "Skipping auth service build (not affected)"
              echo "false" > /tmp/should_build_auth
            fi

      - run:
          name: Build auth Docker image
          command: |
            if [ "$(cat /tmp/should_build_auth)" = "true" ]; then
              cd services/auth
              
              # Pull cache images
              docker pull ghcr.io/${CIRCLE_PROJECT_USERNAME}/larvrevrstender/auth:cache || true
              docker pull ghcr.io/${CIRCLE_PROJECT_USERNAME}/larvrevrstender/auth:latest || true
              
              # Build multi-stage image with caching
              docker build \
                --cache-from=ghcr.io/${CIRCLE_PROJECT_USERNAME}/larvrevrstender/auth:cache \
                --cache-from=ghcr.io/${CIRCLE_PROJECT_USERNAME}/larvrevrstender/auth:latest \
                --target=production \
                --tag=ghcr.io/${CIRCLE_PROJECT_USERNAME}/larvrevrstender/auth:${CIRCLE_SHA1} \
                --tag=ghcr.io/${CIRCLE_PROJECT_USERNAME}/larvrevrstender/auth:latest \
                --tag=ghcr.io/${CIRCLE_PROJECT_USERNAME}/larvrevrstender/auth:cache \
                --build-arg BUILDKIT_INLINE_CACHE=1 \
                .
              
              # Analyze image size
              echo "=== auth Image Analysis ==="
              docker images ghcr.io/${CIRCLE_PROJECT_USERNAME}/larvrevrstender/auth --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"
              
              # Security scan with Trivy
              if command -v trivy >/dev/null 2>&1; then
                trivy image --exit-code 0 --severity HIGH,CRITICAL ghcr.io/${CIRCLE_PROJECT_USERNAME}/larvrevrstender/auth:${CIRCLE_SHA1}
              fi
            fi

      - run:
          name: Push auth Docker image
          command: |
            if [ "$(cat /tmp/should_build_auth)" = "true" ]; then
              # Login to GitHub Container Registry
              echo $GITHUB_TOKEN | docker login ghcr.io -u $GITHUB_USERNAME --password-stdin
              
              # Push all tags
              docker push ghcr.io/${CIRCLE_PROJECT_USERNAME}/larvrevrstender/auth:${CIRCLE_SHA1}
              docker push ghcr.io/${CIRCLE_PROJECT_USERNAME}/larvrevrstender/auth:latest
              docker push ghcr.io/${CIRCLE_PROJECT_USERNAME}/larvrevrstender/auth:cache
              
              echo "Successfully pushed auth images"
            fi

      - notify-slack:
          status: "passed"
          job_name: "Build auth Service"

  # Additional service build jobs would continue here...
  # (For brevity, showing pattern for first service)

# ============================================================================
# ADDITIONAL JOBS - Advanced features
# ============================================================================

  # Advanced Docker Optimization (Phase 9: Docker Optimization)
  docker-optimization:
    executor: large-executor-php83  # Docker optimization needs large resources
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/workspace
          
      - setup_remote_docker:
          docker_layer_caching: true
          version: 20.10.14
          
      - run:
          name: Setup advanced Docker environment
          command: |
            # Enable BuildKit and experimental features
            echo 'export DOCKER_BUILDKIT=1' >> $BASH_ENV
            echo 'export BUILDKIT_PROGRESS=plain' >> $BASH_ENV
            echo 'export DOCKER_CLI_EXPERIMENTAL=enabled' >> $BASH_ENV
            source $BASH_ENV
            
            # Install Docker Buildx for advanced features
            mkdir -p ~/.docker/cli-plugins
            curl -L "https://github.com/docker/buildx/releases/download/v0.11.2/buildx-v0.11.2.linux-amd64" -o ~/.docker/cli-plugins/docker-buildx
            chmod +x ~/.docker/cli-plugins/docker-buildx
            
            # Create and use advanced builder
            docker buildx create --name advanced-builder --use --bootstrap || true
            docker buildx inspect advanced-builder
            
      - run:
          name: Install optimization tools
          command: |
            # Install dive for image layer analysis
            curl -L "https://github.com/wagoodman/dive/releases/download/v0.10.0/dive_0.10.0_linux_amd64.deb" -o dive.deb
            sudo dpkg -i dive.deb || sudo apt-get install -f -y
            
            # Install trivy for security scanning
            sudo apt-get update
            sudo apt-get install wget apt-transport-https gnupg lsb-release -y
            wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
            echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
            sudo apt-get update
            sudo apt-get install trivy -y
            
      - run:
          name: Advanced Docker image optimization
          command: |
            AFFECTED_SERVICES=$(cat /tmp/workspace/affected_services)
            SKIP_DOCKER_BUILDS=$(cat /tmp/workspace/skip_docker_builds)
            
            # Create optimization report
            mkdir -p /tmp/docker-optimization-reports
            echo "# Docker Optimization Report" > /tmp/docker-optimization-reports/optimization-report.md
            echo "Generated: $(date)" >> /tmp/docker-optimization-reports/optimization-report.md
            echo "" >> /tmp/docker-optimization-reports/optimization-report.md
            
            for service in $AFFECTED_SERVICES; do
              if [ -d "services/$service" ]; then
                echo "=== OPTIMIZING $service DOCKER IMAGE ==="
                cd services/$service
                
                # Check if Dockerfile exists
                if [ ! -f "Dockerfile" ]; then
                  echo "No Dockerfile found for $service, skipping..."
                  cd ../..
                  continue
                fi
                
                # Build optimized image with advanced caching
                echo "Building optimized image for $service..."
                docker buildx build \
                  --platform linux/amd64 \
                  --cache-from=type=registry,ref=ghcr.io/${CIRCLE_PROJECT_USERNAME}/larvrevrstender/$service:cache \
                  --cache-to=type=registry,ref=ghcr.io/${CIRCLE_PROJECT_USERNAME}/larvrevrstender/$service:cache,mode=max \
                  --target=production \
                  --tag=temp-$service:optimized \
                  --build-arg BUILDKIT_INLINE_CACHE=1 \
                  --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
                  --build-arg VCS_REF=${CIRCLE_SHA1} \
                  --load \
                  . || echo "Build failed for $service, continuing..."
                
                # Image size analysis
                if docker images temp-$service:optimized --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}" | grep -q "temp-$service"; then
                  echo "## $service Image Analysis" >> /tmp/docker-optimization-reports/optimization-report.md
                  
                  # Get image size
                  IMAGE_SIZE=$(docker images temp-$service:optimized --format "{{.Size}}")
                  echo "- **Image Size**: $IMAGE_SIZE" >> /tmp/docker-optimization-reports/optimization-report.md
                  
                  # Layer analysis with dive
                  echo "Analyzing layers for $service..."
                  dive temp-$service:optimized --ci --lowestEfficiency=0.95 --highestWastedBytes=20MB > /tmp/docker-optimization-reports/$service-dive-analysis.txt 2>&1 || true
                  
                  # Security scan with caching
                  echo "Running security scan for $service..."
                  trivy image --cache-dir /tmp/trivy-cache --format json --output /tmp/docker-optimization-reports/$service-security.json temp-$service:optimized || true
                  trivy image --cache-dir /tmp/trivy-cache --format table temp-$service:optimized > /tmp/docker-optimization-reports/$service-security.txt || true
                  
                  # Count vulnerabilities
                  if [ -f "/tmp/docker-optimization-reports/$service-security.json" ]; then
                    CRITICAL_VULNS=$(jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL") | .VulnerabilityID' /tmp/docker-optimization-reports/$service-security.json 2>/dev/null | wc -l || echo "0")
                    HIGH_VULNS=$(jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH") | .VulnerabilityID' /tmp/docker-optimization-reports/$service-security.json 2>/dev/null | wc -l || echo "0")
                    echo "- **Critical Vulnerabilities**: $CRITICAL_VULNS" >> /tmp/docker-optimization-reports/optimization-report.md
                    echo "- **High Vulnerabilities**: $HIGH_VULNS" >> /tmp/docker-optimization-reports/optimization-report.md
                  fi
                  
                  # Dockerfile optimization suggestions
                  echo "- **Optimization Suggestions**:" >> /tmp/docker-optimization-reports/optimization-report.md
                  if grep -q "FROM.*:latest" Dockerfile; then
                    echo "  - ⚠️ Use specific version tags instead of 'latest'" >> /tmp/docker-optimization-reports/optimization-report.md
                  fi
                  if ! grep -q "USER" Dockerfile; then
                    echo "  - ⚠️ Consider adding non-root USER directive" >> /tmp/docker-optimization-reports/optimization-report.md
                  fi
                  if ! grep -q "HEALTHCHECK" Dockerfile; then
                    echo "  - 💡 Consider adding HEALTHCHECK instruction" >> /tmp/docker-optimization-reports/optimization-report.md
                  fi
                  if grep -q "RUN.*apt-get update" Dockerfile && ! grep -q "apt-get clean" Dockerfile; then
                    echo "  - 💡 Clean apt cache after installation to reduce image size" >> /tmp/docker-optimization-reports/optimization-report.md
                  fi
                  
                  echo "" >> /tmp/docker-optimization-reports/optimization-report.md
                  
                  # Cleanup temporary image
                  docker rmi temp-$service:optimized || true
                else
                  echo "Failed to build image for $service"
                fi
                
                cd ../..
              fi
            done
            
            # Generate summary
            echo "## Optimization Summary" >> /tmp/docker-optimization-reports/optimization-report.md
            echo "- **Services Analyzed**: $(echo $AFFECTED_SERVICES | wc -w)" >> /tmp/docker-optimization-reports/optimization-report.md
            echo "- **Optimization Date**: $(date)" >> /tmp/docker-optimization-reports/optimization-report.md
            echo "- **Branch**: ${CIRCLE_BRANCH}" >> /tmp/docker-optimization-reports/optimization-report.md
            echo "- **Commit**: ${CIRCLE_SHA1}" >> /tmp/docker-optimization-reports/optimization-report.md
            
            # Display summary
            echo "=== DOCKER OPTIMIZATION COMPLETE ==="
            cat /tmp/docker-optimization-reports/optimization-report.md
            
      - store_artifacts:
          path: /tmp/docker-optimization-reports
          destination: docker-optimization
          
      - run:
          name: Cleanup optimization environment
          command: |
            # Cleanup build cache and temporary files
            docker buildx prune -f || true
            docker system prune -f || true
            rm -rf /tmp/trivy-cache || true
            
      - notify-slack:
          status: "passed"
          job_name: "Docker Optimization"

  # Dockerfile Analysis (Phase 9: Docker Optimization)
  dockerfile-analysis:
    executor: small-executor-php83
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: Analyze Dockerfiles
          command: |
            AFFECTED_SERVICES=$(cat /tmp/workspace/affected_services)
            mkdir -p /tmp/dockerfile-reports
            
            for service in $AFFECTED_SERVICES; do
              if [ -d "services/$service" ] && [ -f "services/$service/Dockerfile" ]; then
                cd services/$service
                echo "=== Analyzing $service Dockerfile ==="
                
                # Basic analysis
                LINES=$(wc -l < Dockerfile)
                LAYERS=$(grep -c "^RUN\|^COPY\|^ADD" Dockerfile || echo "0")
                BASE_IMAGE=$(grep "^FROM" Dockerfile | head -1 | awk '{print $2}')
                
                # Create report
                REPORT="/tmp/dockerfile-reports/$service-analysis.txt"
                echo "Service: $service" > $REPORT
                echo "Lines: $LINES" >> $REPORT
                echo "Layers: $LAYERS" >> $REPORT
                echo "Base: $BASE_IMAGE" >> $REPORT
                
                # Check issues
                if echo "$BASE_IMAGE" | grep -q ":latest"; then
                  echo "Issue: Using latest tag" >> $REPORT
                fi
                if ! grep -q "^USER" Dockerfile; then
                  echo "Issue: No USER directive" >> $REPORT
                fi
                
                cd ../..
              fi
            done
            
            echo "Dockerfile analysis complete"
            ls -la /tmp/dockerfile-reports/
            
      - store_artifacts:
          path: /tmp/dockerfile-reports
          destination: dockerfile-analysis
  
  # Performance Testing Job (Phase 7: Conditional Execution)
  performance-testing:
    executor: xlarge-executor-php83  # Performance testing needs maximum resources
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/workspace
          
      - run:
          name: Check if performance tests should run
          command: |
            SKIP_PERFORMANCE_TESTS=$(cat /tmp/workspace/skip_performance_tests)
            
            if [ "$SKIP_PERFORMANCE_TESTS" = "true" ]; then
              echo "Skipping performance tests (optimization enabled)"
              echo "false" > /tmp/should_run_performance_tests
            else
              echo "Running performance tests (required for this change type)"
              echo "true" > /tmp/should_run_performance_tests
            fi
            
      - run:
          name: Install performance testing tools
          command: |
            if [ "$(cat /tmp/should_run_performance_tests)" = "true" ]; then
              # Install k6 for load testing
              sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
              echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
              sudo apt-get update
              sudo apt-get install k6
            else
              echo "Skipping performance test tool installation"
            fi
            
      - run:
          name: Run performance tests
          command: |
            if [ "$(cat /tmp/should_run_performance_tests)" = "true" ]; then
              # Run load tests for affected services
              AFFECTED_SERVICES=$(cat /tmp/workspace/affected_services)
              
              for service in $AFFECTED_SERVICES; do
                if [ -f "tests/performance/$service-load-test.js" ]; then
                  echo "Running performance tests for $service..."
                  k6 run tests/performance/$service-load-test.js
                fi
              done
            else
              echo "Performance tests skipped due to conditional execution optimization"
            fi
            
      - store_artifacts:
          path: performance-results/
          destination: performance/
          
      - notify-slack:
          status: "passed"
          job_name: "Performance Testing"
  
  # Blue-Green Deployment Job
  blue-green-deployment:
    executor: medium-executor-php83  # Deployment needs medium resources
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/workspace
          
      - run:
          name: Deploy to staging (blue-green)
          command: |
            echo "Deploying affected services to staging environment..."
            AFFECTED_SERVICES=$(cat /tmp/workspace/affected_services)
            
            # Deploy each affected service
            for service in $AFFECTED_SERVICES; do
              echo "Deploying $service..."
              # Deployment logic would go here
              # This would integrate with your deployment infrastructure
            done
            
      - run:
          name: Run health checks
          command: |
