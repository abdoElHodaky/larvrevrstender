services:
  # Database Services
  mysql:
    image: mysql:8.0
    container_name: reverse_tender_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: reverse_tender
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    networks:
      - reverse_tender_network

  redis:
    image: redis:7-alpine
    container_name: reverse_tender_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - reverse_tender_network

  # Gateway Service - RPC Gateway with Laravel Octane + FrankenPHP
  gateway-service:
    build:
      context: .
      dockerfile: services/gateway-service/Dockerfile
    container_name: gateway_service_octane
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Gateway Service
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=gateway_service
      - DB_USERNAME=root
      - DB_PASSWORD=root_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # RPC Configuration
      - RPC_ENABLED=true
      - RPC_TIMEOUT=30
      - RPC_RETRY_ATTEMPTS=3
      # Circuit Breaker Configuration
      - CIRCUIT_BREAKER_ENABLED=true
      - CIRCUIT_BREAKER_FAILURE_THRESHOLD=5
      - CIRCUIT_BREAKER_TIMEOUT=30
      - CIRCUIT_BREAKER_RECOVERY_TIMEOUT=60
      # Workflow Orchestration
      - WORKFLOW_ENABLED=true
      - WORKFLOW_MAX_RETRIES=3
      - WORKFLOW_TIMEOUT=300
      # Service Discovery
      - SERVICE_DISCOVERY_ENABLED=true
      - AUTH_SERVICE_URL=http://auth-service:8001
      - USER_SERVICE_URL=http://user-service:8002
      - BIDDING_SERVICE_URL=http://bidding-service:8003
      - ORDER_SERVICE_URL=http://order-service:8004
      - PAYMENT_SERVICE_URL=http://payment-service:8005
      - ANALYTICS_SERVICE_URL=http://analytics-service:8006
      - VIN_OCR_SERVICE_URL=http://vin-ocr-service:8007
      - NOTIFICATION_SERVICE_URL=http://notification-service:8008
      # Laravel Octane Configuration
      - OCTANE_SERVER=frankenphp
      - OCTANE_HTTPS=false
      - OCTANE_WORKERS=4
      - OCTANE_TASK_WORKERS=6
      - OCTANE_MAX_REQUESTS=500
      - OCTANE_MEMORY_LIMIT=512M
      # FrankenPHP Configuration
      - FRANKENPHP_WORKER_MODE=true
      - FRANKENPHP_NUM_THREADS=4
    depends_on:
      - mysql
      - redis
    volumes:
      - ./services/gateway-service:/var/www/html
    networks:
      - reverse_tender_network

  # Microservices with Laravel Octane + FrankenPHP
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: auth_service_octane
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - APP_NAME=Auth Service
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:8001
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=auth_service
      - DB_USERNAME=root
      - DB_PASSWORD=root_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # RPC Configuration
      - RPC_ENABLED=true
      - RPC_PORT=8001
      - GATEWAY_SERVICE_URL=http://gateway-service:8000
      # Circuit Breaker Configuration
      - CIRCUIT_BREAKER_ENABLED=true
      - OCTANE_SERVER=frankenphp
      - OCTANE_WORKERS=4
      - OCTANE_MAX_REQUESTS=500
      - OCTANE_MAX_EXECUTION_TIME=30
    depends_on:
      - mysql
      - redis
    volumes:
      - ./services/auth-service:/app
    networks:
      - reverse_tender_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 30s
      timeout: 10s
      retries: 3

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: user_service_octane
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - APP_NAME=User Service
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:8001
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=user_service
      - DB_USERNAME=root
      - DB_PASSWORD=root_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OCTANE_SERVER=frankenphp
      - OCTANE_WORKERS=4
      - OCTANE_MAX_REQUESTS=500
      - OCTANE_MAX_EXECUTION_TIME=30
    depends_on:
      - mysql
      - redis
    volumes:
      - ./services/user-service:/app
    networks:
      - reverse_tender_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 30s
      timeout: 10s
      retries: 3

  bidding-service:
    build:
      context: .
      dockerfile: services/bidding-service/Dockerfile
    container_name: bidding_service_octane
    restart: unless-stopped
    ports:
      - "8002:8000"
    environment:
      - APP_NAME=Bidding Service
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:8002
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=bidding_service
      - DB_USERNAME=root
      - DB_PASSWORD=root_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BROADCAST_CONNECTION=pusher
      - OCTANE_SERVER=frankenphp
      - OCTANE_WORKERS=6
      - OCTANE_MAX_REQUESTS=1000
      - OCTANE_MAX_EXECUTION_TIME=60
    depends_on:
      - mysql
      - redis
    volumes:
      - ./services/bidding-service:/app
    networks:
      - reverse_tender_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 30s
      timeout: 10s
      retries: 3

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: order_service_octane
    restart: unless-stopped
    ports:
      - "8003:8000"
    environment:
      - APP_NAME=Order Service
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:8003
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=order_service
      - DB_USERNAME=root
      - DB_PASSWORD=root_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OCTANE_SERVER=frankenphp
      - OCTANE_WORKERS=4
      - OCTANE_MAX_REQUESTS=500
      - OCTANE_MAX_EXECUTION_TIME=30
    depends_on:
      - mysql
      - redis
    volumes:
      - ./services/order-service:/app
    networks:
      - reverse_tender_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 30s
      timeout: 10s
      retries: 3

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    container_name: payment_service_octane
    restart: unless-stopped
    ports:
      - "8004:8000"
    environment:
      - APP_NAME=Payment Service
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:8004
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=payment_service
      - DB_USERNAME=root
      - DB_PASSWORD=root_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OCTANE_SERVER=frankenphp
      - OCTANE_WORKERS=4
      - OCTANE_MAX_REQUESTS=500
      - OCTANE_MAX_EXECUTION_TIME=30
    depends_on:
      - mysql
      - redis
    volumes:
      - ./services/payment-service:/app
    networks:
      - reverse_tender_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 30s
      timeout: 10s
      retries: 3

  analytics-service:
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
    container_name: analytics_service_octane
    restart: unless-stopped
    ports:
      - "8005:8000"
    environment:
      - APP_NAME=Analytics Service
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:8005
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=analytics_service
      - DB_USERNAME=root
      - DB_PASSWORD=root_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OCTANE_SERVER=frankenphp
      - OCTANE_WORKERS=4
      - OCTANE_MAX_REQUESTS=500
      - OCTANE_MAX_EXECUTION_TIME=30
    depends_on:
      - mysql
      - redis
    volumes:
      - ./services/analytics-service:/app
    networks:
      - reverse_tender_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 30s
      timeout: 10s
      retries: 3

  vin-ocr-service:
    build:
      context: .
      dockerfile: services/vin-ocr-service/Dockerfile
    container_name: vin_ocr_service_octane
    restart: unless-stopped
    ports:
      - "8006:8000"
    environment:
      - APP_NAME=VIN OCR Service
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:8006
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=vin_ocr_service
      - DB_USERNAME=root
      - DB_PASSWORD=root_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OCTANE_SERVER=frankenphp
      - OCTANE_WORKERS=4
      - OCTANE_MAX_REQUESTS=500
      - OCTANE_MAX_EXECUTION_TIME=30
    depends_on:
      - mysql
      - redis
    volumes:
      - ./services/vin-ocr-service:/app
    networks:
      - reverse_tender_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 30s
      timeout: 10s
      retries: 3

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: notification_service_octane
    restart: unless-stopped
    ports:
      - "8007:8000"
    environment:
      - APP_NAME=Notification Service
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:8007
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=notification_service
      - DB_USERNAME=root
      - DB_PASSWORD=root_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OCTANE_SERVER=frankenphp
      - OCTANE_WORKERS=4
      - OCTANE_MAX_REQUESTS=500
      - OCTANE_MAX_EXECUTION_TIME=30
    depends_on:
      - mysql
      - redis
    volumes:
      - ./services/notification-service:/app
    networks:
      - reverse_tender_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API Gateway (Nginx) - Updated for Octane
  nginx:
    image: nginx:alpine
    container_name: reverse_tender_gateway_octane
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/ssl:/etc/nginx/ssl
    depends_on:
      - auth-service
      - user-service
      - bidding-service
      - order-service
      - payment-service
      - analytics-service
      - vin-ocr-service
      - notification-service
    networks:
      - reverse_tender_network

  # Shared Octane Monitoring Service
  octane-monitor:
    image: dunglas/frankenphp:php8.3
    container_name: octane_monitor
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - MONITOR_SERVICES=auth-service:8000,user-service:8001,bidding-service:8002,order-service:8003,payment-service:8004,analytics-service:8005,vin-ocr-service:8006,notification-service:8007
    volumes:
      - ./monitoring:/app
    networks:
      - reverse_tender_network
    command: >
      sh -c "
        echo 'Creating Octane monitoring dashboard...' &&
        mkdir -p /app &&
        echo '<?php
        header(\"Content-Type: application/json\");
        \$$services = explode(\",\", \$$_ENV[\"MONITOR_SERVICES\"] ?? \"\");
        \$$status = [];
        foreach (\$$services as \$$service) {
          list(\$$name, \$$port) = explode(\":\", \$$service);
          \$$url = \"http://\" . \$$name . \":8000/up\";
          \$$ch = curl_init(\$$url);
          curl_setopt(\$$ch, CURLOPT_RETURNTRANSFER, true);
          curl_setopt(\$$ch, CURLOPT_TIMEOUT, 5);
          \$$response = curl_exec(\$$ch);
          \$$httpCode = curl_getinfo(\$$ch, CURLINFO_HTTP_CODE);
          curl_close(\$$ch);
          \$$status[\$$name] = [
            \"status\" => \$$httpCode === 200 ? \"healthy\" : \"unhealthy\",
            \"port\" => \$$port,
            \"response_time\" => curl_getinfo(\$$ch, CURLINFO_TOTAL_TIME)
          ];
        }
        echo json_encode([\"services\" => \$$status, \"timestamp\" => date(\"c\")]);
        ?>' > /app/index.php &&
        php -S 0.0.0.0:9000 -t /app
      "

  # Queue Workers with Horizon
  horizon:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: reverse_tender_horizon_octane
    restart: unless-stopped
    command: php artisan horizon
    environment:
      - APP_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    volumes:
      - ./services/auth-service:/app
    networks:
      - reverse_tender_network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  reverse_tender_network:
    driver: bridge
