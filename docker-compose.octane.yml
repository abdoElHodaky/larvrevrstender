services:
  # Database Services
  mysql:
    image: mysql:8.0
    container_name: reverse_tender_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: reverse_tender
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    networks:
      - reverse_tender_network

  redis:
    image: redis:7-alpine
    container_name: reverse_tender_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - reverse_tender_network

  # Gateway Service - RPC Gateway with Laravel Octane + FrankenPHP
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: gateway_service_octane
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Gateway Service
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=gateway_service
      - DB_USERNAME=root
      - DB_PASSWORD=root_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # RPC Configuration
      - RPC_ENABLED=true
      - RPC_TIMEOUT=30
      - RPC_RETRY_ATTEMPTS=3
      # Circuit Breaker Configuration
      - CIRCUIT_BREAKER_ENABLED=true
      - CIRCUIT_BREAKER_FAILURE_THRESHOLD=5
      - CIRCUIT_BREAKER_TIMEOUT=30
      - CIRCUIT_BREAKER_RECOVERY_TIMEOUT=60
      # Workflow Orchestration
      - WORKFLOW_ENABLED=true
      - WORKFLOW_MAX_RETRIES=3
      - WORKFLOW_TIMEOUT=300
      # Service Discovery
      - SERVICE_DISCOVERY_ENABLED=true
      - AUTH_SERVICE_URL=http://auth:8001
      - USER_SERVICE_URL=http://users:8002
      - BIDDING_SERVICE_URL=http://bidding:8003
      - ORDER_SERVICE_URL=http://orders:8004
      - PAYMENT_SERVICE_URL=http://payments:8005
      - ANALYTICS_SERVICE_URL=http://analytics:8006
      - VIN_OCR_SERVICE_URL=http://vin-ocr:8007
      - NOTIFICATION_SERVICE_URL=http://notifications:8008
      # Laravel Octane Configuration
      - OCTANE_SERVER=frankenphp
      - OCTANE_HTTPS=false
      - OCTANE_WORKERS=4
      - OCTANE_TASK_WORKERS=6
      - OCTANE_MAX_REQUESTS=500
      - OCTANE_MEMORY_LIMIT=512M
      # FrankenPHP Configuration
      - FRANKENPHP_WORKER_MODE=true
      - FRANKENPHP_NUM_THREADS=4
    depends_on:
      - mysql
      - redis
    volumes:
      - ./services/gateway:/var/www/html
    networks:
      - reverse_tender_network

  # Microservices with Laravel Octane + FrankenPHP
  auth:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: auth_service_octane
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - APP_NAME=Auth Service
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:8001
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=auth_service
      - DB_USERNAME=root
      - DB_PASSWORD=root_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # RPC Configuration
      - RPC_ENABLED=true
      - RPC_PORT=8001
      - GATEWAY_SERVICE_URL=http://gateway:8000
      # Circuit Breaker Configuration
      - CIRCUIT_BREAKER_ENABLED=true
      - OCTANE_SERVER=frankenphp
      - OCTANE_WORKERS=4
      - OCTANE_MAX_REQUESTS=500
      - OCTANE_MAX_EXECUTION_TIME=30
    depends_on:
      - mysql
      - redis
    volumes:
      - ./services/auth:/app
    networks:
      - reverse_tender_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 30s
      timeout: 10s
      retries: 3

  users:
    build:
      context: ./services/users
      dockerfile: Dockerfile
    container_name: user_service_octane
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - APP_NAME=User Service
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:8001
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=user_service
      - DB_USERNAME=root
      - DB_PASSWORD=root_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OCTANE_SERVER=frankenphp
      - OCTANE_WORKERS=4
      - OCTANE_MAX_REQUESTS=500
      - OCTANE_MAX_EXECUTION_TIME=30
    depends_on:
      - mysql
      - redis
    volumes:
      - ./services/users:/app
    networks:
      - reverse_tender_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 30s
      timeout: 10s
      retries: 3

  bidding:
    build:
      context: ./services/bidding
      dockerfile: Dockerfile
    container_name: bidding_service_octane
    restart: unless-stopped
    ports:
      - "8002:8000"
    environment:
      - APP_NAME=Bidding Service
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:8002
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=bidding_service
      - DB_USERNAME=root
      - DB_PASSWORD=root_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BROADCAST_CONNECTION=pusher
      - OCTANE_SERVER=frankenphp
      - OCTANE_WORKERS=6
      - OCTANE_MAX_REQUESTS=1000
      - OCTANE_MAX_EXECUTION_TIME=60
    depends_on:
      - mysql
      - redis
    volumes:
      - ./services/bidding:/app
    networks:
      - reverse_tender_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 30s
      timeout: 10s
      retries: 3

  orders:
    build:
      context: ./services/orders
      dockerfile: Dockerfile
    container_name: order_service_octane
    restart: unless-stopped
    ports:
      - "8003:8000"
    environment:
      - APP_NAME=Order Service
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:8003
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=order_service
      - DB_USERNAME=root
      - DB_PASSWORD=root_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OCTANE_SERVER=frankenphp
      - OCTANE_WORKERS=4
      - OCTANE_MAX_REQUESTS=500
      - OCTANE_MAX_EXECUTION_TIME=30
    depends_on:
      - mysql
      - redis
    volumes:
      - ./services/orders:/app
    networks:
      - reverse_tender_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 30s
      timeout: 10s
      retries: 3

  payments:
    build:
      context: ./services/payments
      dockerfile: Dockerfile
    container_name: payment_service_octane
    restart: unless-stopped
    ports:
      - "8004:8000"
    environment:
      - APP_NAME=Payment Service
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:8004
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=payment_service
      - DB_USERNAME=root
      - DB_PASSWORD=root_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OCTANE_SERVER=frankenphp
      - OCTANE_WORKERS=4
      - OCTANE_MAX_REQUESTS=500
      - OCTANE_MAX_EXECUTION_TIME=30
    depends_on:
      - mysql
      - redis
    volumes:
      - ./services/payments:/app
    networks:
      - reverse_tender_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 30s
      timeout: 10s
      retries: 3

  analytics:
    build:
      context: ./services/analytics
      dockerfile: Dockerfile
    container_name: analytics_service_octane
    restart: unless-stopped
    ports:
      - "8005:8000"
    environment:
      - APP_NAME=Analytics Service
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:8005
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=analytics_service
      - DB_USERNAME=root
      - DB_PASSWORD=root_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OCTANE_SERVER=frankenphp
      - OCTANE_WORKERS=4
      - OCTANE_MAX_REQUESTS=500
      - OCTANE_MAX_EXECUTION_TIME=30
    depends_on:
      - mysql
      - redis
    volumes:
      - ./services/analytics:/app
    networks:
      - reverse_tender_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 30s
      timeout: 10s
      retries: 3

  vin-ocr:
    build:
      context: ./services/vin-ocr
      dockerfile: Dockerfile
    container_name: vin_ocr_service_octane
    restart: unless-stopped
    ports:
      - "8006:8000"
    environment:
      - APP_NAME=VIN OCR Service
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:8006
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=vin_ocr_service
      - DB_USERNAME=root
      - DB_PASSWORD=root_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OCTANE_SERVER=frankenphp
      - OCTANE_WORKERS=4
      - OCTANE_MAX_REQUESTS=500
      - OCTANE_MAX_EXECUTION_TIME=30
    depends_on:
      - mysql
      - redis
    volumes:
      - ./services/vin-ocr:/app
    networks:
      - reverse_tender_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 30s
      timeout: 10s
      retries: 3

  notifications:
    build:
      context: ./services/notifications
      dockerfile: Dockerfile
    container_name: notification_service_octane
    restart: unless-stopped
    ports:
      - "8007:8000"
    environment:
      - APP_NAME=Notification Service
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:8007
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=notification_service
      - DB_USERNAME=root
      - DB_PASSWORD=root_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OCTANE_SERVER=frankenphp
      - OCTANE_WORKERS=4
      - OCTANE_MAX_REQUESTS=500
      - OCTANE_MAX_EXECUTION_TIME=30
    depends_on:
      - mysql
      - redis
    volumes:
      - ./services/notifications:/app
    networks:
      - reverse_tender_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API Gateway (Nginx) - Updated for Octane
  nginx:
    image: nginx:alpine
    container_name: reverse_tender_gateway_octane
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/ssl:/etc/nginx/ssl
    depends_on:
      - auth
      - users
      - bidding
      - orders
      - payments
      - analytics
      - vin-ocr
      - notifications
    networks:
      - reverse_tender_network

  # Shared Octane Monitoring Service
  octane-monitor:
    image: dunglas/frankenphp:php8.3
    container_name: octane_monitor
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - MONITOR_SERVICES=auth:8000,users:8001,bidding:8002,orders:8003,payments:8004,analytics:8005,vin-ocr:8006,notifications:8007
    volumes:
      - ./monitoring:/app
    networks:
      - reverse_tender_network
    command: >
      sh -c "
        echo 'Creating Octane monitoring dashboard...' &&
        mkdir -p /app &&
        echo '<?php
        header(\"Content-Type: application/json\");
        \$$services = explode(\",\", \$$_ENV[\"MONITOR_SERVICES\"] ?? \"\");
        \$$status = [];
        foreach (\$$services as \$$service) {
          list(\$$name, \$$port) = explode(\":\", \$$service);
          \$$url = \"http://\" . \$$name . \":8000/up\";
          \$$ch = curl_init(\$$url);
          curl_setopt(\$$ch, CURLOPT_RETURNTRANSFER, true);
          curl_setopt(\$$ch, CURLOPT_TIMEOUT, 5);
          \$$response = curl_exec(\$$ch);
          \$$httpCode = curl_getinfo(\$$ch, CURLINFO_HTTP_CODE);
          curl_close(\$$ch);
          \$$status[\$$name] = [
            \"status\" => \$$httpCode === 200 ? \"healthy\" : \"unhealthy\",
            \"port\" => \$$port,
            \"response_time\" => curl_getinfo(\$$ch, CURLINFO_TOTAL_TIME)
          ];
        }
        echo json_encode([\"services\" => \$$status, \"timestamp\" => date(\"c\")]);
        ?>' > /app/index.php &&
        php -S 0.0.0.0:9000 -t /app
      "

  # Queue Workers with Horizon
  horizon:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: reverse_tender_horizon_octane
    restart: unless-stopped
    command: php artisan horizon
    environment:
      - APP_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    volumes:
      - ./services/auth:/app
    networks:
      - reverse_tender_network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  reverse_tender_network:
    driver: bridge
