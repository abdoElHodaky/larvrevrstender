version: '3.8'

services:
  # Database Services
  mysql:
    image: mysql:8.0
    container_name: reverse_tender_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: reverse_tender
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    networks:
      - reverse_tender_network

  # PostgreSQL Database (Migration Target)
  postgresql:
    image: postgres:15-alpine
    container_name: reverse_tender_postgresql
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
      - ./migration/docker/postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - reverse_tender_network
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c pg_stat_statements.max=10000
      -c log_statement=all
      -c log_min_duration_statement=1000

  # PgBouncer Connection Pooler
  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    container_name: reverse_tender_pgbouncer
    restart: unless-stopped
    environment:
      DATABASES_HOST: postgresql
      DATABASES_PORT: 5432
      DATABASES_USER: postgres
      DATABASES_PASSWORD: postgres_password
      DATABASES_DBNAME: postgres
      POOL_MODE: transaction
      SERVER_RESET_QUERY: DISCARD ALL
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 25
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      SERVER_LIFETIME: 3600
      SERVER_IDLE_TIMEOUT: 600
    ports:
      - "6432:5432"
    depends_on:
      - postgresql
    networks:
      - reverse_tender_network

  redis:
    image: redis:7-alpine
    container_name: reverse_tender_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - reverse_tender_network

  # Gateway Service - RPC Gateway with Cross-Service Infrastructure
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: gateway
    container_name: gateway_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Gateway Service
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=gateway_service
      - DB_USERNAME=root
      - DB_PASSWORD=root_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # RPC Configuration
      - RPC_ENABLED=true
      - RPC_PORT=8000
      - RPC_TIMEOUT=30
      - RPC_RETRY_ATTEMPTS=3
      # Circuit Breaker Configuration
      - CIRCUIT_BREAKER_ENABLED=true
      - CIRCUIT_BREAKER_FAILURE_THRESHOLD=5
      - CIRCUIT_BREAKER_TIMEOUT=30
      - CIRCUIT_BREAKER_RECOVERY_TIMEOUT=60
      # Workflow Orchestration
      - WORKFLOW_ENABLED=true
      - WORKFLOW_MAX_RETRIES=3
      - WORKFLOW_TIMEOUT=300
      # Service Discovery
      - SERVICE_DISCOVERY_ENABLED=true
      - AUTH_SERVICE_URL=http://auth:8001
      - USER_SERVICE_URL=http://users:8002
      - ANALYTICS_SERVICE_URL=http://analytics:8003
      - PAYMENT_SERVICE_URL=http://payments:8004
      - BIDDING_SERVICE_URL=http://bidding:8005
      - NOTIFICATION_SERVICE_URL=http://notifications:8006
      - ORDER_SERVICE_URL=http://orders:8007
      - VIN_OCR_SERVICE_URL=http://vin-ocr:8008
      - AUCTION_SERVICE_URL=http://auctions:8009
      # Laravel Octane Configuration
      - OCTANE_SERVER=frankenphp
      - OCTANE_WORKERS=4
      - OCTANE_TASK_WORKERS=6
      - OCTANE_MAX_REQUESTS=500
      - OCTANE_MEMORY_LIMIT=512M
      # FrankenPHP Configuration
      - FRANKENPHP_WORKER_MODE=true
      - FRANKENPHP_NUM_THREADS=4
      # PHP Opcache Configuration
      - PHP_OPCACHE_ENABLE=1
      - PHP_OPCACHE_MEMORY_CONSUMPTION=256
      - PHP_OPCACHE_MAX_ACCELERATED_FILES=20000
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=0
    depends_on:
      - mysql
      - redis
    volumes:
      - ./services/gateway:/var/www/html
      - ./shared:/var/www/html/shared
    networks:
      - reverse_tender_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

