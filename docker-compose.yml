      - RATE_LIMIT_DECAY_MINUTES=1
      # RPC Handler Configuration
      - RPC_HANDLER_ENABLED=true
      - SERVICE_DISCOVERY_ENABLED=true
      - SERVICE_REGISTRY_URL=http://gateway:8000/registry
      - HEALTH_CHECK_INTERVAL=30
      - SERVICE_DISCOVERY_TIMEOUT=5
      # Caching Configuration
      - SHARED_CACHE_ENABLED=true
      - SHARED_CACHE_DRIVER=redis
      - SHARED_CACHE_PREFIX=shared:
      - SHARED_CACHE_TTL=3600
      - CACHE_COMPRESSION_ENABLED=true
      - CACHE_COMPRESSION_ALGORITHM=gzip
      # Event Publishing Configuration
      - EVENT_PUBLISHING_ENABLED=true
      - EVENT_DRIVER=redis
      - EVENT_DEFAULT_CHANNEL=shared-events
      - EVENT_AUDIT_CHANNEL=audit-events
      - EVENT_METRICS_CHANNEL=metrics-events
      - EVENT_RETRY_ENABLED=true
      - EVENT_MAX_RETRY_ATTEMPTS=3
      - EVENT_RETRY_DELAY=1000
      # Security Configuration
      - SHARED_ENCRYPTION_ENABLED=true
      - SHARED_ENCRYPTION_ALGORITHM=AES-256-GCM
      - SHARED_AUTH_ENABLED=true
      - SHARED_AUTH_DRIVER=jwt
      - SECURITY_RATE_LIMITING_ENABLED=true
      - SECURITY_MAX_REQUESTS=1000
      - SECURITY_WINDOW_MINUTES=60
      # Monitoring Configuration
      - METRICS_ENABLED=true
      - METRICS_DRIVER=prometheus
      - METRICS_ENDPOINT=/metrics
      - TRACING_ENABLED=true
      - TRACING_DRIVER=jaeger
      - TRACING_SERVICE_NAME=shared-service
      - HEALTH_CHECKS_ENABLED=true
      - HEALTH_CHECK_ENDPOINT=/health
      - HEALTH_CHECK_TIMEOUT=5
      # Circuit Breaker Configuration
      - CIRCUIT_BREAKER_ENABLED=true
      - CIRCUIT_BREAKER_FAILURE_THRESHOLD=5
      - CIRCUIT_BREAKER_RECOVERY_TIMEOUT=60
      # Laravel Octane Configuration
      - OCTANE_SERVER=frankenphp
      - OCTANE_WORKERS=4
      - OCTANE_TASK_WORKERS=6
      - OCTANE_MAX_REQUESTS=500
      - OCTANE_MEMORY_LIMIT=512M
      # FrankenPHP Configuration
      - FRANKENPHP_WORKER_MODE=true
      - FRANKENPHP_NUM_THREADS=4
      # PHP Opcache Configuration
      - PHP_OPCACHE_ENABLE=1
      - PHP_OPCACHE_MEMORY_CONSUMPTION=256
      - PHP_OPCACHE_MAX_ACCELERATED_FILES=20000
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=0
    depends_on:
      - mysql
      - redis
    volumes:
      - ./services/shared:/var/www/html
    networks:
      - reverse_tender_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # API Gateway (Nginx)
  nginx:
    image: nginx:alpine
    container_name: reverse_tender_gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/ssl:/etc/nginx/ssl
    depends_on:
      - gateway
      - auth
      - users
      - analytics
      - payments
      - bidding
      - notifications
      - orders
      - vin-ocr
      - auctions
      - shared-service
    networks:
      - reverse_tender_network

  # Queue Workers
  horizon:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: auth
    container_name: reverse_tender_horizon
    restart: unless-stopped
    command: php artisan horizon
    environment:
      - APP_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # RPC Configuration
      - RPC_ENABLED=true
      - GATEWAY_SERVICE_URL=http://gateway:8000
      # Circuit Breaker Configuration
      - CIRCUIT_BREAKER_ENABLED=true
      # PHP Opcache Configuration
      - PHP_OPCACHE_ENABLE=1
      - PHP_OPCACHE_MEMORY_CONSUMPTION=256
      - PHP_OPCACHE_MAX_ACCELERATED_FILES=20000
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=0
    depends_on:
      - redis
      - gateway
    volumes:
      - ./services/auth:/var/www/html
      - ./shared:/var/www/html/shared
    networks:
      - reverse_tender_network

volumes:
  mysql_data:
    driver: local
  postgresql_data:
    driver: local
  redis_data:
    driver: local

networks:
  reverse_tender_network:
    driver: bridge
